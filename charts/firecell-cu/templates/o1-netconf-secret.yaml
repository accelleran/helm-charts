{{- $cpClaim := and .Values.cuCp.enabled .Values.cuCp.o1.enabled .Values.cuCp.o1.stateClaim }}
{{- $upClaim := and .Values.cuUp.enabled (dig "o1" "enabled" false .Values.cuUp) (dig "o1" "stateClaim" "" .Values.cuUp) }}
{{- if and $cpClaim $upClaim (eq (toString $cpClaim) (toString $upClaim)) }}
{{- fail (printf "cuCp.o1.stateClaim and cuUp.o1.stateClaim are both %q: the CU-CP and the CU-UP would share one O1 state folder (host key, Secret-in-use mark, saved users); give each its own claim" (toString $cpClaim)) }}
{{- end }}
{{- $ns := include "firecell-cu.namespace" . }}
{{- if and .Values.cuCp.enabled .Values.cuCp.o1.enabled }}
{{- $labels := printf "app: cu-cp\n%s" (include "firecell-cu.labels" (dict "root" $ "component" "cu-cp")) }}
{{- with include "firecell-cu.o1NetconfSecretObject" (dict "netconf" .Values.cuCp.o1.netconf "name" "cu-cp" "path" "cuCp.o1.netconf" "image" (include "firecell-cu.image" (dict "root" $ "image" .Values.cuCp.image)) "namespace" $ns "labels" $labels) | trim }}
---
{{ . }}
{{- end }}
{{- end }}
{{- $o1 := .Values.cuUp.o1 | default dict }}
{{- if and .Values.cuUp.enabled $o1.enabled }}
{{- $labels := printf "app: cu-up\n%s" (include "firecell-cu.labels" (dict "root" $ "component" "cu-up")) }}
{{- with include "firecell-cu.o1NetconfSecretObject" (dict "netconf" $o1.netconf "name" "cu-up" "path" "cuUp.o1.netconf" "image" (include "firecell-cu.image" (dict "root" $ "image" .Values.cuUp.image)) "namespace" $ns "labels" $labels) | trim }}
---
{{ . }}
{{- end }}
{{- end }}
