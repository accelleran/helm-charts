{{- if and .Values.cuUp.enabled .Values.cuUp.n3.enabled }}
{{- $n3 := .Values.cuUp.n3 }}
{{- $cfg := dict
  "cniVersion" "0.3.1"
  "type" "macvlan"
  "master" $n3.master
  "mode" "bridge"
  "ipam" (dict "type" "static" "addresses" (list (dict "address" $n3.cidr))) }}
{{- with $n3.mac }}
{{- $_ := set $cfg "mac" . }}
{{- end }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: cu-up-n3
  namespace: {{ include "firecell-cu.namespace" . }}
  labels:
    {{- include "firecell-cu.labels" (dict "root" $ "component" "cu-up") | nindent 4 }}
spec:
  config: {{ toJson $cfg | quote }}
{{- end }}
