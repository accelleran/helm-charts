# Firecell RAN CU - Ocudu O-CU-CP and O-CU-UP.
#
# DUs are separate firecell-du releases that reach the CU-CP through the
# headless Service cuCpService.name. Values the CU and its DUs must agree on
# (global.image, gnb.*) belong in one shared site file passed to every release.

global:
  # -- Namespace for every object. Empty uses the release namespace.
  namespace: ""
  # -- Ocudu runtime image. Components may override it.
  image: docker.io/accelleran/ran:0.2.0
  # -- Pull policy for the Ocudu image. Use Never for images imported into containerd.
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets for every pod.
  imagePullSecrets: []
  # -- Default nodeSelector for every pod. Components may override it.
  nodeSelector: {}
  # -- Default tolerations for every pod. Components may override them.
  tolerations: []

# gNB identity. Must be identical in the CU release and every DU release.
gnb:
  # -- gNB-ID.
  gnbId: 1
  # -- gNB-ID length in bits.
  gnbIdBitLength: 22
  # -- Serving PLMN (MCC+MNC).
  plmn: "00101"
  # -- Tracking area code.
  tac: 1
  # -- Slices. sst/sd go to the CU-CP TAI slice list (schedCfg is only read by firecell-du).
  slices:
    - sst: 1
      sd: 1
      schedCfg:
        min_prb_policy_ratio: 15
        max_prb_policy_ratio: 100
        priority: 10

amf:
  # -- AMF N2 address. With firecell-core this is the headless oai-amf-n2 Service.
  addr: oai-amf-n2.firecell-core.svc.cluster.local
  # -- AMF NGAP SCTP port.
  port: 38412
  # -- NGAP procedure timeout (ms).
  procedureTimeoutMs: 15000

cuCp:
  # -- Deploy CU-CP and its headless F1/E1 Service.
  enabled: true
  # -- Image override (defaults to global.image).
  image: ""
  # -- nodeSelector override (defaults to global.nodeSelector).
  nodeSelector: {}
  # -- Tolerations override (defaults to global.tolerations).
  tolerations: []
  # -- CPU list for taskset. Empty runs unpinned.
  cpus: ""
  # -- Seconds the CU-CP waits for PDU session setup before releasing the UE.
  requestPduSessionTimeout: 15
  # -- NETCONF (netopeer2) so the NMS can read /ocudu-performance ue-context.
  o1:
    enabled: false
    yangSearchPath: /usr/local/yang
    restartOnColdCommit: false
    # -- netopeer2 log level: error, warning, info (a few [INF] lines per NMS request) or debug; 0-3 also accepted. Images built before the entrypoint read NETCONF_VERBOSITY always log at info.
    netconfVerbosity: warning
    # -- Host directory kept across restarts (O1 overlay and NETCONF host key). Give each CU-CP on a node its own. Empty uses /var/lib/firecell/ocudu/cu-cp.
    statePath: ""
    # -- Existing PersistentVolumeClaim for the O1 state (O1 overlay, NETCONF host key, mode file) instead of the statePath host directory, so the state moves with the pod when it is rescheduled to another node. Empty: the host directory; then pin the CU-CP to one node (nodeSelector kubernetes.io/hostname), or a move to another node gives it a new host key and loses its O1 overlay.
    stateClaim: ""
    # NETCONF login and access control (KI-026). With nothing set the CU-CP keeps the lab
    # login netconf/netconf (group operator) and logs a WARNING. Needs an image that reads
    # /etc/ocudu/o1-netconf (RC3 or later); see the README of the image's docker/o1.
    netconf:
      # -- Existing Secret mounted at /etc/ocudu/o1-netconf (keys username, password and/or authorized_keys). Recommended: one Secret per RAN namespace, named by every element. The CU-CP reads it at start only: restart it after changing the Secret.
      existingSecret: ""
      # -- User (letters, digits, . _ -, at most 64 characters, not root) of a chart-made Secret cu-cp-o1-netconf. Empty: netconf.
      username: ""
      # -- Password of a chart-made Secret cu-cp-o1-netconf (clear text on one line, at most 256 characters, or a $6$/$5$ crypt hash). The pod rolls when it changes.
      password: ""
      # -- NMS public keys (OpenSSH, ed25519 or ECDSA) of a chart-made Secret cu-cp-o1-netconf: one string with one key per line, or a list. With a password too, only the keys are used.
      authorizedKeys: ""
      # -- (bool) O1_REQUIRE_SECRET. The chart sets true whenever it mounts a Secret, so a lost Secret keeps NETCONF off. Without a Secret: unset leaves it out (an element that used a Secret before still keeps NETCONF off); true keeps NETCONF off; false is the deliberate way back to the lab login: set it when dropping a Secret, since the element's mark that a Secret was used lives in its node folder only. false is refused while a Secret is mounted.
      requireSecret: null
      # -- NACM group of the Secret's user (O1_NETCONF_GROUP): admin, operator or read-only. Empty: the image default, operator.
      group: ""
      # -- (bool) Access control (O1_NACM_ENABLED). Unset: the image default, true. false turns NACM off, as in RC2.
      nacm: null
      # -- (bool) Keep the RSA SSH host key on the node folder (O1_HOSTKEY_KEEP_RSA) instead of the per-element ECDSA key the RC3 image makes at its first start. For a site that cannot restart or re-pin its NMS yet; the RSA key is the image's, shared by every element of that image. Unset: the image default, false.
      keepRsaHostKey: null
      # -- Address NETCONF listens on (NETCONF_LISTEN_ADDRESS, an IPv4 or IPv6 literal). Empty: the pod IP, so NETCONF is not open on the Multus interfaces (CU-UP N3 and F1-U), which a NetworkPolicy does not filter; the NMS reaches it through the Service. 0.0.0.0 restores the image default (all addresses).
      listenAddress: ""
    ueContext:
      # -- Publish per-UE identity (/ocudu-performance ue-context) for the NMS UE dashboard. Needs cuCp.o1.enabled. Turns on CU-CP RRC metrics (metrics.layers.enable_rrc), without which the list stays empty.
      enabled: true
      # -- Maximum published UE entries.
      maxUes: 256
      measReport:
        # -- cell.sectorId of every DU cell on this CU-CP. Each gets a periodic serving-cell measurement report so ue-context carries RSRP/RSRQ/SINR. Empty sends no reports (the three panels stay empty). NCI = gnb.gnbId << (36 - gnb.gnbIdBitLength) | sectorId.
        sectorIds: []
        # -- Report interval in ms (120, 240, 480, 640, 1024 or 2048). Must stay below ocudu's ue_meas_max_age_ms (3000), or every report is dropped as stale.
        intervalMs: 1024
  resources: {}
  # -- Raw Ocudu cu_cp YAML merged over the generated config (wins on conflict).
  extraConfig:
    log:
      # stdout, so the node's log collector (platform logs stage) keeps the
      # CU-CP log across pod restarts. /tmp/logs (an emptyDir) still holds the pcaps.
      filename: stdout
      all_level: warning
      cu_level: info
      ngap_level: info
      rrc_level: info
      e1ap_level: warning
      f1ap_level: info
      pdcp_level: warning
      hex_max_size: 0
    metrics:
      enable_log: false
    pcap:
      ngap_enable: false
      ngap_filename: /tmp/logs/cu_cp_ngap.pcap
      f1ap_enable: false
      f1ap_filename: /tmp/logs/cu_cp_f1ap.pcap
      e1ap_enable: false
      e1ap_filename: /tmp/logs/cu_cp_e1ap.pcap
    o2:
      enabled: true
      bind_addr: 0.0.0.0
      port: 9093

# Headless Service in front of CU-CP. DUs (F1-C) and CU-UP (E1) resolve it.
cuCpService:
  # -- Service name. firecell-du defaults its cuCpAddress to cu-cp.<namespace>.
  name: cu-cp

cuUp:
  # -- Deploy CU-UP.
  enabled: true
  image: ""
  nodeSelector: {}
  tolerations: []
  # -- E1 target. Empty resolves to <cuCpService.name>.<namespace>.svc.cluster.local.
  cuCpAddress: ""
  # -- CPU list for taskset. Empty runs unpinned.
  cpus: ""
  # -- CU-UP main pool worker threads (expert_execution.threads.main_pool.nof_threads).
  nofThreads: 3
  o1:
    # -- NETCONF (netopeer2) on the CU-UP, so the NMS registers and manages it over O1. Needs an image whose ocuup carries the O1 service; renders Service cu-up:830.
    enabled: false
    yangSearchPath: /usr/local/yang
    restartOnColdCommit: false
    # -- netopeer2 log level: error, warning, info (a few [INF] lines per NMS request) or debug; 0-3 also accepted. Images built before the entrypoint read NETCONF_VERBOSITY always log at info.
    netconfVerbosity: warning
    # -- Host directory kept across restarts (O1 overlay and NETCONF host key). Give each CU-UP on a node its own. Empty uses /var/lib/firecell/ocudu/cu-up.
    statePath: ""
    # -- Existing PersistentVolumeClaim for the O1 state (O1 overlay, NETCONF host key, mode file) instead of the statePath host directory, so the state moves with the pod when it is rescheduled to another node. Empty: the host directory; then pin the CU-UP to one node (nodeSelector kubernetes.io/hostname), or a move to another node gives it a new host key and loses its O1 overlay.
    stateClaim: ""
    # NETCONF login and access control (KI-026). With nothing set the CU-UP keeps the lab
    # login netconf/netconf (group operator) and logs a WARNING. Needs an image that reads
    # /etc/ocudu/o1-netconf (RC3 or later); see the README of the image's docker/o1.
    netconf:
      # -- Existing Secret mounted at /etc/ocudu/o1-netconf (keys username, password and/or authorized_keys). Recommended: one Secret per RAN namespace, named by every element. The CU-UP reads it at start only: restart it after changing the Secret.
      existingSecret: ""
      # -- User (letters, digits, . _ -, at most 64 characters, not root) of a chart-made Secret cu-up-o1-netconf. Empty: netconf.
      username: ""
      # -- Password of a chart-made Secret cu-up-o1-netconf (clear text on one line, at most 256 characters, or a $6$/$5$ crypt hash). The pod rolls when it changes.
      password: ""
      # -- NMS public keys (OpenSSH, ed25519 or ECDSA) of a chart-made Secret cu-up-o1-netconf: one string with one key per line, or a list. With a password too, only the keys are used.
      authorizedKeys: ""
      # -- (bool) O1_REQUIRE_SECRET. The chart sets true whenever it mounts a Secret, so a lost Secret keeps NETCONF off. Without a Secret: unset leaves it out (an element that used a Secret before still keeps NETCONF off); true keeps NETCONF off; false is the deliberate way back to the lab login: set it when dropping a Secret, since the element's mark that a Secret was used lives in its node folder only. false is refused while a Secret is mounted.
      requireSecret: null
      # -- NACM group of the Secret's user (O1_NETCONF_GROUP): admin, operator or read-only. Empty: the image default, operator.
      group: ""
      # -- (bool) Access control (O1_NACM_ENABLED). Unset: the image default, true. false turns NACM off, as in RC2.
      nacm: null
      # -- (bool) Keep the RSA SSH host key on the node folder (O1_HOSTKEY_KEEP_RSA) instead of the per-element ECDSA key the RC3 image makes at its first start. For a site that cannot restart or re-pin its NMS yet; the RSA key is the image's, shared by every element of that image. Unset: the image default, false.
      keepRsaHostKey: null
      # -- Address NETCONF listens on (NETCONF_LISTEN_ADDRESS, an IPv4 or IPv6 literal). Empty: the pod IP, so NETCONF is not open on the Multus interfaces (CU-UP N3 and F1-U), which a NetworkPolicy does not filter; the NMS reaches it through the Service. 0.0.0.0 restores the image default (all addresses).
      listenAddress: ""
  # -- RPS CPU mask, quoted hex as in /sys/class/net/*/queues/rx-*/rps_cpus (e.g. "3c003c" = CPUs 2-5,18-21), set on the N3 veth at start. Needs n3.cniType bridge (CU-UP next to a generic-XDP UPF); RPS has no effect on macvlan (F1-U, macvlan N3), whose receive runs in the parent NIC's softirq: pin that NIC's IRQs on the host. Use the host's NIC IRQ cores. Empty leaves RPS off.
  rpsCpus: ""
  # N3 (GTP-U toward the UPF) on a secondary interface.
  n3:
    # -- Attach a secondary interface for N3. When false, N3 binds the pod IP.
    enabled: true
    # -- macvlan (CU-UP on a different node than the UPF) or bridge (CU-UP on the UPF node with the UPF on a Linux bridge and generic XDP; macvlan siblings bypass generic XDP).
    cniType: macvlan
    # -- Host parent interface (macvlan) or Linux bridge name (bridge, e.g. br-n3).
    master: eth1
    # -- Static N3 address with prefix. The IP part is the NG-U bind address.
    cidr: 10.3.0.4/24
    # -- Fixed MAC for the N3 interface (keeps the UPF neighbour entry valid). Empty lets CNI pick.
    mac: ""
  f1u:
    network:
      # -- Put F1-U (GTP-U toward the DUs) on a macvlan of a host NIC instead of the pod network. Use when the DUs run on another node and the pod network between the nodes is slower than the user plane.
      enabled: false
      # -- Host interface the F1-U macvlan sits on (link toward the DU node).
      master: ""
      # -- CU-UP F1-U address with prefix. The IP part is the F1-U bind address.
      cidr: ""
  resources: {}
  # -- Raw Ocudu cu_up YAML merged over the generated config.
  extraConfig:
    cu_up:
      warn_on_drop: true
      ngu:
        gtpu:
          ignore_ue_ambr: true
    log:
      # stdout, so the node's log collector (platform logs stage) keeps the
      # CU-UP log across pod restarts. /tmp/logs (an emptyDir) still holds the pcaps.
      filename: stdout
      all_level: warning
      hex_max_size: 0
    metrics:
      enable_log: false
    pcap:
      e1ap_enable: false
      f1u_enable: false
      n3_enable: false
    o2:
      enabled: true
      bind_addr: 0.0.0.0
      port: 9094

# NMS access: ServiceAccount nms of the firecell-nms release.
nms:
  # -- Let the NMS read pods here, and restart, stop and start the cu-cp and
  # cu-up Deployments.
  rbac: true
  # -- Namespace of the firecell-nms release.
  namespace: firecell-nms
