{{- if $.Values.siloPostJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-silo-post-job
spec:
  template:
    metadata:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: etc-path
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: silo-configuration
          projected:
            sources:
              - configMap:
                  name: {{ $.Release.Name }}-minio
              - secret:
                  name: {{ $.Release.Name }}-minio
      serviceAccountName: minio-sa
      containers:
        - name: silo-make-bucket
          image: "{{ $.Values.silo.mcImage.repository }}:{{ $.Values.silo.mcImage.tag }}"
          imagePullPolicy: {{ $.Values.silo.mcImage.pullPolicy | default "IfNotPresent" }}
          command: [ "/bin/sh", "/config/initialize" ]
          env:
            - name: MINIO_ENDPOINT
              value: {{ $.Release.Name }}-minio
            - name: MINIO_PORT
              value: "9000"
          volumeMounts:
            - name: etc-path
              mountPath: /etc/silo/mc
            - name: tmp
              mountPath: /tmp
            - name: silo-configuration
              mountPath: /config
          resources:
            requests:
              memory: 128Mi
        - name: silo-make-user
          image: "{{ $.Values.silo.mcImage.repository }}:{{ $.Values.silo.mcImage.tag }}"
          imagePullPolicy: {{ $.Values.silo.mcImage.pullPolicy | default "IfNotPresent" }}
          command: [ "/bin/sh", "/config/add-user" ]
          env:
            - name: MINIO_ENDPOINT
              value: {{ $.Release.Name }}-minio
            - name: MINIO_PORT
              value: "9000"
          volumeMounts:
            - name: etc-path
              mountPath: /etc/silo/mc
            - name: tmp
              mountPath: /tmp
            - name: silo-configuration
              mountPath: /config
          resources:
            requests:
              memory: 128Mi
{{- end -}}
