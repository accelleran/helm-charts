apiVersion: v1
kind: ServiceAccount
metadata:
  name: vlagent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-node-logs.labels" . | nindent 4 }}
    app.kubernetes.io/name: vlagent
    app.kubernetes.io/component: collector
automountServiceAccountToken: true
---
# vlagent finds the containers of its node and their pod, namespace and node
# metadata. Read-only, metadata only: no logs or Secrets go through the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlagent-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-node-logs.labels" . | nindent 4 }}
    app.kubernetes.io/name: vlagent
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vlagent-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-node-logs.labels" . | nindent 4 }}
    app.kubernetes.io/name: vlagent
    app.kubernetes.io/component: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vlagent-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: vlagent
    namespace: {{ .Release.Namespace }}
