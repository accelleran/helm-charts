{{- if .Values.amf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-amf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-amf
    tier: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oai-amf
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oai-amf
        tier: core-network
        firecell.io/role: core-nf
        role: active
      annotations:
        {{- include "firecell-5gc.configChecksum" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.amf.priorityClassName }}
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
        {{- if .Values.udsf.enabled }}
        {{- include "firecell-5gc.waitForUdsf" . | nindent 8 }}
        {{- end }}
      containers:
        - name: amf
          image: {{ .Values.amf.imageOverride | default (include "firecell-5gc.nfImage" (dict "registry" .Values.global.imageRegistry "image" .Values.amf.image "imageTag" .Values.amf.imageTag "pkgVersion" .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- toYaml .Values.amf.command | nindent 12 }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            {{- if .Values.amf.fcaps.enabled }}
            - name: FCAPS_CM_DATASTORE
              value: {{ printf "%s/%s" .Values.amf.fcaps.datastore.mountPath .Values.amf.fcaps.datastore.file | quote }}
            {{- with .Values.amf.fcaps.seedConfigPath }}
            - name: FCAPS_SEED_CONFIG
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            {{- toYaml .Values.amf.ports | nindent 12 }}
            {{- if .Values.amf.fcaps.enabled }}
            - name: mns
              containerPort: {{ .Values.amf.fcaps.mnsPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: common-config
              mountPath: {{ .Values.amf.configMountPath }}
              subPath: basic_nrf_config_ebpf_qos.yaml
            {{- if .Values.amf.fcaps.enabled }}
            - name: cm-state
              mountPath: {{ .Values.amf.fcaps.datastore.mountPath }}
              {{- if eq .Values.amf.fcaps.intentMode "configmap" }}
              readOnly: true
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.amf.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          {{- include "firecell-5gc.nfLivenessProbe" (dict "initialDelaySeconds" 30 "periodSeconds" 10 "failureThreshold" 5 "timeoutSeconds" 5) | nindent 10 }}
        {{- include "firecell-5gc.healthzSidecar" (dict "Values" .Values "nfName" "amf" "healthPath" "/namf-comm/v1/health") | nindent 8 }}
      volumes:
        - name: common-config
          configMap:
            name: firecell-common-config
        {{- if .Values.amf.fcaps.enabled }}
        - name: cm-state
          {{- if eq .Values.amf.fcaps.intentMode "configmap" }}
          # Mounted as a directory on purpose. A ConfigMap mounted through
          # subPath is NEVER refreshed by kubelet, which would silently make
          # every change require a pod restart and defeat the HOT path.
          configMap:
            name: {{ .Values.amf.fcaps.intentConfigMap.name }}
            optional: {{ .Values.amf.fcaps.intentConfigMap.optional }}
          {{- else }}
          persistentVolumeClaim:
            claimName: oai-amf-cm-state
          {{- end }}
        {{- end }}
        {{- include "firecell-5gc.healthzVolume" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
