{{- if .Values.amf.enabled }}
{{- $amfSvcType := coalesce .Values.amf.serviceType .Values.network.amfServiceType "LoadBalancer" }}
{{- $mode2 := include "firecell-5gc.amfPerReplicaN2Vip" . }}
apiVersion: v1
kind: Service
metadata:
  name: oai-amf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-amf
    tier: core-network
  {{- if eq $amfSvcType "LoadBalancer" }}
  annotations:
    metallb.universe.tf/address-pool: firecell-cp-pool
    {{- if not $mode2 }}
    metallb.universe.tf/loadBalancerIPs: {{ .Values.network.amfExternalIP }}
    {{- else }}
    # Mode-2: shared VIP is SBI-only; NGAP uses per-ordinal Services (service-ngap-ordinal).
    metallb.universe.tf/loadBalancerIPs: {{ .Values.network.amfExternalIP }}
    {{- end }}
  {{- end }}
spec:
  type: {{ $amfSvcType }}
  {{- if eq $amfSvcType "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.network.amfExternalTrafficPolicy | default "Local" }}
  {{- end }}
  ports:
    - name: sbi
      port: 80
      targetPort: 80
      protocol: TCP
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    {{- if not $mode2 }}
    - name: ngap
      port: 38412
      targetPort: 38412
      protocol: SCTP
    {{- end }}
    {{- if .Values.amf.fcaps.enabled }}
    - name: mns
      port: {{ .Values.amf.fcaps.mnsPort }}
      targetPort: {{ .Values.amf.fcaps.mnsPort }}
      protocol: TCP
    {{- end }}
  selector:
    app: oai-amf
{{- if and (not $mode2) (dig "headlessN2" "enabled" false .Values.amf) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ dig "headlessN2" "serviceName" "oai-amf-n2" .Values.amf }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-amf
    tier: core-network
    firecell.io/purpose: n2-ngap
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ if hasKey (.Values.amf.headlessN2 | default dict) "publishNotReadyAddresses" }}{{ .Values.amf.headlessN2.publishNotReadyAddresses }}{{ else }}true{{ end }}
  selector:
    app: oai-amf
  ports:
    - name: ngap
      port: 38412
      targetPort: 38412
      protocol: SCTP
{{- end }}
{{- end }}
