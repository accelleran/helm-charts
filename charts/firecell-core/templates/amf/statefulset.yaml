{{- if and .Values.amf.enabled (eq (.Values.amf.kind | default "Deployment") "StatefulSet") }}
{{/*
  [active-active] AMF StatefulSet as an identity allocator (no PVCs for app state).
  Each ordinal owns a unique amf_pointer via __AMF_POINTER__ substitution. Mode-2
  overlays bump replicas and set amf.n2.perReplicaVip for per-pod NGAP VIPs.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oai-amf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-amf
    tier: core-network
spec:
  serviceName: {{ if include "firecell-5gc.amfPerReplicaN2Vip" . }}oai-amf-headless{{ else }}oai-amf{{ end }}
  podManagementPolicy: Parallel
  replicas: {{ include "firecell-5gc.replicas" (dict "ctx" . "replicas" .Values.amf.replicas) }}
  selector:
    matchLabels:
      app: oai-amf
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oai-amf
        tier: core-network
        firecell.io/role: core-nf
        role: active
      annotations:
        {{- include "firecell-5gc.configChecksum" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.amf.priorityClassName }}
      {{- include "firecell-5gc.haScheduling" (dict "ctx" . "app" "oai-amf" "replicas" .Values.amf.replicas) | nindent 6 }}
      initContainers:
        - name: render-ordinal-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ORD="${POD_NAME##*-}"
              PTR=$(printf '%02d' $((ORD + 1)))
              sed "s/__AMF_POINTER__/${PTR}/g" /tmpl/config.yaml > /rendered/config.yaml
              echo "[active-active] ${POD_NAME}: amf_pointer=${PTR}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: common-config
              mountPath: /tmpl/config.yaml
              subPath: basic_nrf_config_ebpf_qos.yaml
            - name: rendered
              mountPath: /rendered
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
        {{- if .Values.udsf.enabled }}
        {{- include "firecell-5gc.waitForUdsf" . | nindent 8 }}
        {{- end }}
      containers:
        - name: amf
          image: {{ .Values.amf.imageOverride | default (include "firecell-5gc.nfImage" (dict "registry" .Values.global.imageRegistry "image" .Values.amf.image "imageTag" .Values.amf.imageTag "pkgVersion" .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- toYaml .Values.amf.command | nindent 12 }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: FCAPS_CM_DATASTORE
              value: {{ printf "%s/%s" .Values.amf.fcaps.datastore.mountPath .Values.amf.fcaps.datastore.file | quote }}
            {{- if .Values.amf.fcaps.enabled }}
            {{- with .Values.amf.fcaps.seedConfigPath }}
            - name: FCAPS_SEED_CONFIG
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            {{- toYaml .Values.amf.ports | nindent 12 }}
            {{- if .Values.amf.fcaps.enabled }}
            - name: mns
              containerPort: {{ .Values.amf.fcaps.mnsPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
{{- with (include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "amf")) }}
{{ . | indent 12 }}
{{- end }}
            - name: rendered
              mountPath: {{ .Values.amf.configMountPath }}
              subPath: config.yaml
            - name: cm-state
              mountPath: {{ .Values.amf.fcaps.datastore.mountPath }}
              {{- if and .Values.amf.fcaps.enabled (eq .Values.amf.fcaps.intentMode "configmap") }}
              readOnly: true
              {{- end }}
          resources:
            {{- toYaml .Values.amf.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          {{- include "firecell-5gc.nfLivenessProbe" (dict "initialDelaySeconds" 30 "periodSeconds" 10 "failureThreshold" 5 "timeoutSeconds" 5) | nindent 10 }}
        {{- include "firecell-5gc.healthzSidecar" (dict "Values" .Values "nfName" "amf" "healthPath" "/namf-comm/v1/health") | nindent 8 }}
      volumes:
{{- with (include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "amf")) }}
{{ . | indent 8 }}
{{- end }}
        - name: common-config
          configMap:
            name: firecell-common-config
        - name: rendered
          emptyDir: {}
        - name: cm-state
          {{- if not .Values.amf.fcaps.enabled }}
          emptyDir: {}
          {{- else if eq .Values.amf.fcaps.intentMode "configmap" }}
          configMap:
            name: {{ .Values.amf.fcaps.intentConfigMap.name }}
            optional: {{ .Values.amf.fcaps.intentConfigMap.optional }}
          {{- else }}
          # PVC intentMode is single-replica only; Mode-2 uses configmap or emptyDir.
          emptyDir: {}
          {{- end }}
        {{- include "firecell-5gc.healthzVolume" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
