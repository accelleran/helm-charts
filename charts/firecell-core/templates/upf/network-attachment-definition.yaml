{{- if and .Values.upf.enabled (eq .Values.upf.type "oai") (not .Values.upf.hostNetwork) (.Values.upf.multus.enabled | default false) }}
{{- $n3 := .Values.upf.multus.n3 | default dict }}
{{- $n6 := .Values.upf.multus.n6 | default dict }}
{{- if and $n3.masterInterface $n3.ip }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n3.nadName | default "upf-n3-net" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-upf
    tier: core-network
    firecell.io/upf-net: n3
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ $n3.nadName | default "upf-n3-net" }}",
      "type": "{{ $n3.cniType | default "macvlan" }}",
      "master": "{{ $n3.masterInterface }}",
      "mode": "{{ $n3.mode | default "bridge" }}",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "{{ $n3.ip }}/{{ $n3.subnetPrefix | default 24 }}"
          }
        ]
      }
    }
{{- end }}
{{- if and $n6.masterInterface $n6.ip }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n6.nadName | default "upf-n6-net" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-upf
    tier: core-network
    firecell.io/upf-net: n6
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ $n6.nadName | default "upf-n6-net" }}",
      "type": "{{ $n6.cniType | default "macvlan" }}",
      "master": "{{ $n6.masterInterface }}",
      "mode": "{{ $n6.mode | default "bridge" }}",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "{{ $n6.ip }}/{{ $n6.subnetPrefix | default 24 }}"
          }
        ]
      }
    }
{{- end }}
{{- end }}
