{{- if and .Values.upf.enabled (eq .Values.upf.type "o5gs") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: o5gs-upf-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: o5gs-upf
    tier: core-network
data:
  init-config.sh: |
    #!/bin/sh
    echo "UPF config init: placeholder — real config generated by start-upf.sh"
    mkdir -p /config-output /log-init/open5gs
    echo "# generated by start-upf.sh" > /config-output/upf.yaml

  start-upf.sh: |
    #!/bin/sh
    # ── UPF startup wrapper — CP/UP interface separation ─────────────────────
    # N4 (PFCP): binds to the CP interface (reachable by SMF inside the cluster)
    # N3 (GTP-U): binds to the UP interface / MetalLB UP VIP (reachable by gNB)
    #
    # Priority for N3 IP:
    #   1. UPF_N3_IP env var (set from values.upf.n3IP — should equal upfExternalIP)
    #   2. UPF_N3_INTERFACE env var (set from values.upf.n3Interface)
    #   3. Fallback: same as N4 IP (single-NIC lab mode)
    #
    # Priority for N4 IP:
    #   1. UPF_N4_INTERFACE env var (set from values.upf.n4Interface)
    #   2. bond0, eth0, default-route interface, any global IP
    set -e

    echo "[UPF] Starting o5gs-upf with CP/UP separation..."
    SMF_PORT="8805"
    # Per-instance TUN device name — must be unique across instances on the same host.
    # Default "ogstun" is fine for single-UPF; multi-UPF sets UPF_TUN_DEV per pod.
    TUN_DEV="${UPF_TUN_DEV:-ogstun}"

    # ── Detect N4 (CP) IP ─────────────────────────────────────────────────────
    detect_ip() {
      local iface="$1"
      ip -4 addr show dev "$iface" 2>/dev/null | sed -n 's/.*inet \([0-9.]*\)\/.*/\1/p' | head -1
    }

    # ── Host macvlan for PFCP ─────────────────────────────────────────────────
    # When SMF uses macvlan bridge mode (Multus), create a matching bridge slave
    # on the host so the UPF can reach SMF directly. macvlan bridge slaves on the
    # same parent NIC communicate with each other — no wire loopback required.
    if [ -n "${UPF_HOST_PFCP_MACVLAN:-}" ] && [ -n "${UPF_HOST_PFCP_IP:-}" ]; then
      _PFCP_PARENT="${UPF_N4_INTERFACE:-eno1}"
      echo "[UPF] Creating host PFCP macvlan ${UPF_HOST_PFCP_MACVLAN} (bridge) on ${_PFCP_PARENT}..."
      ip link add "${UPF_HOST_PFCP_MACVLAN}" link "${_PFCP_PARENT}" type macvlan mode bridge 2>/dev/null \
        || echo "[UPF] ${UPF_HOST_PFCP_MACVLAN} already exists"
      ip addr del "${UPF_HOST_PFCP_IP}/24" dev "${UPF_HOST_PFCP_MACVLAN}" 2>/dev/null || true
      ip addr add "${UPF_HOST_PFCP_IP}/32" dev "${UPF_HOST_PFCP_MACVLAN}" 2>/dev/null || true
      ip link set "${UPF_HOST_PFCP_MACVLAN}" up
      # /32 host route ensures kernel sends via the macvlan slave (not via the parent eno1
      # which can't reach macvlan children due to the macvlan parent-to-slave restriction)
      SMF_IP_FOR_ROUTE="{{ .Values.smf.n4IP }}"
      [ -n "${SMF_IP_FOR_ROUTE}" ] && \
        ip route replace "${SMF_IP_FOR_ROUTE}/32" dev "${UPF_HOST_PFCP_MACVLAN}" 2>/dev/null || true
      echo "[UPF] Host PFCP macvlan UP: ${UPF_HOST_PFCP_MACVLAN} @ ${UPF_HOST_PFCP_IP}"
      UPF_N4_INTERFACE="${UPF_HOST_PFCP_MACVLAN}"
    fi

    N4_IP=""
    N4_IFACE="${UPF_N4_INTERFACE:-}"

    if [ -n "$N4_IFACE" ]; then
      N4_IP=$(detect_ip "$N4_IFACE")
    fi
    if [ -z "$N4_IP" ]; then
      N4_IP=$(detect_ip bond0)
    fi
    if [ -z "$N4_IP" ]; then
      N4_IP=$(detect_ip eth0)
    fi
    if [ -z "$N4_IP" ]; then
      ACTIVE_IF=$(ip route get 8.8.8.8 2>/dev/null | grep -oP 'dev \K\S+' | head -1)
      [ -n "$ACTIVE_IF" ] && N4_IP=$(detect_ip "$ACTIVE_IF")
    fi
    if [ -z "$N4_IP" ]; then
      N4_IP=$(ip -4 addr show scope global 2>/dev/null | sed -n 's/.*inet \([0-9.]*\)\/.*/\1/p' | head -1)
    fi
    if [ -z "$N4_IP" ]; then
      echo "[FATAL] Could not determine N4 (CP) IP"
      exit 1
    fi
    echo "[UPF] N4 (PFCP) IP: $N4_IP"

    # ── Detect N3 (UP) IP ─────────────────────────────────────────────────────
    # UPF_N3_IP is set by the Deployment from values.upf.n3IP (= upfExternalIP).
    # This is the IP the SMF will tell the gNB to send GTP-U packets to.
    N3_IP="${UPF_N3_IP:-}"

    if [ -z "$N3_IP" ] && [ -n "${UPF_N3_INTERFACE:-}" ]; then
      N3_IP=$(detect_ip "$UPF_N3_INTERFACE")
      echo "[UPF] N3 IP detected from interface $UPF_N3_INTERFACE: $N3_IP"
    fi
    if [ -z "$N3_IP" ]; then
      N3_IP="$N4_IP"
      echo "[UPF] N3 IP not set — using N4 IP (single-NIC mode): $N3_IP"
    else
      echo "[UPF] N3 (GTP-U) IP: $N3_IP"
    fi

    # ── Resolve SMF ───────────────────────────────────────────────────────────
    # Priority order (all avoid ClusterIP SNAT = no PFCP split-peer):
    #   1. Direct Multus IP (smf.n4IP) — stable even across SMF restarts
    #   2. Headless service DNS — resolves to SMF pod IP directly (no SNAT)
    #   3. Fallback to ClusterIP DNS (PFCP split-peer risk, last resort)
    {{- if .Values.smf.n4IP }}
    SMF_IP="{{ .Values.smf.n4IP }}"
    echo "[UPF] SMF: using direct Multus IP $SMF_IP"
    {{- else }}
    # Resolve headless service → SMF pod IP (no SNAT)
    SMF_HEADLESS="oai-smf-pfcp.{{ .Values.global.namespace }}.svc.cluster.local"
    SMF_CLUSTER="oai-smf.{{ .Values.global.namespace }}.svc.cluster.local"
    SMF_IP=""
    ATTEMPT=0
    while [ $ATTEMPT -lt 10 ]; do
      ATTEMPT=$((ATTEMPT + 1))
      SMF_IP=$(getent hosts "$SMF_HEADLESS" 2>/dev/null | awk '{print $1}' | head -1)
      if [ -n "$SMF_IP" ]; then
        echo "[UPF] SMF: $SMF_HEADLESS -> $SMF_IP (pod IP, no SNAT)"
        break
      fi
      echo "[UPF] Waiting for SMF headless DNS (attempt $ATTEMPT/10)..."
      sleep 3
    done
    if [ -z "$SMF_IP" ]; then
      SMF_IP="$SMF_CLUSTER"
      echo "[UPF] WARNING: headless DNS failed, using ClusterIP (PFCP split-peer risk)"
    fi
    {{- end }}

    # ── Generate UPF config ───────────────────────────────────────────────────
    # When UPF_SESSIONS is set (multi-UPF instance mode), the template contains
    # SESSIONS_YAML_PLACEHOLDER which is replaced here with the per-instance
    # subnet list. Otherwise the sessions block is already rendered by Helm.
    _TEMPLATE="/config-template/upf-config-active-template.yaml"
    if [ -n "${UPF_SESSIONS:-}" ]; then
      > /tmp/sessions.yaml
      for _s in $(echo "$UPF_SESSIONS" | tr ',' '\n'); do
        _s=$(echo "$_s" | tr -d ' ')
        [ -z "$_s" ] && continue
        echo "        - subnet: ${_s}" >> /tmp/sessions.yaml
        echo "          dev: ${TUN_DEV}" >> /tmp/sessions.yaml
        [ -n "${UPF_SESSION_MTU:-}" ] && \
          echo "          mtu: ${UPF_SESSION_MTU}" >> /tmp/sessions.yaml
      done
      # sed 'r' inserts file after matched line; grep -v removes the placeholder line
      sed "/SESSIONS_YAML_PLACEHOLDER/r /tmp/sessions.yaml" "$_TEMPLATE" | \
        grep -v "SESSIONS_YAML_PLACEHOLDER" > /tmp/upf-template-inst.yaml
      _TEMPLATE="/tmp/upf-template-inst.yaml"
    fi
    sed -e "s@N4_IP_PLACEHOLDER@${N4_IP}@g" \
        -e "s@N3_IP_PLACEHOLDER@${N3_IP}@g" \
        -e "s@SMF_IP_PLACEHOLDER@${SMF_IP}@g" \
        -e "s@SMF_PORT_PLACEHOLDER@${SMF_PORT}@g" \
        -e "s@UE_MAX_SESSIONS_PLACEHOLDER@${UPF_MAX_SESSIONS:-1024}@g" \
        "$_TEMPLATE" > /cn5g-o5gs/install/etc/open5gs/upf.yaml

    echo "[UPF] Config written:"
    grep -E "address:|advertise:" /cn5g-o5gs/install/etc/open5gs/upf.yaml || true

    # ── Ensure N3 IP is locally bound (MetalLB VIP is ARP-announced but never
    #    added to the interface — open5gs-upfd needs to bind to it) ─────────────
    if ! ip -4 addr show | grep -q " ${N3_IP}/"; then
      N3_BIND_IFACE="${UPF_N3_INTERFACE:-$(ip route get 8.8.8.8 2>/dev/null | grep -oP 'dev \K\S+' | head -1)}"
      echo "[UPF] N3 IP ${N3_IP} not on any interface — adding to ${N3_BIND_IFACE}"
      ip addr add "${N3_IP}/32" dev "${N3_BIND_IFACE}" 2>/dev/null || true
    fi

    # ── IP forwarding (required for ogstun ↔ N3 routing) ─────────────────────
    sysctl -w net.ipv4.ip_forward=1 || true
    sysctl -w net.ipv6.conf.all.forwarding=1 || true
    echo "[UPF] ip_forward enabled"

    # ── Performance tuning: kernel parameters ─────────────────────────────────
    # Gated on UPF_PERFORMANCE_ENABLED so untuned environments are unaffected.
    # These sysctls write to the host kernel (hostNetwork+SYS_ADMIN); they also
    # persist in /etc/sysctl.d/99-upf-performance.conf if provisioned that way.
    if [ "${UPF_PERFORMANCE_ENABLED:-false}" = "true" ]; then
      echo "[UPF] Applying performance tuning..."
      # UDP socket buffers: prevent packet loss when upfd event loop is busy
      sysctl -w "net.core.rmem_max=${UPF_SOCKET_RMEM_MAX:-26214400}"     || true
      sysctl -w "net.core.wmem_max=${UPF_SOCKET_WMEM_MAX:-26214400}"     || true
      sysctl -w net.core.rmem_default=2097152                             || true
      sysctl -w net.core.wmem_default=2097152                             || true
      sysctl -w net.core.netdev_max_backlog=5000                          || true
      sysctl -w "net.ipv4.udp_mem=102400 873800 16777216"                 || true
      # NAPI polling budget: more packets processed per interrupt cycle.
      # Default 300 packets / 2ms throttles high-PPS workloads (e.g. 1500B @ 1Gbps
      # is ~83k pps; 300 packets/interrupt means 277 interrupts/sec, each with context-
      # switch overhead). Doubling the budget roughly halves interrupt rate.
      sysctl -w "net.core.netdev_budget=${UPF_NETDEV_BUDGET:-600}"           || true
      sysctl -w "net.core.netdev_budget_usecs=${UPF_NETDEV_BUDGET_USECS:-8000}" || true
      # Conntrack: scale with (UE count × active flows per UE)
      # Default 65536 is exhausted by ~655 UEs with 100 connections each
      modprobe nf_conntrack 2>/dev/null || true
      sysctl -w "net.netfilter.nf_conntrack_max=${UPF_CONNTRACK_MAX:-524288}" || true
      sysctl -w net.netfilter.nf_conntrack_buckets=131072                 || true
      # UDP conntrack timeouts: defaults are 30s (single) / 180s (stream).
      # 30s is too short — a UDP iperf test with high loss stops receiving iperf
      # report-back datagrams, so the entry never upgrades to "stream" state and
      # expires after 30s, causing a complete flow stall visible as 0 Bps at ~30s.
      sysctl -w "net.netfilter.nf_conntrack_udp_timeout=${UPF_CONNTRACK_UDP_TIMEOUT:-120}"        || true
      sysctl -w "net.netfilter.nf_conntrack_udp_timeout_stream=${UPF_CONNTRACK_UDP_STREAM_TIMEOUT:-3600}" || true
      # TCP congestion control: BBR2 preferred; fallback to BBR
      # Improves throughput on paths with bufferbloat (UE NAT → internet)
      if [ "${UPF_ENABLE_BBR:-true}" = "true" ]; then
        modprobe tcp_bbr2 2>/dev/null || modprobe tcp_bbr 2>/dev/null || true
        sysctl -w net.ipv4.tcp_congestion_control=bbr2 2>/dev/null || \
          sysctl -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null || true
        _CC=$(sysctl -n net.ipv4.tcp_congestion_control 2>/dev/null || echo unknown)
        echo "[UPF] TCP CC: ${_CC}"
      fi
      echo "[UPF] Performance tuning applied"
    fi

    # ── TUN device setup ──────────────────────────────────────────────────────
    ip tuntap add name "${TUN_DEV}" mode tun 2>/dev/null || echo "[UPF] ${TUN_DEV} already exists"
    # Set MTU before bringing interface up — open5gs-upfd reads the interface MTU
    # to determine max GTP-U inner payload and signals it via PFCP to OAI-SMF.
    # TUN MTU must be ≤ (physical NIC MTU - GTP-U overhead 36B) to avoid
    # fragmentation on the N3 path. Default 1420 = 1500 - 36 - 44B headroom.
    if [ "${UPF_PERFORMANCE_ENABLED:-false}" = "true" ] && [ -n "${UPF_TUN_MTU:-}" ]; then
      ip link set "${TUN_DEV}" mtu "${UPF_TUN_MTU}"
      echo "[UPF] ${TUN_DEV} MTU: ${UPF_TUN_MTU}"
    fi
    # Flush stale IPv4 addresses before adding current subnets.
    # hostNetwork TUN devices persist across pod restarts; without this, a subnet
    # change (e.g. reassigning an instance to a different slice) leaves the old
    # address on the device, creating duplicate routes and silent misrouting.
    ip addr flush dev "${TUN_DEV}" scope global 2>/dev/null || true
    grep "subnet:" /cn5g-o5gs/install/etc/open5gs/upf.yaml | sed 's/.*subnet: *//' | while read SUBNET; do
      [ -n "$SUBNET" ] && ip addr add "$SUBNET" dev "${TUN_DEV}" 2>/dev/null || true
    done
    ip link set "${TUN_DEV}" up 2>/dev/null || true
    echo "[UPF] ${TUN_DEV} up"
    # Standardise TUN qdisc: kernel default varies by version (pfifo_fast on older,
    # fq_codel on newer), causing inconsistent behaviour between instances created at
    # different times. pfifo_fast has lower per-packet overhead for bulk forwarding.
    if [ "${UPF_PERFORMANCE_ENABLED:-false}" = "true" ]; then
      _qdisc="${UPF_TUN_QDISC:-pfifo_fast}"
      tc qdisc replace dev "${TUN_DEV}" root "${_qdisc}" 2>/dev/null || true
      echo "[UPF] ${TUN_DEV} qdisc: ${_qdisc}"
    fi
    # Post-up NIC and queue tuning
    if [ "${UPF_PERFORMANCE_ENABLED:-false}" = "true" ]; then
      # Increase ogstun TX queue: default 500 causes backpressure on bulk transfers
      ip link set "${TUN_DEV}" txqueuelen "${UPF_TX_QUEUE_LEN:-10000}"
      # LRO coalesces TCP segments from different GTP tunnels into one buffer →
      # inner packet checksum corruption. Must be disabled on the N3 NIC.
      if [ "${UPF_DISABLE_LRO:-true}" = "true" ]; then
        command -v ethtool >/dev/null 2>&1 && \
          ethtool -K "${UPF_N3_INTERFACE:-eno1}" lro off 2>/dev/null || true
        echo "[UPF] LRO disabled on ${UPF_N3_INTERFACE:-eno1}"
      fi
      # Route MTU lock: prevents kernel fragmenting non-TCP UE traffic (UDP, ICMP)
      # at the ogstun → N3 boundary. Applied after ip addr add creates the routes.
      if [ -n "${UPF_TUN_MTU:-}" ]; then
        grep "subnet:" /cn5g-o5gs/install/etc/open5gs/upf.yaml | \
          sed 's/.*subnet: *//' | while read _SUBNET; do
            [ -n "$_SUBNET" ] || continue
            ip route replace "$_SUBNET" dev "${TUN_DEV}" mtu "${UPF_TUN_MTU}" 2>/dev/null || true
        done
        echo "[UPF] Route MTU ${UPF_TUN_MTU} locked for UE subnets"
      fi
    fi

    # ── NAT ───────────────────────────────────────────────────────────────────
    # Probe which iptables backend is active: the one that contains kube-proxy
    # or flannel chains is the backend the kernel is processing traffic through.
    # Covers: iptables-nft (Ubuntu 20.04+), iptables-legacy (older/containers),
    # or plain iptables when only one variant exists.
    _probe_ipt() {
      for _ipt in iptables iptables-nft iptables-legacy; do
        command -v "$_ipt" >/dev/null 2>&1 || continue
        # If kube-proxy or flannel chains are visible here, this is the active backend
        if $_ipt -t nat -L KUBE-POSTROUTING -n >/dev/null 2>&1 || \
           $_ipt -t nat -L FLANNEL-POSTRTG   -n >/dev/null 2>&1; then
          echo "$_ipt"; return 0
        fi
      done
      # No kube/flannel chains found — fall back to first available binary
      for _ipt in iptables iptables-nft iptables-legacy; do
        command -v "$_ipt" >/dev/null 2>&1 && echo "$_ipt" && return 0
      done
      return 1
    }
    if _IPT=$(_probe_ipt); then
      echo "[UPF] iptables backend: $_IPT"
    else
      echo "[UPF] WARNING: no iptables found — NAT masquerade skipped"
    fi

    if [ "${DISABLE_NAT:-FALSE}" != "TRUE" ] && [ -n "${_IPT:-}" ]; then
      grep "subnet:" /cn5g-o5gs/install/etc/open5gs/upf.yaml | sed 's/.*subnet: *//' | while read SUBNET; do
        [ -n "$SUBNET" ] || continue
        $_IPT -t nat -C POSTROUTING -s "$SUBNET" ! -o "${TUN_DEV}" -j MASQUERADE 2>/dev/null || \
          $_IPT -t nat -A POSTROUTING -s "$SUBNET" ! -o "${TUN_DEV}" -j MASQUERADE
        echo "[UPF] NAT MASQUERADE: $SUBNET via $_IPT (rc=$?)"
      done
    fi

    # ── TCP MSS clamping ──────────────────────────────────────────────────────
    # Modifies MSS in TCP SYN/SYN-ACK flowing through ogstun so the UE TCP stack
    # never negotiates a segment size that would exceed the ogstun MTU after IP/TCP
    # headers are added. Applied bidirectionally (UE→Internet and Internet→UE).
    # This is the reliable fragmentation-prevention mechanism for TCP; the route
    # MTU lock (above) covers non-TCP (UDP, ICMP).
    if [ "${UPF_PERFORMANCE_ENABLED:-false}" = "true" ] && \
       [ "${UPF_TCPMSS_CLAMP:-true}" = "true" ] && [ -n "${_IPT:-}" ]; then
      $_IPT -t mangle -C FORWARD -p tcp --tcp-flags SYN,RST SYN \
        -o "${TUN_DEV}" -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
        $_IPT -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN \
        -o "${TUN_DEV}" -j TCPMSS --clamp-mss-to-pmtu
      $_IPT -t mangle -C FORWARD -p tcp --tcp-flags SYN,RST SYN \
        -i "${TUN_DEV}" -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || \
        $_IPT -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN \
        -i "${TUN_DEV}" -j TCPMSS --clamp-mss-to-pmtu
      echo "[UPF] TCP MSS clamping enabled on ${TUN_DEV} (PMTU)"
    fi

    # ── kube-proxy DNAT bypass for GTP-U (N3) ────────────────────────────────
    # kube-proxy intercepts LoadBalancer VIP traffic in nat PREROUTING and
    # redirects VIP:2152 → nodeIP:2152. Since open5gs-upfd binds to the VIP
    # (N3_IP), DNAT'd packets would land at nodeIP:2152 where nothing listens.
    # Inserting RETURN at position 1 in nat PREROUTING skips kube-proxy's
    # KUBE-SERVICES chain; the VIP is already a local address (added above)
    # so the kernel delivers the packet directly to the open5gs-upfd socket.
    if [ -n "${N3_IP}" ] && [ -n "${_IPT:-}" ]; then
      $_IPT -t nat -C PREROUTING -d "${N3_IP}" -p udp --dport 2152 -j RETURN 2>/dev/null || \
        $_IPT -t nat -I PREROUTING 1 -d "${N3_IP}" -p udp --dport 2152 -j RETURN
      echo "[UPF] kube-proxy bypass: PREROUTING RETURN for GTP-U ${N3_IP}:2152"
    fi

    # ── SSH blocking ──────────────────────────────────────────────────────────
    if [ "${BLOCK_SSH_ACCESS:-FALSE}" = "TRUE" ] && [ -n "${_IPT:-}" ]; then
      PROTECTED="${PROTECTED_SSH_NETWORKS:-10.0.0.0/8}"
      $_IPT -N SSH_BLOCK 2>/dev/null || $_IPT -F SSH_BLOCK
      $_IPT -C FORWARD -p tcp --dport 22 -j SSH_BLOCK 2>/dev/null || \
        $_IPT -A FORWARD -p tcp --dport 22 -j SSH_BLOCK
      grep "subnet:" /cn5g-o5gs/install/etc/open5gs/upf.yaml | sed 's/.*subnet: *//' | while read UE_SUBNET; do
        echo "$PROTECTED" | tr ',' '\n' | while read NET; do
          NET=$(echo "$NET" | xargs)
          [ -n "$NET" ] && [ -n "$UE_SUBNET" ] && \
            $_IPT -A SSH_BLOCK -s "$UE_SUBNET" -d "$NET" -p tcp --dport 22 -j DROP 2>/dev/null || true
        done
      done
    fi

    echo "[UPF] Launching open5gs-upfd..."
    # Optional CPU affinity: pin the single-threaded upfd event loop to specific
    # cores, leaving other cores free for NIC IRQ handling. Set UPF_CPU_AFFINITY
    # to a core list (e.g. "8-15") via values.upf.performance.cpuAffinity.
    if [ -n "${UPF_CPU_AFFINITY:-}" ] && command -v taskset >/dev/null 2>&1; then
      echo "[UPF] CPU affinity: ${UPF_CPU_AFFINITY}"
      exec taskset -c "${UPF_CPU_AFFINITY}" \
        /usr/local/bin/open5gs-upfd -c /cn5g-o5gs/install/etc/open5gs/upf.yaml
    else
      exec /usr/local/bin/open5gs-upfd -c /cn5g-o5gs/install/etc/open5gs/upf.yaml
    fi

  upf-config-active-template.yaml: |
    logger:
      level: info
    global:
      max:
        # UE_MAX_SESSIONS_PLACEHOLDER is substituted by start-upf.sh from
        # UPF_MAX_SESSIONS env var (values.upf.maxSessions, default 1024).
        ue: UE_MAX_SESSIONS_PLACEHOLDER
    upf:
      pfcp:
        server:
          # N4 interface — binds to the CP IP (reachable by SMF inside the cluster)
          - address: N4_IP_PLACEHOLDER
            advertise: N4_IP_PLACEHOLDER
            port: SMF_PORT_PLACEHOLDER
        client:
          smf:
            # SMF_IP_PLACEHOLDER is resolved at startup:
            #   - Direct Multus IP when smf.n4IP is set (no SNAT, stable)
            #   - Headless service pod IP otherwise (no SNAT via oai-smf-pfcp DNS)
            - address: SMF_IP_PLACEHOLDER
      gtpu:
        server:
          # N3 interface — binds to the UP IP (MetalLB VIP, reachable by gNB)
          # This address is what SMF hands to gNBs via N2 for GTP-U tunnels.
          - address: N3_IP_PLACEHOLDER
            port: 2152
      session:
      {{- if .Values.upf.instances }}
      SESSIONS_YAML_PLACEHOLDER
      {{- else }}
      {{- range .Values.coreConfig.upfSessions }}
        - subnet: {{ .subnet }}
      {{- end }}
      {{- end }}
{{- end }}
