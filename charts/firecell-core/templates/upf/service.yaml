{{- if .Values.upf.enabled }}
{{- /*
  Build effective instance list — mirrors deployment-o5gs.yaml pattern.
  Single-UPF (legacy) mode: one Service, VIP = network.upfExternalIP.
  Multi-UPF mode: one Service per instance, each VIP = inst.n3IP.
*/}}
{{- $instances := .Values.upf.instances }}
{{- if not $instances }}
{{- $instances = list (dict
    "suffix" ""
    "n3IP"   .Values.network.upfExternalIP
) }}
{{- end }}
{{- range $i, $inst := $instances }}
{{- $appName := printf "o5gs-upf%s" (($inst.suffix | default "" | toString)) }}
{{- if eq ($.Values.upf.type | default "o5gs") "oai" }}
{{- $appName = printf "oai-upf%s" (($inst.suffix | default "" | toString)) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $appName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" $ | nindent 4 }}
    app: {{ $appName }}
    tier: core-network
  {{- if eq ($.Values.upf.serviceType | default "LoadBalancer") "LoadBalancer" }}
  annotations:
    {{- /* SR-IOV multi-UPF: each VIP lives in its own per-VF pool (firecell-up-pool-N),
           announced on that UPF's own VF, so gNB ARP resolves to the correct VF. */}}
    {{- if $.Values.network.metallb.upInstances }}
    metallb.universe.tf/address-pool: firecell-up-pool-{{ $i }}
    {{- else }}
    metallb.universe.tf/address-pool: firecell-up-pool
    {{- end }}
    metallb.universe.tf/loadBalancerIPs: {{ $inst.n3IP }}
  {{- end }}
spec:
  type: {{ $.Values.upf.serviceType | default "LoadBalancer" }}
  {{- if eq ($.Values.upf.serviceType | default "LoadBalancer") "LoadBalancer" }}
  externalTrafficPolicy: Local   # preserve real gNB source IP; UPF pod is always local (hostNetwork)
  {{- end }}
  ports:
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
    {{- if and (eq ($.Values.upf.type | default "o5gs") "oai") ($.Values.upf.fcaps.enabled | default false) }}
    # The NMS reaches the MnS producer through this port. The UPF Service is
    # already a LoadBalancer for GTP-U; the in-cluster ClusterIP of the same
    # object is what the NMS uses.
    - name: mns
      port: {{ $.Values.upf.fcaps.mnsPort }}
      targetPort: {{ $.Values.upf.fcaps.mnsPort }}
      protocol: TCP
    {{- end }}
    {{- if $.Values.upf.dnnDataplane.enabled | default false }}
    {{- $dnnDpPort := add ($.Values.upf.dnnDataplane.basePort | default 8196 | int) $i }}
    # This is the address that belongs in nf_endpoint kind DNN_DP for this NE.
    # Per instance, not shared: the helper can only reach the namespace of the
    # pod it runs in, so a Service spanning several UPFs would answer for the
    # wrong one.
    - name: dnn-dataplane
      port: {{ $dnnDpPort }}
      targetPort: {{ $dnnDpPort }}
      protocol: TCP
    {{- end }}
  selector:
    app: {{ $appName }}
{{- if and (not $.Values.upf.hostNetwork) ($.Values.upf.multus.enabled | default false) }}
---
# Headless service exposing the UPF pod IP directly so oai-smf can resolve the
# ephemeral pod IP at startup and bind n3_local_ipv4 to the NRF-discovered node_id (KI-1).
apiVersion: v1
kind: Service
metadata:
  name: {{ $appName }}-pod
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" $ | nindent 4 }}
    app: {{ $appName }}
    tier: core-network
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
  selector:
    app: {{ $appName }}
{{- end }}
{{- end }}
{{- end }}
{{- $pcapSvcEnabled := and .Values.upf.enabled (.Values.upf.packetCapture.enabled | default true) }}
{{- $instList := .Values.upf.instances | default list }}
{{- if not $instList }}
{{- $instList = list (dict "suffix" "") }}
{{- end }}
{{- $multiUpf := gt (len $instList) 1 }}
{{- if and $pcapSvcEnabled (or (not $multiUpf) (not (.Values.upf.packetCapture.disableOnMultiInstance | default true))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: upf-packet-capture
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: upf-packet-capture
    component: packet-capture
    tier: core-network
spec:
  clusterIP: None
  ports:
    - name: packet-capture
      port: 8095
      targetPort: 8095
      protocol: TCP
  selector:
    firecell.io/packet-capture: upf
{{- end }}
