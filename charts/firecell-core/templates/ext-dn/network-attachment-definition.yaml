{{- $n6 := .Values.extDn.n6 | default dict }}
{{- if and .Values.extDn.enabled $n6.ip }}
{{- $upfMultus := .Values.upf.multus | default dict }}
{{- $upfN6 := $upfMultus.n6 | default dict }}
{{- $upfN6dev := coalesce $upfN6.device $upfN6.bridge $upfN6.masterInterface "" }}
{{- $onBridge := and .Values.upf.enabled (eq .Values.upf.type "oai") (not .Values.upf.hostNetwork) ($upfMultus.enabled | default false) (eq ($upfN6.cniType | default "macvlan") "bridge") $upfN6dev $upfN6.ip }}
{{- if not $onBridge }}
{{- fail "extDn.n6.ip needs an OAI UPF on Multus with upf.multus.n6.cniType: bridge, its bridge and upf.multus.n6.ip set. With host-device the N6 NIC belongs to the UPF pod, and a macvlan sibling bypasses generic XDP (KI-2)." }}
{{- end }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $n6.nadName | default "ext-dn-n6" }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-ext-dn
    tier: core-network
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ $n6.nadName | default "ext-dn-n6" }}",
      "type": "bridge",
      "bridge": "{{ $upfN6dev }}",
      "isGateway": false,
      "ipMasq": false,
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "{{ $n6.ip }}/{{ $upfN6.subnetPrefix | default 24 }}"
          }
        ],
        "routes": [
          {{- $pools := list }}
          {{- range (.Values.coreConfig | default dict).dnns }}
          {{- if .ipv4Subnet }}{{ $pools = append $pools .ipv4Subnet }}{{ end }}
          {{- end }}
          {{- range $i, $pool := $pools | uniq }}
          {{- if $i }},{{ end }}
          { "dst": "{{ $pool }}", "gw": "{{ $upfN6.ip }}" }
          {{- end }}
        ]
      }
    }
{{- end }}
