{{- if .Values.pcf.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-pcf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-pcf
    tier: core-network
spec:
  replicas: {{ include "firecell-5gc.replicas" (dict "ctx" . "replicas" .Values.pcf.replicas) }}
  selector:
    matchLabels:
      app: oai-pcf
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oai-pcf
        tier: core-network
        firecell.io/role: core-nf
        role: active
      annotations:
        {{- include "firecell-5gc.configChecksum" . | nindent 8 }}
    spec:
      priorityClassName: {{ .Values.pcf.priorityClassName }}
      {{- include "firecell-5gc.haScheduling" (dict "ctx" . "app" "oai-pcf" "replicas" .Values.pcf.replicas) | nindent 6 }}
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
        {{- if .Values.pcf.waitForMysql }}
        {{- include "firecell-5gc.waitForMysql" . | nindent 8 }}
        {{- end }}
      containers:
        - name: pcf
          image: {{ .Values.pcf.imageOverride | default (include "firecell-5gc.nfImage" (dict "registry" .Values.global.imageRegistry "image" .Values.pcf.image "imageTag" .Values.pcf.imageTag "pkgVersion" .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- toYaml .Values.pcf.command | nindent 12 }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: FCAPS_CM_DATASTORE
              value: {{ printf "%s/%s" .Values.pcf.fcaps.datastore.mountPath .Values.pcf.fcaps.datastore.file | quote }}
            {{- if .Values.pcf.fcaps.enabled }}
            {{- with .Values.pcf.fcaps.seedConfigPath }}
            - name: FCAPS_SEED_CONFIG
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            {{- toYaml .Values.pcf.ports | nindent 12 }}
            {{- if .Values.pcf.fcaps.enabled }}
            - name: mns
              containerPort: {{ .Values.pcf.fcaps.mnsPort }}
              protocol: TCP
            {{- end }}
          volumeMounts:
{{- with (include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "pcf")) }}
{{ . | indent 12 }}
{{- end }}
            - name: common-config
              mountPath: {{ .Values.pcf.configMountPath }}
              subPath: basic_nrf_config_ebpf_qos.yaml
            - name: cm-state
              mountPath: {{ .Values.pcf.fcaps.datastore.mountPath }}
              {{- if and .Values.pcf.fcaps.enabled (eq .Values.pcf.fcaps.intentMode "configmap") }}
              readOnly: true
              {{- end }}
            {{- with .Values.coreConfig.pcf.trace }}
            # Trace record files (pcf.trace.dir): the image has no such directory and the PCF
            # does not create it.
            - name: trace
              mountPath: {{ include "firecell-5gc.pcfTraceDir" . }}
            {{- end }}
          resources:
            {{- toYaml .Values.pcf.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          {{- include "firecell-5gc.nfLivenessProbe" (dict "initialDelaySeconds" 30 "periodSeconds" 10 "failureThreshold" 5 "timeoutSeconds" 5) | nindent 10 }}
        {{- include "firecell-5gc.healthzSidecar" (dict "Values" .Values "nfName" "pcf" "healthPath" "/npcf-smpolicycontrol/v1/health") | nindent 8 }}
      volumes:
{{- with (include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "pcf")) }}
{{ . | indent 8 }}
{{- end }}
        - name: common-config
          configMap:
            name: firecell-common-config
        - name: cm-state
          {{- if not .Values.pcf.fcaps.enabled }}
          # fcaps off: the image may still serve MnS. Keep its CM datastore across a
          # container restart (helm-charts #1914); a new pod still starts empty.
          emptyDir: {}
          {{- else if eq .Values.pcf.fcaps.intentMode "configmap" }}
          # Mounted as a directory on purpose. A ConfigMap mounted through
          # subPath is NEVER refreshed by kubelet, which would silently make
          # every change require a pod restart and defeat the HOT path.
          configMap:
            name: {{ .Values.pcf.fcaps.intentConfigMap.name }}
            optional: {{ .Values.pcf.fcaps.intentConfigMap.optional }}
          {{- else }}
          persistentVolumeClaim:
            claimName: oai-pcf-cm-state
          {{- end }}
        {{- if .Values.coreConfig.pcf.trace }}
        # Lost when the pod restarts, like the Trace Sessions themselves (they are in memory).
        - name: trace
          emptyDir: {}
        {{- end }}
        {{- include "firecell-5gc.healthzVolume" . | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
