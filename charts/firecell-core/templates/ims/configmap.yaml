{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "asterisk") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: ims
    tier: core-network
data:
  sip.conf: |
    {{- .Values.ims.sipConf | nindent 4 }}
  users.conf: {{ .Values.ims.usersConf | quote }}
{{- end }}
