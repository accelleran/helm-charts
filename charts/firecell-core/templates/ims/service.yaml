{{- if and .Values.ims.enabled (ne (.Values.ims.engine | default "asterisk") "kamailio") }}
apiVersion: v1
kind: Service
metadata:
  name: ims
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: ims
    tier: core-network
spec:
  type: ClusterIP
  ports:
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    {{- if and .Values.ims.sidecar .Values.ims.sidecar.enabled }}
    - name: sidecar-http
      port: 8080
      targetPort: 8080
      protocol: TCP
    {{- end }}
  selector:
    app: ims
{{- end }}
