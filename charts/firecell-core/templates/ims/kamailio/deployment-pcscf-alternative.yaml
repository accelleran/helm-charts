{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "kamailio") .Values.ims.pcscf.alternative.enabled }}
{{- /* The alternative P-CSCF of P-CSCF restoration (TS 23.380 5.8.5, cn5g-ims L4-A9-5): a second
       P-CSCF Deployment, same image and settings as the first, with its own address. The
       S-CSCF retries a terminating INVITE through it when the UE's P-CSCF does not answer
       (ims.pcscf.alternative -> ALTERNATIVE_PCSCF); it then asks the PCF to start the
       restoration (PCSCF_RESTORE_*). */}}
{{- $alt := .Values.ims.pcscf.alternative }}
{{- $pcscfIp := required "ims.pcscf.alternative.ip is required when ims.pcscf.alternative.enabled is true" $alt.ip }}
{{- $icscfIp := .Values.ims.icscf.ip }}
{{- $scscfIp := .Values.ims.scscf.ip }}
{{- $cxIp := .Values.ims.cxGateway.ip }}
{{- $bindPort := $alt.bindPort | default .Values.ims.pcscf.bindPort | default 5060 }}
{{- $ipsecS := $alt.ipsecServerPort | default .Values.ims.pcscf.ipsecServerPort | default 6100 }}
{{- $ipsecC := $alt.ipsecClientPort | default .Values.ims.pcscf.ipsecClientPort | default 5100 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-pcscf-alt
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: ims-pcscf-alt
    tier: core-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ims-pcscf-alt
  template:
    metadata:
      labels:
        app: ims-pcscf-alt
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ .Values.ims.priorityClassName | default .Values.ims.priorityClassName }}
      hostNetwork: {{ .Values.ims.pcscf.hostNetwork | default true }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pcscf
          image: {{ .Values.ims.imageOverride | default (printf "%s/%s:%s" .Values.global.imageRegistry .Values.ims.image .Values.ims.imageTag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # ctl/jsonrpcs need a writable rundir (image may predate mkdir in init).
          command: ["/bin/bash", "-lc"]
          args:
            - |
              mkdir -p /var/run/kamailio_pcscf
              exec /firecell-entrypoint.sh
          securityContext:
            privileged: {{ .Values.ims.pcscf.privileged | default true }}
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            {{- include "firecell-5gc.kamailioCommonEnv" (dict "root" . "component" "pcscf") | nindent 12 }}
            - name: PCSCF_IP
              value: {{ $pcscfIp | quote }}
            - name: ICSCF_IP
              value: {{ $icscfIp | quote }}
            - name: SCSCF_IP
              value: {{ $scscfIp | quote }}
            - name: UPF_N6_GW
              value: {{ .Values.ims.upfN6Gateway | quote }}
            - name: UE_IMS_SUBNET
              value: {{ .Values.ims.ueImsSubnet | quote }}
            - name: RTPENGINE_IP
              value: {{ .Values.ims.rtpengine.ip | default "127.0.0.1" | quote }}
            # false drops FORCE_RTPRELAY (the image default is true).
            - name: RTPENGINE_ENABLED
              value: {{ ternary "true" "false" (.Values.ims.rtpengine.enabled | default false) | quote }}
            # P-CSCF restoration (cn5g-ims L4-A9-5): a terminating INVITE with X-Failed-PCSCF makes
            # this P-CSCF POST pcscf-restoration to the PCF. It does not use Rx.
            - name: PCSCF_RESTORE_ENABLED
              value: "true"
            - name: PCSCF_RESTORE_PCF_URL
              value: {{ $alt.pcfUri | default (printf "http://oai-pcf.%s.svc.cluster.local:8080" .Values.global.namespace) | quote }}
            - name: PCSCF_RESTORE_HTTP_VERSION
              value: {{ $alt.pcfHttpVersion | default .Values.coreConfig.httpVersion | quote }}
            {{- if .Values.ims.rxN5Iwf.enabled }}
            # Rx towards the rx-n5-iwf sidecar (cn5g-ims L4-11-8): media authorization at
            # INVITE. RX_PEER_HOST is the IWF's Diameter identity and DNS name.
            - name: RX_ENABLED
              value: "true"
            - name: RX_PEER_HOST
              value: {{ .Values.ims.rxN5Iwf.originHost | default "ims-rx-n5-iwf" | quote }}
            - name: RX_PEER_PORT
              value: {{ .Values.ims.rxN5Iwf.diameterPort | quote }}
            - name: RX_REG_ENABLED
              value: {{ ternary "true" "false" (.Values.ims.rxN5Iwf.rxRegEnabled | default false) | quote }}
            {{- end }}
          volumeMounts:
            - name: ims-secrets
              mountPath: /run/secrets/ims
              readOnly: true
          ports:
            - name: sip-tcp
              containerPort: {{ $bindPort }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ $bindPort }}
              protocol: UDP
            - name: ipsec-s
              containerPort: {{ $ipsecS }}
              protocol: UDP
            - name: ipsec-c
              containerPort: {{ $ipsecC }}
              protocol: UDP
          resources:
            {{- toYaml (.Values.ims.pcscf.resources | default .Values.ims.resources) | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -x kamailio > /dev/null
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -x kamailio > /dev/null
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        {{- include "firecell-5gc.imsSecretVolume" (dict "root" . "name" "ims-secrets" "withRoot" true "keys" (list "kamailio-db-password")) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ims-pcscf-alt
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ims-pcscf-alt
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: sip-tcp
      port: {{ $bindPort }}
      protocol: TCP
    - name: sip-udp
      port: {{ $bindPort }}
      protocol: UDP
  selector:
    app: ims-pcscf-alt
{{- end }}
