{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "kamailio") }}
{{- $pcscfIp := .Values.ims.pcscf.ip | default .Values.coreConfig.ims.pcscfIpv4 }}
{{- $icscfIp := .Values.ims.icscf.ip }}
{{- $scscfIp := .Values.ims.scscf.ip }}
{{- $cxIp := .Values.ims.cxGateway.ip }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-pcscf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: ims-pcscf
    tier: core-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ims-pcscf
  template:
    metadata:
      labels:
        app: ims-pcscf
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ .Values.ims.priorityClassName | default .Values.ims.priorityClassName }}
      hostNetwork: {{ include "firecell-5gc.flag" (list .Values.ims.pcscf.hostNetwork true) }}
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pcscf
          image: {{ .Values.ims.imageOverride | default (printf "%s/%s:%s" .Values.global.imageRegistry .Values.ims.image .Values.ims.imageTag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # ctl/jsonrpcs need a writable rundir (image may predate mkdir in init).
          command: ["/bin/bash", "-lc"]
          args:
            - |
              mkdir -p /var/run/kamailio_pcscf
              exec /firecell-entrypoint.sh
          securityContext:
            privileged: {{ include "firecell-5gc.flag" (list .Values.ims.pcscf.privileged true) }}
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            {{- include "firecell-5gc.kamailioCommonEnv" (dict "root" . "component" "pcscf") | nindent 12 }}
            - name: PCSCF_IP
              value: {{ $pcscfIp | quote }}
            - name: ICSCF_IP
              value: {{ $icscfIp | quote }}
            # REGISTER goes to ICSCF_IP:ICSCF_PORT, the I-CSCF provisioned in the P-CSCF (TS 24.229
            # 5.2.2.1 NOTE 15; cn5g-ims #7): no IMS DNS SRV record needed
            - name: ICSCF_PORT
              value: {{ .Values.ims.icscf.bindPort | default 4060 | quote }}
            - name: SCSCF_IP
              value: {{ $scscfIp | quote }}
            - name: UPF_N6_GW
              value: {{ .Values.ims.upfN6Gateway | quote }}
            - name: UE_IMS_SUBNET
              value: {{ .Values.ims.ueImsSubnet | quote }}
            - name: RTPENGINE_IP
              value: {{ .Values.ims.rtpengine.ip | default "127.0.0.1" | quote }}
            # false drops FORCE_RTPRELAY (the image default is true).
            - name: RTPENGINE_ENABLED
              value: {{ ternary "true" "false" (.Values.ims.rtpengine.enabled | default false) | quote }}
            {{- if .Values.global.sbi.tls.enabled }}
            # The core's SBI security (cn5g-ims 2991677): read only to warn that the P-CSCF
            # restoration request is cleartext without a token.
            - name: SBI_TLS_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.global.sbi.oauth2.enabled }}
            - name: SBI_OAUTH2_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.ims.rxN5Iwf.enabled }}
            # Rx towards the rx-n5-iwf sidecar (cn5g-ims L4-11-8): media authorization at
            # INVITE. RX_PEER_HOST is the IWF's Diameter identity and DNS name.
            - name: RX_ENABLED
              value: "true"
            - name: RX_PEER_HOST
              value: {{ .Values.ims.rxN5Iwf.originHost | default "ims-rx-n5-iwf" | quote }}
            - name: RX_PEER_PORT
              value: {{ .Values.ims.rxN5Iwf.diameterPort | quote }}
            - name: RX_REG_ENABLED
              value: {{ ternary "true" "false" (.Values.ims.rxN5Iwf.rxRegEnabled | default false) | quote }}
            {{- with .Values.ims.rxN5Iwf.epcDomain }}
            # The Rx peer realm: the IWF gets the same EPC_DOMAIN, else the two derive it from
            # MCC/MNC and the realms differ (the CER fails).
            - name: EPC_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: ims-secrets
              mountPath: /run/secrets/ims
              readOnly: true
          ports:
            - name: sip-tcp
              containerPort: {{ .Values.ims.pcscf.bindPort | default 5060 }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ .Values.ims.pcscf.bindPort | default 5060 }}
              protocol: UDP
            - name: ipsec-s
              containerPort: {{ .Values.ims.pcscf.ipsecServerPort | default 6100 }}
              protocol: UDP
            - name: ipsec-c
              containerPort: {{ .Values.ims.pcscf.ipsecClientPort | default 5100 }}
              protocol: UDP
          resources:
            {{- toYaml (.Values.ims.pcscf.resources | default .Values.ims.resources) | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -x kamailio > /dev/null
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -x kamailio > /dev/null
            initialDelaySeconds: 90
            periodSeconds: 20
      volumes:
        {{- include "firecell-5gc.imsSecretVolume" (dict "root" . "name" "ims-secrets" "withRoot" true "keys" (list "kamailio-db-password")) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ims-pcscf
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ims-pcscf
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: sip-tcp
      port: {{ .Values.ims.pcscf.bindPort | default 5060 }}
      protocol: TCP
    - name: sip-udp
      port: {{ .Values.ims.pcscf.bindPort | default 5060 }}
      protocol: UDP
  selector:
    app: ims-pcscf
{{- end }}
