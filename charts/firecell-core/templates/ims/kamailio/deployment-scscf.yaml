{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "kamailio") }}
{{- $scscfIp := .Values.ims.scscf.ip }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-scscf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: ims-scscf
    tier: core-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ims-scscf
  template:
    metadata:
      labels:
        app: ims-scscf
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ .Values.ims.priorityClassName | default .Values.ims.priorityClassName }}
      hostNetwork: {{ include "firecell-5gc.flag" (list .Values.ims.scscf.hostNetwork true) }}
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        {{- if .Values.ims.cxGateway.enabled }}
        {{- include "firecell-5gc.waitForMysql" . | nindent 8 }}
        {{- end }}
      containers:
        - name: scscf
          image: {{ .Values.ims.imageOverride | default (printf "%s/%s:%s" .Values.global.imageRegistry .Values.ims.image .Values.ims.imageTag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              mkdir -p /var/run/kamailio_scscf
              exec /firecell-entrypoint.sh
          env:
            {{- include "firecell-5gc.kamailioCommonEnv" (dict "root" . "component" "scscf") | nindent 12 }}
            - name: SCSCF_IP
              value: {{ $scscfIp | quote }}
            - name: SCSCF_BIND_PORT
              value: {{ .Values.ims.scscf.bindPort | default "6060" | quote }}
            - name: CX_GATEWAY_IP
              value: {{ .Values.ims.cxGateway.ip | quote }}
            - name: CX_GATEWAY_PORT
              value: {{ .Values.ims.cxGateway.port | default "3868" | quote }}
            {{- $pds := .Values.ims.scscf.pcscfDownSeconds }}
            {{- if and (not (kindIs "invalid" $pds)) (ne (toString $pds) "") }}
            {{- if not (regexMatch "^[0-9]{1,5}$" (toString $pds)) }}
            {{- fail (printf "ims.scscf.pcscfDownSeconds must be 1 to 86400 (got %v)" $pds) }}
            {{- end }}
            {{- if or (lt (int $pds) 1) (gt (int $pds) 86400) }}
            {{- fail (printf "ims.scscf.pcscfDownSeconds must be 1 to 86400 (got %v)" $pds) }}
            {{- end }}
            # How long a P-CSCF that did not answer stays non-reachable (cn5g-ims L8-P-1; the
            # S-CSCF default is 60 s).
            - name: PCSCF_DOWN_SECONDS
              value: {{ $pds | toString | quote }}
            {{- end }}
            {{- if .Values.ims.pcscf.alternative.enabled }}
            # P-CSCF restoration (cn5g-ims L4-A9-5): retry a terminating INVITE that the UE's
            # P-CSCF answers with 408 or 503 through the alternative P-CSCF.
            - name: ALTERNATIVE_PCSCF
              value: {{ printf "%s:%v" (required "ims.pcscf.alternative.ip is required when ims.pcscf.alternative.enabled is true" .Values.ims.pcscf.alternative.ip) (.Values.ims.pcscf.alternative.bindPort | default .Values.ims.pcscf.bindPort | default 5060) | quote }}
            {{- end }}
          volumeMounts:
            - name: ims-secrets
              mountPath: /run/secrets/ims
              readOnly: true
          ports:
            # SIP only — Cx/Diameter is client-side toward ims-cx-gateway (not a second hostPort).
            - name: sip-tcp
              containerPort: {{ .Values.ims.scscf.bindPort | default 6060 }}
              protocol: TCP
            - name: sip-udp
              containerPort: {{ .Values.ims.scscf.bindPort | default 6060 }}
              protocol: UDP
          resources:
            {{- toYaml (.Values.ims.scscf.resources | default .Values.ims.resources) | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -x kamailio > /dev/null"]
            initialDelaySeconds: 45
            periodSeconds: 10
      volumes:
        {{- include "firecell-5gc.imsSecretVolume" (dict "root" . "name" "ims-secrets" "withRoot" true "keys" (list "kamailio-db-password")) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ims-scscf
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: sip-tcp
      port: {{ .Values.ims.scscf.bindPort | default 6060 }}
      protocol: TCP
  selector:
    app: ims-scscf
{{- end }}
