{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "kamailio") .Values.ims.rxN5Iwf.enabled }}
{{- /* Rx (Diameter, TS 29.214) to N5 (Npcf_PolicyAuthorization, TS 29.514) interworking
       function of the P-CSCF (cn5g-ims rx-n5-iwf). The P-CSCF connects to it on the
       Diameter port; the PCF calls it back on the notify port. Settings follow
       rx-n5-iwf/config.py. */}}
{{- $iwf := .Values.ims.rxN5Iwf }}
{{- $svc := "ims-rx-n5-iwf" }}
{{- $ns := .Values.global.namespace }}
{{- $stateVol := $iwf.state.volume | default "none" }}
{{- $sbi := .Values.global.sbi }}
{{- $scheme := ternary "https" "http" $sbi.tls.enabled }}
{{- $nrfOn := or $iwf.nrf.register $sbi.oauth2.enabled }}
{{- if and $sbi.oauth2.enabled (not $iwf.nrf.register) }}
{{- fail "global.sbi.oauth2.enabled needs ims.rxN5Iwf.nrf.register true: the NRF issues no access token to an IWF that is not registered, and the IWF refuses to start (cn5g-ims config.py)" }}
{{- end }}
{{- if and $sbi.tls.enabled $iwf.pcfHttpVersion (ne (toString $iwf.pcfHttpVersion) "2") }}
{{- fail "ims.rxN5Iwf.pcfHttpVersion must be 2 (or empty) with global.sbi.tls.enabled: the SBI runs HTTP/2 over TLS" }}
{{- end }}
{{- range $k := list "pcfUri" "nrf.uri" }}
{{- $u := ternary $iwf.pcfUri $iwf.nrf.uri (eq $k "pcfUri") }}
{{- if and $u (not (hasPrefix (printf "%s://" $scheme) $u)) }}
{{- fail (printf "ims.rxN5Iwf.%s must start with %s:// (it follows global.sbi.tls.enabled; got %q)" $k $scheme $u) }}
{{- end }}
{{- end }}
{{- if not (has $stateVol (list "none" "emptyDir" "pvc")) }}
{{- fail (printf "ims.rxN5Iwf.state.volume must be none, emptyDir or pvc (got %q)" $stateVol) }}
{{- end }}
{{- if and (ne $stateVol "none") (or (lt (int $iwf.state.maxAgeS) 60) (gt (int $iwf.state.maxAgeS) 2592000)) }}
{{- fail (printf "ims.rxN5Iwf.state.maxAgeS must be 60 to 2592000 seconds (got %v)" $iwf.state.maxAgeS) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: {{ $svc }}
    tier: core-network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $svc }}
  template:
    metadata:
      labels:
        app: {{ $svc }}
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ .Values.ims.priorityClassName }}
      {{- if $iwf.nrf.register }}
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
      {{- end }}
      {{- if eq $stateVol "pvc" }}
      # A new claim's directory is root-owned: the group lets uid 10001 write the state file.
      securityContext:
        fsGroup: 10001
      {{- end }}
      containers:
        - name: rx-n5-iwf
          image: {{ $iwf.imageOverride | default (printf "%s/%s:%s" .Values.global.imageRegistry $iwf.image $iwf.imageTag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # The image runs as uid 10001; it writes only the Rx session map (state.volume).
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            # Same MCC and MNC as the P-CSCF: both derive the Diameter realm and the
            # Rx peer name pcrf.<EPC_DOMAIN> from them.
            - name: MCC
              value: {{ .Values.coreConfig.mcc | default "001" | quote }}
            - name: MNC
              value: {{ .Values.coreConfig.mnc | default "01" | quote }}
            {{- with $iwf.epcDomain }}
            - name: EPC_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            - name: RX_N5_IWF_LOG_LEVEL
              value: {{ $iwf.logLevel | quote }}
            # The Diameter identity the P-CSCF's RX_PEER_HOST names (also its DNS name).
            - name: RX_N5_IWF_ORIGIN_HOST
              value: {{ $iwf.originHost | default $svc | quote }}
            - name: RX_N5_IWF_DIAMETER_BIND
              value: "0.0.0.0"
            - name: RX_N5_IWF_DIAMETER_PORT
              value: {{ $iwf.diameterPort | quote }}
            {{- if $sbi.tls.enabled }}
            # SBI TLS (global.sbi.tls; cn5g-ims L8-P-2): HTTPS and HTTP/2 to the PCF and the NRF,
            # by the Service names their certificates carry; the IWF's own certificate
            # (sbi-tls-rx-n5-iwf) is its client certificate. The notify server stays http.
            - name: RX_N5_IWF_TLS_ENABLED
              value: "true"
            - name: RX_N5_IWF_TLS_CA
              value: /etc/firecell/sbi-tls/ca.crt
            - name: RX_N5_IWF_TLS_CERT
              value: /etc/firecell/sbi-tls/tls.crt
            - name: RX_N5_IWF_TLS_KEY
              value: /etc/firecell/sbi-tls/tls.key
            - name: RX_N5_IWF_TLS_VERIFY_PEER
              value: {{ ternary "true" "false" $sbi.tls.verifyPeer | quote }}
            - name: RX_N5_IWF_PCF_URI
              value: {{ $iwf.pcfUri | default "https://oai-pcf:8080" | quote }}
            - name: RX_N5_IWF_PCF_HTTP_VERSION
              value: "2"
            {{- else }}
            - name: RX_N5_IWF_PCF_URI
              value: {{ $iwf.pcfUri | default (printf "http://oai-pcf.%s.svc.cluster.local:8080" $ns) | quote }}
            - name: RX_N5_IWF_PCF_HTTP_VERSION
              value: {{ $iwf.pcfHttpVersion | default .Values.coreConfig.httpVersion | quote }}
            {{- end }}
            {{- if $sbi.oauth2.enabled }}
            # SBI OAuth2 (global.sbi.oauth2; cn5g-ims L8-P-2): access tokens from the NRF.
            - name: RX_N5_IWF_OAUTH2_ENABLED
              value: "true"
            {{- end }}
            {{- if $nrfOn }}
            # Registration at the NRF as an AF (cn5g-ims L8-P-2b), needed for OAuth2.
            - name: RX_N5_IWF_REGISTER_NRF
              value: {{ ternary "true" "false" $iwf.nrf.register | quote }}
            - name: RX_N5_IWF_NRF_URI
              value: {{ $iwf.nrf.uri | default (printf "%s://oai-nrf:%v" $scheme (.Values.nrf.sbiPort | default 8080)) | quote }}
            - name: RX_N5_IWF_NF_INSTANCE_ID
              value: {{ include "firecell-5gc.rxN5IwfNfInstanceId" . | quote }}
            {{- end }}
            - name: RX_N5_IWF_PCF_TIMEOUT_S
              value: {{ $iwf.pcfTimeoutS | quote }}
            # The URI the PCF posts its notify / terminate to: this Service.
            - name: RX_N5_IWF_NOTIFY_URI
              value: {{ $iwf.notifyUri | default (printf "http://%s.%s.svc.cluster.local:%v" $svc $ns $iwf.notifyPort) | quote }}
            - name: RX_N5_IWF_NOTIFY_BIND
              value: "0.0.0.0"
            - name: RX_N5_IWF_NOTIFY_PORT
              value: {{ $iwf.notifyPort | quote }}
            {{- if ne $stateVol "none" }}
            # The Rx session map on disk (cn5g-ims L8-P-3): calls in progress keep their N5
            # app-session across an IWF restart.
            - name: RX_N5_IWF_STATE_FILE
              value: /var/lib/rx-n5-iwf/sessions.db
            - name: RX_N5_IWF_STATE_MAX_AGE_S
              value: {{ $iwf.state.maxAgeS | quote }}
            {{- end }}
          ports:
            - name: diameter
              containerPort: {{ $iwf.diameterPort }}
              protocol: TCP
            - name: notify
              containerPort: {{ $iwf.notifyPort }}
              protocol: TCP
          # The image HEALTHCHECK: both the Diameter acceptor and the notification
          # server must accept a TCP connection.
          readinessProbe:
            exec:
              command: ["python3", "/opt/firecell/rx-n5-iwf/rx_n5_iwf.py", "--healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python3", "/opt/firecell/rx-n5-iwf/rx_n5_iwf.py", "--healthcheck"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $iwf.resources | nindent 12 }}
          {{- $mounts := include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "rx-n5-iwf") }}
          {{- if or (ne $stateVol "none") $mounts }}
          volumeMounts:
            {{- if ne $stateVol "none" }}
            - name: state
              mountPath: /var/lib/rx-n5-iwf
            {{- end }}
            {{- with $mounts }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- $vols := include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "rx-n5-iwf") }}
      {{- if or (ne $stateVol "none") $vols }}
      volumes:
        {{- if ne $stateVol "none" }}
        - name: state
          {{- if eq $stateVol "pvc" }}
          persistentVolumeClaim:
            claimName: ims-rx-n5-iwf-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with $vols }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: {{ $svc }}
    tier: core-network
spec:
  type: ClusterIP
  ports:
    - name: diameter
      port: {{ $iwf.diameterPort }}
      targetPort: {{ $iwf.diameterPort }}
      protocol: TCP
    - name: notify
      port: {{ $iwf.notifyPort }}
      targetPort: {{ $iwf.notifyPort }}
      protocol: TCP
  selector:
    app: {{ $svc }}
{{- if eq $stateVol "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ims-rx-n5-iwf-state
  namespace: {{ $ns }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: {{ $svc }}
    tier: core-network
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $iwf.state.size }}
  storageClassName: {{ $iwf.state.storageClassName }}
{{- end }}
{{- end }}
