{{- if and .Values.ims.enabled (eq (.Values.ims.engine | default "kamailio") "kamailio") (not .Values.ims.credentials.existingSecret) }}
# Passwords of the IMS MySQL accounts (cn5g-ims rc-02 images): the Cx gateway's
# pyhss account and the pcscf/icscf/scscf Kamailio accounts. The images set the
# account password on every start (ALTER USER), so rotating means changing a
# value here and restarting the pods. Generated once and kept across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: ims-db-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cx-db-password: {{ include "firecell-5gc.imsCredential" (dict "root" . "key" "cx-db-password" "value" .Values.ims.credentials.cxDbPassword) | quote }}
  kamailio-db-password: {{ include "firecell-5gc.imsCredential" (dict "root" . "key" "kamailio-db-password" "value" .Values.ims.credentials.kamailioDbPassword) | quote }}
{{- end }}
