{{- if .Values.eir.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: oai-eir
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-eir
    tier: core-network
spec:
  type: ClusterIP
  ports:
    # The SBI port serves HTTP/2 only (nghttp2); the health port is HTTP/1.1.
    - name: sbi
      port: {{ .Values.eir.config.listenPort }}
      targetPort: {{ .Values.eir.config.listenPort }}
      protocol: TCP
    {{- if gt (int (include "firecell-5gc.eirHealthPort" .)) 0 }}
    - name: health
      port: {{ include "firecell-5gc.eirHealthPort" . }}
      targetPort: {{ include "firecell-5gc.eirHealthPort" . }}
      protocol: TCP
    {{- end }}
    {{- if .Values.eir.fcaps.enabled }}
    # The NMS reaches the MnS producer here.
    - name: mns
      port: {{ .Values.eir.fcaps.mnsPort }}
      targetPort: {{ .Values.eir.fcaps.mnsPort }}
      protocol: TCP
    {{- end }}
  selector:
    app: oai-eir
{{- end }}
