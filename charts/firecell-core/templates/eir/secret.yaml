{{- if .Values.eir.enabled }}
{{- /* A Secret, not a ConfigMap: the file holds the MySQL password (coreConfig.database)
       and the client tokens. Keys follow cn5g-eir configs/eir.yaml; the EIR reads them
       with its own line-based parser (src/adapters/config/eir_config.cpp). */}}
{{- $db := .Values.coreConfig.database }}
{{- $cfg := .Values.eir.config }}
{{- if and (eq $cfg.authProfile "commercial") (lt (len (toString ($cfg.provToken | default ""))) 32) }}
{{- fail "eir.config.provToken must have at least 32 characters with eir.config.authProfile commercial: the EIR ignores shorter provisioning tokens there (cn5g-eir 7421d26), and the chart default is a published lab value" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: oai-eir-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-eir
type: Opaque
stringData:
  eir.yaml: |
    listen:
      host: {{ $cfg.listenHost | quote }}
      port: {{ $cfg.listenPort }}
      health_http1_port: {{ $cfg.healthHttp1Port }}
    mysql:
      dsn: {{ printf "mysql://%s:%s@%s:%v/%s" $db.user (include "firecell-5gc.databasePassword" .) $db.host ($db.port | default 3306) ($cfg.mysqlDatabase | default $db.name) | quote }}
    auth:
      profile: {{ $cfg.authProfile }}
      check:
        # FIXME(spec, TS 29.511 6.1.7.3 / TS 29.500 6.7.3): the AMF sends no OAuth2
        # access token until feature 05 is on (sbiOAuth2Enabled); lab profile only.
        allow_anonymous: {{ $cfg.allowAnonymous }}
        allowed_clients:
          - id: amf
            token: {{ $cfg.checkToken | quote }}
      prov:
        allowed_clients:
          - id: nms
            token: {{ $cfg.provToken | quote }}
      {{- if and .Values.global.sbi.oauth2.enabled (eq $cfg.authProfile "commercial") }}
      oauth:
        # Check the NRF's access tokens locally (cn5g-eir L6-05-eir), ES256.
        jwt_public_key_file: /etc/firecell/sbi-oauth2/public-key.pem
      {{- end }}
    tls:
      {{- if .Values.global.sbi.tls.enabled }}
      enabled: true
      cert_file: /etc/firecell/sbi-tls/tls.crt
      key_file: /etc/firecell/sbi-tls/tls.key
      ca_file: /etc/firecell/sbi-tls/ca.crt
      require_client_cert: {{ .Values.global.sbi.tls.requireClientCert }}
      {{- else }}
      enabled: false
      {{- end }}
    nrf:
      enabled: {{ $cfg.nrfEnabled }}
      required: {{ $cfg.nrfRequired }}
      nfm_url: {{ $cfg.nrfNfmUrl | default (printf "%s://oai-nrf:%v/nnrf-nfm/v1" (ternary "https" "http" .Values.global.sbi.tls.enabled) (.Values.nrf.sbiPort | default 8080)) | quote }}
      heartbeat_interval_s: 10
    advertise:
      api_root: {{ $cfg.advertiseApiRoot | default (printf "%s://oai-eir.%s.svc.cluster.local:%v" (ternary "https" "http" .Values.global.sbi.tls.enabled) .Values.global.namespace $cfg.listenPort) | quote }}
    policy:
      pei_supi_binding_check: {{ $cfg.peiSupiBindingCheck }}
{{- end }}
