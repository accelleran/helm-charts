{{- if .Values.eir.enabled }}
{{- /* A Secret, not a ConfigMap: the file holds the MySQL password (coreConfig.database)
       and the client tokens. Keys follow cn5g-eir configs/eir.yaml; the EIR reads them
       with its own line-based parser (src/adapters/config/eir_config.cpp). */}}
{{- $db := .Values.coreConfig.database }}
{{- $cfg := .Values.eir.config }}
apiVersion: v1
kind: Secret
metadata:
  name: oai-eir-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-eir
type: Opaque
stringData:
  eir.yaml: |
    listen:
      host: {{ $cfg.listenHost | quote }}
      port: {{ $cfg.listenPort }}
      health_http1_port: {{ $cfg.healthHttp1Port }}
    mysql:
      dsn: {{ printf "mysql://%s:%s@%s:%v/%s" $db.user (include "firecell-5gc.databasePassword" .) $db.host ($db.port | default 3306) ($cfg.mysqlDatabase | default $db.name) | quote }}
    auth:
      profile: {{ $cfg.authProfile }}
      check:
        # FIXME(spec, TS 29.511 6.1.7.3 / TS 29.500 6.7.3): the AMF sends no OAuth2
        # access token until feature 05 is on (sbiOAuth2Enabled); lab profile only.
        allow_anonymous: {{ $cfg.allowAnonymous }}
        allowed_clients:
          - id: amf
            token: {{ $cfg.checkToken | quote }}
      prov:
        allowed_clients:
          - id: nms
            token: {{ $cfg.provToken | quote }}
    tls:
      enabled: false
    nrf:
      enabled: {{ $cfg.nrfEnabled }}
      required: {{ $cfg.nrfRequired }}
      nfm_url: {{ $cfg.nrfNfmUrl | default (printf "http://oai-nrf:%v/nnrf-nfm/v1" (.Values.nrf.sbiPort | default 8080)) | quote }}
      heartbeat_interval_s: 10
    advertise:
      api_root: {{ $cfg.advertiseApiRoot | default (printf "http://oai-eir.%s.svc.cluster.local:%v" .Values.global.namespace $cfg.listenPort) | quote }}
    policy:
      pei_supi_binding_check: {{ $cfg.peiSupiBindingCheck }}
{{- end }}
