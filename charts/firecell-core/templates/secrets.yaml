{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
  {{- if (.Values.mysql | default dict).keepSecretOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  root-password: {{ include "firecell-5gc.mysqlRootPassword" . | quote }}
  user: {{ include "firecell-5gc.mysqlUser" . | quote }}
  password: {{ include "firecell-5gc.mysqlPassword" . | quote }}
{{- end }}
