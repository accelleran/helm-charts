{{- if .Values.networkPolicies.enabled }}
# Deny all ingress to the core namespace except from within it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cp-isolation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
spec:
  {{- if and .Values.ims.enabled .Values.ims.rxN5Iwf.enabled }}
  # The rx-n5-iwf has its own policy (rx-n5-iwf.yaml): its notify port is for the PCF only.
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - ims-rx-n5-iwf
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from within the firecell-core namespace (including Helm verification hooks)
    - from:
        - podSelector: {}
    {{- $allowNms := .Values.fcAcsAgent.enabled }}
    {{- if hasKey (.Values.networkPolicies | default dict) "allowNmsNamespace" }}
    {{- $allowNms = .Values.networkPolicies.allowNmsNamespace }}
    {{- end }}
    {{- if $allowNms }}
    # Allow traffic from firecell-nms namespace (NMS -> core)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "firecell-5gc.nmsNamespace" . }}
    {{- end }}
    {{- range (.Values.networkPolicies).allowedNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- if .Values.networkPolicies.allowedExternalCIDRs }}
    # Allow external traffic from configured external CIDRs
    - from:
        {{- range .Values.networkPolicies.allowedExternalCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    # Allow gNB NGAP (SCTP 38412) and TR-069 ACS (TCP 7547) ingress
    {{- if .Values.amf.enabled }}
    - ports:
        - protocol: SCTP
          port: 38412
    {{- end }}
    {{- if .Values.fcAcsAgent.enabled }}
    - ports:
        - protocol: TCP
          port: 7547
    {{- end }}
{{- end }}
