{{- if .Values.nef.enabled }}
{{- /* cn5g-nef (Nnef_EventExposure, TS 29.122 monitoring events). The image renders its
       etc/nef.conf from environment variables at start (entrypoint.py), so there is no
       ConfigMap; the variable names are the placeholders of etc/nef.conf. */}}
{{- $nef := .Values.nef }}
{{- $cfg := $nef.config }}
{{- $nrfOn := or $cfg.nrf.register $cfg.nrf.discoverAmf }}
{{- $sbi := .Values.global.sbi }}
{{- if and $sbi.oauth2.enabled (not $cfg.nrf.register) }}
{{- fail "global.sbi.oauth2.enabled needs nef.config.nrf.register true: the NEF gets its access tokens from the NRF only when it is registered there, else its requests to the AMF, SMF and UDM carry no token and are refused" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-nef
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-nef
    tier: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oai-nef
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oai-nef
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ $nef.priorityClassName }}
      {{- if $nrfOn }}
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
      {{- end }}
      containers:
        - name: nef
          image: {{ $nef.imageOverride | default (include "firecell-5gc.nfImage" (dict "registry" .Values.global.imageRegistry "image" $nef.image "imageTag" $nef.imageTag "pkgVersion" .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # The image ENTRYPOINT and CMD start the NEF: entrypoint.py renders etc/nef.conf.
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: NEF_INTERFACE_NAME_FOR_SBI
              value: {{ $cfg.interfaceName | quote }}
            - name: NEF_INTERFACE_PORT_FOR_SBI
              value: {{ $cfg.sbiPort | quote }}
            - name: NEF_INTERFACE_HTTP2_PORT_FOR_SBI
              value: {{ $cfg.sbiHttp2Port | quote }}
            # Peers, resolved by the entrypoint when the NEF starts (AMF: Namf_EventExposure).
            {{- range $peer := list "amf" "smf" "udm" }}
            {{- $p := get $cfg.peers $peer }}
            - name: {{ upper $peer }}_HOSTNAME
              value: {{ $p.hostname | quote }}
            - name: {{ upper $peer }}_PORT
              value: {{ $p.port | quote }}
            - name: {{ upper $peer }}_HTTP2_PORT
              value: {{ $p.http2Port | quote }}
            {{- end }}
            - name: USE_HTTP2
              value: {{ ternary "yes" "no" $cfg.useHttp2 | quote }}
            {{- if $nrfOn }}
            # The NRF block of nef.conf is written when a host is set, and the entrypoint
            # resolves it at start: only with REGISTER_NRF / DISCOVER_AMF, so a NEF without
            # them does not depend on the NRF.
            - name: NRF_HOSTNAME
              value: {{ $cfg.nrf.hostname | quote }}
            - name: NRF_PORT
              value: {{ $cfg.nrf.port | quote }}
            {{- end }}
            - name: MONITORING_EVENT_ENABLED
              value: {{ ternary "yes" "no" $cfg.monitoringEventEnabled | quote }}
            {{- if .Values.nef.fcaps.enabled }}
            - name: FCAPS_CM_DATASTORE
              value: {{ printf "%s/%s" .Values.nef.fcaps.datastore.mountPath .Values.nef.fcaps.datastore.file | quote }}
            {{- end }}
            - name: REGISTER_NRF
              value: {{ ternary "yes" "no" $cfg.nrf.register | quote }}
            - name: DISCOVER_AMF
              value: {{ ternary "yes" "no" $cfg.nrf.discoverAmf | quote }}
            {{- if $sbi.tls.enabled }}
            # SBI TLS (global.sbi.tls): the TLS group of etc/nef.conf (cn5g-nef 169bd33a). The
            # northbound API and the calls to the AMF, SMF, UDM and NRF use TLS; the NEF dials
            # them by the host names above (113084c7), which the peers' certificates carry.
            # The NEF always verifies its peers (verifyPeer is not read).
            - name: ENABLE_TLS
              value: "yes"
            - name: TLS_CERT
              value: /etc/firecell/sbi-tls/tls.crt
            - name: TLS_KEY
              value: /etc/firecell/sbi-tls/tls.key
            - name: TLS_CA
              value: /etc/firecell/sbi-tls/ca.crt
            - name: TLS_REQUIRE_CLIENT_CERT
              value: {{ ternary "yes" "no" $sbi.tls.requireClientCert | quote }}
            # The NEF's own host name in the notification URI it gives the AMF (cn5g-nef
            # 56cc868): the Service name, which its certificate carries (sbi-tls-nef).
            - name: NEF_HOSTNAME
              value: oai-nef
            {{- end }}
            {{- if $sbi.oauth2.enabled }}
            # SBI OAuth2 (global.sbi.oauth2): tokens from the NRF for the requests to the AMF,
            # SMF and UDM (OAUTH2 group of etc/nef.conf, 169bd33a).
            - name: ENABLE_OAUTH2
              value: "yes"
            {{- end }}
          ports:
            - name: sbi
              containerPort: {{ $cfg.sbiPort }}
              protocol: TCP
            - name: http2
              containerPort: {{ $cfg.sbiHttp2Port }}
              protocol: TCP
            {{- if .Values.nef.fcaps.enabled }}
            - name: mns
              containerPort: {{ .Values.nef.fcaps.mnsPort }}
              protocol: TCP
            {{- end }}
          {{- if or .Values.nef.fcaps.enabled (include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "nef")) }}
          volumeMounts:
            {{- if .Values.nef.fcaps.enabled }}
            - name: cm-state
              mountPath: {{ .Values.nef.fcaps.datastore.mountPath }}
              {{- if eq .Values.nef.fcaps.intentMode "configmap" }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- with (include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "nef")) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $nef.resources | nindent 12 }}
          # The image HEALTHCHECK script.
          readinessProbe:
            exec:
              command: ["/openair-nef/bin/healthcheck.sh"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/openair-nef/bin/healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      {{- if or .Values.nef.fcaps.enabled (include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "nef")) }}
      volumes:
        {{- if .Values.nef.fcaps.enabled }}
        - name: cm-state
          {{- if eq .Values.nef.fcaps.intentMode "configmap" }}
          # A directory, not a subPath: kubelet never refreshes a ConfigMap mounted through subPath.
          configMap:
            name: {{ .Values.nef.fcaps.intentConfigMap.name }}
            optional: {{ .Values.nef.fcaps.intentConfigMap.optional }}
          {{- else }}
          persistentVolumeClaim:
            claimName: oai-nef-cm-state
          {{- end }}
        {{- end }}
        {{- with (include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "nef")) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
