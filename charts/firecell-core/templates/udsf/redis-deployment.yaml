{{- if .Values.udsf.enabled }}
{{- $p := .Values.udsf.redis.persistence | default dict }}
{{- if and $p.appendonly (not (has ($p.volume | default "emptyDir") (list "emptyDir" "pvc"))) }}
{{- fail (printf "udsf.redis.persistence.volume must be emptyDir or pvc, got %v" $p.volume) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udsf-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: udsf-redis
    tier: udsf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udsf-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: udsf-redis
        tier: udsf
        role: active
    spec:
      containers:
        - name: redis
          image: {{ .Values.udsf.redis.imageOverride | default .Values.udsf.redis.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - redis-server
            - --dir
            - /data
            - --save
            - ""
            {{- if $p.appendonly }}
            - --appendonly
            - "yes"
            - --appendfsync
            - {{ $p.appendfsync | default "everysec" | quote }}
            {{- else }}
            - --appendonly
            - "no"
            {{- end }}
            {{- with .Values.udsf.redis.maxmemory }}
            - --maxmemory
            - {{ . | quote }}
            {{- end }}
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: {{ .Values.udsf.redis.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.udsf.redis.resources | nindent 12 }}
          {{- if $p.appendonly }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
          {{- end }}
      {{- if $p.appendonly }}
      volumes:
        - name: redis-data
          {{- if eq ($p.volume | default "emptyDir") "pvc" }}
          persistentVolumeClaim:
            claimName: udsf-redis-data
          {{- else }}
          emptyDir:
            {{- with $p.size }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- end }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
