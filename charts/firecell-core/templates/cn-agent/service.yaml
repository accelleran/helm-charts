{{- if .Values.cnAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: firecell-agent
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: firecell-agent
    tier: core-network
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: firecell-agent
{{- end }}
