{{- if .Values.cnAgent.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cn-agent-pod-reader
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cn-agent-pod-reader
subjects:
  - kind: ServiceAccount
    name: cn-agent
    namespace: {{ .Values.global.namespace }}
{{- end }}
