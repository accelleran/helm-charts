{{- if .Values.cnAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecell-agent
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: firecell-agent
    tier: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecell-agent
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: firecell-agent
        tier: core-network
        role: active
      annotations:
        {{- include "firecell-5gc.configChecksum" . | nindent 8 }}
        checksum/agent-config: {{ include (print $.Template.BasePath "/cn-agent/configmap.yaml") . | sha256sum }}
    spec:
      priorityClassName: {{ .Values.cnAgent.priorityClassName }}
      serviceAccountName: cn-agent
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
      containers:
        - name: cn-agent
          image: {{ .Values.cnAgent.imageOverride | default (include "firecell-5gc.image" (dict "registry" .Values.global.imageRegistry "image" .Values.cnAgent.image "tag" (.Values.cnAgent.imageTag | default .Values.global.pkgVersion))) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python3
            - run_cn_agent.py
            - --host
            - "0.0.0.0"
            - --port
            - "80"
          workingDir: /agent/src/cn-agent/src
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: DEPLOYMENT_TYPE
              value: "kubernetes"
            - name: KUBERNETES_NAMESPACE
              value: {{ .Values.global.namespace }}
            - name: backend_ip
              value: {{ .Values.cnAgent.backendIp }}
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: fc_packet_capture_address
              value: {{ .Values.cnAgent.packetCaptureAddress }}
            - name: FIRECELL_CN_AGENT_API_VICTORIA_METRICS_URL
              value: {{ .Values.cnAgent.apiVictoriaMetricsUrl | quote }}
            - name: REDIS_CACHE_HOST
              value: {{ .Values.cnAgent.redisCacheHost | quote }}
            - name: REDIS_CACHE_PORT
              value: {{ .Values.cnAgent.redisCachePort | quote }}
            - name: REDIS_CACHE_DB
              value: {{ .Values.cnAgent.redisCacheDb | quote }}
            - name: cn_version
              value: {{ .Values.cnAgent.dbVersion | default "5.0.1" | quote }}
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: common-config
              mountPath: /etc/config/cn_config.yaml
              subPath: basic_nrf_config_ebpf_qos.yaml
            - name: agent-config
              mountPath: /etc/config/cn_agent_config.yaml
              subPath: cn_agent_ebpf_qos_config.yaml
            - name: agent-config
              mountPath: /openair-udm/etc/a.key
              subPath: a.key
          resources:
            {{- toYaml .Values.cnAgent.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /cn_agent_health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: common-config
          configMap:
            name: firecell-common-config
        - name: agent-config
          configMap:
            name: firecell-agent-config
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
