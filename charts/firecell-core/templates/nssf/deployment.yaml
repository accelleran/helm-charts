{{- if .Values.nssf.enabled }}
{{- /* cn5g-nssf (Nnssf_NSSelection, TS 29.531). oai_nssf starts directly with the chart's
       libconfig file (oai-nssf-config), not through the image's entrypoint.py. */}}
{{- $nssf := .Values.nssf }}
{{- $cfg := $nssf.config }}
{{- $sbi := .Values.global.sbi }}
{{- $http2Only := or $sbi.tls.enabled $sbi.oauth2.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oai-nssf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-nssf
    tier: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oai-nssf
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oai-nssf
        tier: core-network
        firecell.io/role: core-nf
        role: active
    spec:
      priorityClassName: {{ $nssf.priorityClassName }}
      {{- if $cfg.nrf.register }}
      initContainers:
        {{- include "firecell-5gc.waitForNrf" . | nindent 8 }}
      {{- end }}
      {{- include "firecell-5gc.placement" (dict "root" $ "nf" $.Values.nssf "indent" 6) }}
      containers:
        - name: nssf
          image: {{ $nssf.imageOverride | default (include "firecell-5gc.nfImage" (dict "registry" .Values.global.imageRegistry "image" $nssf.image "imageTag" $nssf.imageTag "pkgVersion" .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /openair-nssf/bin/oai_nssf
            - -c
            - /openair-nssf/chart-etc/nssf.conf
            - -o
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
          ports:
            {{- if not $http2Only }}
            - name: http1
              containerPort: {{ $cfg.http1Port }}
              protocol: TCP
            {{- end }}
            - name: http2
              containerPort: {{ $cfg.http2Port }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /openair-nssf/chart-etc
              readOnly: true
            {{- with (include "firecell-5gc.sbiSecurityMounts" (dict "ctx" . "nf" "nssf")) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $nssf.resources | nindent 12 }}
          # The port the AMF dials.
          readinessProbe:
            tcpSocket:
              port: {{ include "firecell-5gc.nssfAmfPort" . }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The image HEALTHCHECK script (pgrep oai_nssf).
          livenessProbe:
            exec:
              command: ["/openair-nssf/bin/healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: oai-nssf-config
        {{- with (include "firecell-5gc.sbiSecurityVolumes" (dict "ctx" . "nf" "nssf")) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
