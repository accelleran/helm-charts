{{- if .Values.nssf.enabled }}
{{- /* cn5g-nssf reads a libconfig file (src/nssf_app/nssf_config.cpp, nssf_sbi_security_config.hpp,
       nssf_nrf_config.hpp) and the slice file it names (NSSF_SLICE_CONFIG). The chart writes
       both: the image's etc/nssf.conf template (entrypoint.py) has no TLS or OAUTH2 group. */}}
{{- $nssf := .Values.nssf }}
{{- $cfg := $nssf.config }}
{{- $sbi := .Values.global.sbi }}
{{- if and $sbi.oauth2.enabled (not $cfg.nrf.register) }}
{{- fail "global.sbi.oauth2.enabled needs nssf.config.nrf.register true: the NRF issues the AMF an access token for nnssf-nsselection only for a registered NSSF, else the AMF's NSSF requests carry no token and are refused" }}
{{- end }}
{{- $scheme := ternary "https" "http" $sbi.tls.enabled }}
{{- $nrfPort := $cfg.nrf.port | default .Values.nrf.sbiPort | default 8080 }}
{{- $nrfDisc := printf "%s://oai-nrf:%v/nnrf-disc/v1/nf-instances" $scheme $nrfPort }}
{{- $nrfNfm := printf "%s://oai-nrf:%v/nnrf-nfm/v1/nf-instances" $scheme $nrfPort }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: oai-nssf-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: oai-nssf
data:
  nssf.conf: |
    NSSF =
    {
        INSTANCE_ID       = 0;
        PID_DIRECTORY     = "/var/run";
        LOG_LEVEL         = {{ $cfg.logLevel | default .Values.coreConfig.logLevel | quote }};
        NSSF_SLICE_CONFIG = "/openair-nssf/chart-etc/nssf_slice_config.yaml";
        NSSF_NAME         = "oai-nssf";
        # The NSSF's host name in its NRF profile: the Service name, which its certificate
        # carries (sbi-tls-nssf).
        FQDN              = "oai-nssf";

        INTERFACES :
        {
            SBI :
            {
                INTERFACE_NAME = {{ $cfg.interfaceName | quote }};
                IPV4_ADDRESS   = "read";
                HTTP1_PORT     = {{ $cfg.http1Port }};
                HTTP2_PORT     = {{ $cfg.http2Port }};
                API_VERSION    = {{ $cfg.apiVersion | quote }};
            };
        };

        SUPPORTED_FEATURES :
        {
            REGISTER_NRF = {{ ternary "yes" "no" $cfg.nrf.register | quote }};
        };

        # The NRF by its Service name (FQDN, required with TLS), on the HTTP version the
        # chart's NFs speak.
        NRF :
        {
            IPV4_ADDRESS = "";
            PORT         = {{ $nrfPort }};
            API_VERSION  = "v1";
            HTTP_VERSION = {{ if $sbi.tls.enabled }}2{{ else }}{{ .Values.coreConfig.httpVersion }}{{ end }};
            FQDN         = "oai-nrf";
        };
        {{- if $sbi.tls.enabled }}

        # SBI TLS (global.sbi.tls): the NF's own Secret, mounted at /etc/firecell/sbi-tls.
        # The NSSF always verifies the NRF it calls (verifyPeer is not read).
        TLS :
        {
            ENABLE_TLS            = "yes";
            CERT_CERTIFICATE_PATH = "/etc/firecell/sbi-tls/tls.crt";
            CERT_KEY_PATH         = "/etc/firecell/sbi-tls/tls.key";
            CA_PATH               = "/etc/firecell/sbi-tls/ca.crt";
            REQUIRE_CLIENT_CERT   = {{ ternary "yes" "no" $sbi.tls.requireClientCert | quote }};
        };
        {{- end }}
        {{- if $sbi.oauth2.enabled }}

        # SBI OAuth2 (global.sbi.oauth2): the NRF's ES256 public key checks the access tokens.
        OAUTH2 :
        {
            ENABLE              = "yes";
            NRF_PUBLIC_KEY_PATH = "/etc/firecell/sbi-oauth2/public-key.pem";
        };
        {{- end }}
    };
  nssf_slice_config.yaml: |
    {{- if $cfg.sliceConfig }}
    {{- toYaml $cfg.sliceConfig | nindent 4 }}
    {{- else }}
    {{- $c := .Values.coreConfig }}
    {{- $mcc := toString $c.mcc }}
    {{- $mnc := toString $c.mnc }}
    {{- /* The AMF sends the TAC as a decimal string (std::to_string) and the NSSF compares
           strings: 0x... is hexadecimal, anything else decimal (no octal for a leading 0). */}}
    {{- $tacIn := toString $c.tac }}
    {{- $tac := "" }}
    {{- if hasPrefix "0x" (lower $tacIn) }}
    {{- $tac = int $tacIn | toString }}
    {{- else }}
    {{- $tac = regexReplaceAll "^0+([0-9])" $tacIn "${1}" | int | toString }}
    {{- end }}
    # Generated by the chart from coreConfig (nssf.config.sliceConfig empty).
    configuration:
      nsiInfoList:
      {{- range $i, $s := $c.nssai }}
        - snssai:
            sst: {{ $s.sst }}
            {{- if $s.sd }}
            sd: {{ $s.sd | quote }}
            {{- end }}
          nsiInformationList:
            nrfId: {{ $nrfDisc | quote }}
            nsiId: {{ add1 $i | toString | quote }}
            nrfNfMgtUri: {{ $nrfNfm | quote }}
      {{- end }}
      taInfoList:
        - tai:
            plmnId:
              mcc: {{ $mcc | quote }}
              mnc: {{ $mnc | quote }}
            tac: {{ $tac | quote }}
          supportedSnssaiList:
          {{- range $c.nssai }}
            - sst: {{ .sst }}
              {{- if .sd }}
              sd: {{ .sd | quote }}
              {{- end }}
          {{- end }}
      amfInfoList:
        - targetAmfSet: {{ printf "%s-%s-%s-%s" $mcc $mnc (toString $c.amf.amfRegionId) (toString $c.amf.amfSetId) | quote }}
          nrfAmfSet: {{ $nrfDisc | quote }}
          nrfAmfSetNfMgtUri: {{ $nrfNfm | quote }}
          amfList:
            # The NSSF reads nfId as a string; the AMF draws its instance ID at start.
            - nfId: "oai-amf"
              supportedNssaiAvailabilityData:
                tai:
                  plmnId:
                    mcc: {{ $mcc | quote }}
                    mnc: {{ $mnc | quote }}
                  tac: {{ $tac | quote }}
                supportedSnssaiList:
                {{- range $c.nssai }}
                  - sst: {{ .sst }}
                    {{- if .sd }}
                    sd: {{ .sd | quote }}
                    {{- end }}
                {{- end }}
    {{- end }}
{{- end }}
