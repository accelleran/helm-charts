{{- if .Values.fcAcsAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fc-acs-agent
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-5gc.labels" . | nindent 4 }}
    app: fc-acs-agent
    tier: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fc-acs-agent
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fc-acs-agent
        tier: core-network
        role: active
      annotations:
        checksum/acs-config: {{ include (print $.Template.BasePath "/fc-acs-agent/configmap.yaml") . | sha256sum }}
    spec:
      priorityClassName: {{ .Values.fcAcsAgent.priorityClassName }}
      initContainers:
        {{- include "firecell-5gc.waitForMysql" . | nindent 8 }}
      containers:
        - name: fc-acs-agent
          image: {{ .Values.fcAcsAgent.imageOverride | default (include "firecell-5gc.image" (dict "registry" .Values.global.imageRegistry "image" .Values.fcAcsAgent.image "tag" (.Values.fcAcsAgent.imageTag | default .Values.global.pkgVersion))) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: DB_HOST
              value: {{ .Values.fcAcsAgent.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.fcAcsAgent.database.port | quote }}
            - name: DB_USER
              value: {{ .Values.fcAcsAgent.database.user | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: root-password
            - name: DB_NAME
              value: {{ .Values.fcAcsAgent.database.name | quote }}
            - name: ACS_PM_UPLOAD_DIR
              value: {{ .Values.fcAcsAgent.pmUploadDir | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.fcAcsAgent.logLevel | quote }}
          ports:
            - name: acs
              containerPort: 7547
              protocol: TCP
          volumeMounts:
            - name: acs-config
              mountPath: /app/config/config.yaml
              subPath: acs_config.yaml
          resources:
            {{- toYaml .Values.fcAcsAgent.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/agent/liveness
              port: 7547
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/agent/liveness
              port: 7547
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: acs-config
          configMap:
            name: fc-acs-agent-config
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
