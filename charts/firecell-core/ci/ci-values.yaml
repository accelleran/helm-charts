# CI values for ct lint to exercise non-default conditional branches
network:
  metallb:
    enabled: false
  amfServiceType: ClusterIP

amf:
  headlessN2:
    enabled: true

upf:
  type: oai
  enableBpfDatapath: true

networkPolicies:
  enabled: true
  allowedNamespaces:
    - default
  allowedExternalCIDRs:
    - 192.168.10.0/24

hooks:
  enabled: true

# Default IMS is Kamailio. Empty mysqlHost → ClusterIP DNS in templates;
# CI sets a concrete host so wait-init env is exercised in lint/template.
ims:
  enabled: true
  engine: kamailio
  mysqlHost: "127.0.0.1"
