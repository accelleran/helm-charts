# Option 1: Colocated CU-UP on 192.168.30.11, UPF on 192.168.30.11 with Linux bridges (br-n3/br-n6) + generic XDP
# Usage:
#   helm upgrade --install firecell-5gc ./charts/firecell-core -n firecell-core \
#     -f values/values-5gc-common.yaml \
#     -f values/values-5gc-option1-bridge-generic.yaml

upf:
  xdpAttachMode: generic
  multus:
    enabled: true
    enableBpfDatapath: true
    n3:
      nadName: upf-n3-bridge
      cniType: bridge
      masterInterface: br-n3
      ip: 10.3.0.101
      subnetPrefix: 24
      arpWarmIPs:
        - "10.3.0.5"
    n6:
      nadName: upf-n6-bridge
      cniType: bridge
      masterInterface: br-n6
      ip: 10.10.0.101
      subnetPrefix: 24
