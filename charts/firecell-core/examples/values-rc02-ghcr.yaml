# The v6.0 rc-02 integration images on GHCR, one tag per NF: v6.x-rc-02-<integration/v6.x-rc-02 commit>.
# Layer it on top of your site values:
#
#   helm upgrade --install firecell-core ./charts/firecell-core -n firecell-core \
#     -f <site values> -f examples/values-rc02-ghcr.yaml
#
# The GHCR packages are private. Create the pull secret in the release namespace first:
#   kubectl -n firecell-core create secret docker-registry ghcr-regcred \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<token with read:packages>

global:
  imageRegistry: ghcr.io/accelleran
  imagePullSecrets:
    - name: ghcr-regcred

