# Dual oai-upf pool on fc-ha. Do NOT set ha.fullActiveActive here.
ha:
  hardAntiAffinity: true

upf:
  type: oai
  hostNetwork: true
  enableBpfDatapath: false
  registerNf: "no"
  sbiInterface: eno8303
  n3Interface: enp2s0f1np1
  n6Interface: eno8303
  n4Interface: enp2s0f1np1
  remoteN6Gw: "192.168.30.1"
  instances:
    - suffix: "-a"
      nodeSelector:
        kubernetes.io/hostname: fc-ha-a
      n3IP: "192.168.26.36"
      pfcpHost: "192.168.26.36"
      hostPfcpIP: "192.168.26.36"
      poolState: ACTIVE
    - suffix: "-b"
      nodeSelector:
        kubernetes.io/hostname: fc-ha-b
      n3IP: "192.168.26.32"
      pfcpHost: "192.168.26.32"
      hostPfcpIP: "192.168.26.32"
      poolState: ACTIVE
