  command:
    - /openair-nrf/bin/oai_nrf
    - -c
    - /openair-nrf/etc/config.yaml
    - -o
  configMountPath: /openair-nrf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the NRF NE in the NMS. A
      # mismatch mounts EMPTY and the NRF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-nrf-cm-intent
      optional: true
    seedConfigPath: /openair-nrf/etc/config.yaml

# --- UDR (Unified Data Repository) ---
udr:
  enabled: true
  image: oai-udr
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  priorityClassName: firecell-prio-crit
  command:
    - /openair-udr/bin/oai_udr
    - -c
    - /openair-udr/etc/config.yaml
    - -o
  configMountPath: /openair-udr/etc/config.yaml
  waitForMysql: true
  # Process binds SBI on 8080 only. Do not advertise containerPort 80 — nothing
  # listens there (see templates/udr/service.yaml: Service port 80 maps to 8080).
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  fcaps:
    enabled: false
    mnsPort: 9091
    # Same two modes as the AMF and SMF; see amf.fcaps.intentMode for the cost
    # of each. The UDR was written against 1.0.7 from the start, so `pvc` is
    # here for symmetry rather than as a supported deployment.
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UDR NE in the NMS. A
      # mismatch mounts EMPTY and the UDR reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-udr-cm-intent
      optional: true
    seedConfigPath: /openair-udr/etc/config.yaml

