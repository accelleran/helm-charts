# --- EIR (5G Equipment Identity Register, cn5g-eir) ---
# Off by default: the cn5g-eir image is not published yet. The AMF finds the EIR through
# the NRF (the EIR registers itself) and checks the PEI at registration: see
# coreConfig.amf.eir. Config keys follow cn5g-eir configs/eir.yaml. The EIR creates its
# two tables (equipment_bindings, audit_events) in the chart's MySQL database at start, so
# there is no SQL to load. MySQL host, user, password and database come from
# coreConfig.database.
eir:
  enabled: false
  image: cn5g-eir
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-normal
  command:
    - /usr/local/bin/cn5g-eir
    - --config
    - /etc/cn5g-eir/eir.yaml
  configMountPath: /etc/cn5g-eir/eir.yaml
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m
  # FCAPS MnS (TS 28.532) of the EIR on mnsPort, from the cn5g-eir FCAPS build (WITH_FCAPS):
  # identity, heartbeat, alarms, PM and CM. Off by default. The image must be an FCAPS build.
  # intentMode, datastore and intentConfigMap work as for ausf.fcaps.
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      name: oai-eir-cm-intent
      optional: true
  config:
    listenHost: "0.0.0.0"
    # SBI port: HTTP/2 only. healthHttp1Port: HTTP/1.1 /health for the readiness probe;
    # 0 disables it (the probe then checks the SBI port).
    listenPort: 8080
    healthHttp1Port: 8081
    # Empty: coreConfig.database.name.
    mysqlDatabase: ""
    # Lab profile. FIXME(spec, TS 29.511 6.1.7.3 / TS 29.500 6.7.3): the AMF sends no
    # OAuth2 access token until feature 05 is on, so the equipment-status check is let in
    # without one (allowAnonymous). The two tokens are lab placeholders for the client
    # lists; replace them in site values. authProfile commercial (the render fails otherwise,
    # as the EIR would at start): allowAnonymous false, healthHttp1Port 0, global.sbi.tls and
    # global.sbi.oauth2 on, and a provToken of at least 32 characters (the EIR ignores shorter).
    authProfile: lab
    allowAnonymous: true
    checkToken: "lab-amf-token"
    provToken: "lab-nms-prov-token"
    # NFRegister at the NRF. Empty nrfNfmUrl: http://oai-nrf:<nrf.sbiPort>/nnrf-nfm/v1.
    # Empty advertiseApiRoot: http://oai-eir.<namespace>.svc.cluster.local:<listenPort>.
    nrfEnabled: true
    nrfRequired: true
    nrfNfmUrl: ""
    advertiseApiRoot: ""
    # Local policy (L3-06-5, not a TS 29.511 rule): a PEI bound to another SUPI/GPSI
    # answers BLACKLISTED (SIM lock). Seed of the FCAPS switch peiSupiBindingCheckEnabled.
    peiSupiBindingCheck: true

# --- NEF (Network Exposure Function, cn5g-nef) ---
# Off by default: the cn5g-nef image is not published yet. Monitoring events (TS 29.122
# 4.4.2) through the AMF's Namf_EventExposure. The image renders etc/nef.conf from the
# environment at start, so config holds the placeholders of that file (see cn5g-nef README,
# "Environment Variables"). Only the AMF is used for the monitoring events; the SMF and UDM
# entries are read by the NEF but not used by this feature.
nef:
  enabled: false
  image: cn5g-nef
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-normal
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1000m
  # FCAPS MnS (TS 28.532) of the NEF on mnsPort, from the cn5g-nef FCAPS build (WITH_FCAPS):
  # identity, heartbeat, alarms, PM and CM. Off by default. The image must be an FCAPS build.
  # intentMode, datastore and intentConfigMap work as for ausf.fcaps.
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      name: oai-nef-cm-intent
      optional: true
  config:
    # Monitoring Event exposure (TS 29.122 5.3, cn5g-nef SUPPORT_FEATURES.MONITORING_EVENT_ENABLED, env
    # MONITORING_EVENT_ENABLED; NEF default yes), seed of the FCAPS switch monitoringEventEnabled.
    # false: a new subscription is refused with 403; existing ones stay.
    monitoringEventEnabled: true
    interfaceName: eth0
    # The NEF's own HTTP/1.1 and HTTP/2 ports (image defaults 80 and 8080).
    sbiPort: 80
    sbiHttp2Port: 8080
    # yes: the NEF calls its peers over HTTP/2 (USE_HTTP2). This chart's NFs speak HTTP/1.1.
    useHttp2: false
    # Peers, by Service name; the NEF resolves them when it starts. Port is the HTTP/1.1
    # port, as the other NFs of this chart use it (8080 with coreConfig.httpVersion 1).
    # With global.sbi.tls the NEF calls port over TLS and HTTP/2 (ALPN) whatever useHttp2 says,
    # and checks the peer certificate against hostname: keep the Service names.
    peers:
      amf: {hostname: oai-amf, port: 8080, http2Port: 8080}
      smf: {hostname: oai-smf, port: 8080, http2Port: 8080}
      udm: {hostname: oai-udm, port: 8080, http2Port: 8080}
    # Optional NRF use (cn5g-nef L1-12-5): register the NEF, and find the AMF through the NRF
    # (else the AMF above). Both off by default; the NRF is passed to the NEF only when one is on.
    nrf:
      hostname: oai-nrf
      port: 8080
      register: false
      discoverAmf: false

# --- AMF (Access and Mobility Management Function) ---
amf:
  enabled: true
  image: cn5g-amf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  # Kubernetes Service type for oai-amf (NGAP must be reachable off-cluster).
  # Empty falls back to network.amfServiceType ("LoadBalancer" by default).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config.
  serviceType: ""
  # Optional in-chart headless SCTP Service (oai-amf-n2) for pod-networked RANs
  headlessN2:
    enabled: false
    serviceName: oai-amf-n2
    publishNotReadyAddresses: true
  priorityClassName: firecell-prio-crit
  command:
    - /openair-amf/bin/oai_amf
    - -c
    - /openair-amf/etc/config.yaml
    - -o
  configMountPath: /openair-amf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: ngap
      containerPort: 38412
      protocol: SCTP
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m
  # --- FCAPS Configuration Management (CM PoC) ---
  # Off by default: the stock image has no FCAPS and would expose a dead port.
  fcaps:
    enabled: false
    mnsPort: 9091
    # Where the NF's intent document comes from.
    #
    #   pvc        the NF owns a writable file (contract 1.0.6). Intent is
    #              per-pod and dies with it: lost on restart if the volume
    #              goes, and divergent the moment there is more than one
    #              replica, since only the active pod is ever PATCHed.
    #   configmap  the NMS owns the document and the NF mounts it read-only
    #              (contract 1.0.7). Durable in etcd, identical for every
    #              replica, and visible to GitOps.
    intentMode: configmap
    datastore:
      mountPath: /openair-amf/state
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Written by the NMS on every apply. Named for the NE, not the
      # deployment, because intent belongs to the network element.
      name: oai-amf-cm-intent
      # The pod must start before the NMS has ever applied anything, so a
      # missing ConfigMap is an empty mount rather than ContainerCreating
      # forever. The NF then boots on the seed alone, which is correct: no
      # intent has been expressed yet.
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet. Empty disables the digest.
    seedConfigPath: /openair-amf/etc/config.yaml

# --- SMF (Session Management Function) ---
smf:
  enabled: true
  image: cn5g-smf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-high
  command:
    - /openair-smf/bin/oai_smf
    - -c
    - /openair-smf/etc/config.yaml
    - -o
  configMountPath: /openair-smf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: n4
      containerPort: 8805
      protocol: UDP
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m
  # Multus secondary NIC for PFCP N4 — gives SMF a stable IP on the CP network
  # so UPFs (in-cluster and external) always see a consistent PFCP peer identity.
  # Requires Multus CNI on the cluster (disabled by default).
  multus:
    enabled: false
    cniType: ipvlan        # ipvlan (recommended for single-NIC) or macvlan
    mode: l3s              # L3S: host (hostNetwork UPF) can reach slave; ARP passthrough for external UPFs
    masterInterface: eth0  # parent NIC on CP network
    nadName: smf-n4-net    # NetworkAttachmentDefinition name
    subnetPrefix: 24       # prefix length for the secondary NIC address
  # PFCP N4 interface inside the SMF pod.
  # Set to "net1" when Multus is enabled (Multus names secondary NICs net1, net2, ...).
  n4Interface: eth0
  # Time before Deployment marks ProgressDeadlineExceeded (image pull + Multus + NRF wait).
  progressDeadlineSeconds: 1200
  # Explicit PFCP bind IP — must match the Multus secondary NIC IP when Multus is enabled.
  # When set: UPF connects to this IP directly (no ClusterIP SNAT = no PFCP split-peer).
  # When empty: UPF uses ClusterIP DNS (subject to SNAT — known PFCP instability).
  n4IP: ""
  # Host PFCP (optional): same pattern as OAI UPF — hostNetwork pod, SBI on cni0, N4 on
  # hostPfcpMacvlan @ hostPfcpIP/n4IP. Disables Multus. Use when UPF uses hostNetwork on
  # the same CP parent (eno1); see environments/values-smf-pfcp-hostnet.yaml.
  hostNetwork: false
  sbiInterface: cni0
  # MnS/FCAPS (:9091) bind interface. Empty => falls back to sbiInterface. Set per-instance
  # (e.g. the PFCP macvlan) so N hostNetwork UPFs on one host don't collide on the shared SBI IP.
  # Requires a FCAPS image that reads nfs.<nf>.mns.interface_name.
  mnsInterface: ""
  # k3s cni0 bridge IP where hostNetwork SMF listens for SBI (Service Endpoints when hostNetwork).
  sbiClusterIP: "10.42.0.1"
  hostPfcpMacvlan: smf-n4-mac
  hostPfcpIP: ""
  pfcpParentInterface: ""
  fcaps:
    enabled: false
    mnsPort: 9091
    # Where the NF's intent document comes from. Same two modes as the AMF —
    # see amf.fcaps.intentMode for what each one costs.
    #
    # The SMF has no reason to run `pvc`: the AMF kept it for the 1.0.6 contract
    # it shipped with, and the SMF's CM path was written against 1.0.7 from the
    # start. `pvc` is here so the two NFs are configured the same way, not
    # because it is a supported deployment.
    intentMode: configmap
    datastore:
      # /var/lib/firecell/cm is the fcaps-common default, so the NF finds its
      # intent with no FCAPS_CM_DATASTORE at all. The AMF's /openair-amf/state
      # predates that default and is kept for its existing volumes.
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Written by the NMS on every apply, and named from
      # nf_instance.instance_name. If this name and the NMS's disagree the mount
      # is EMPTY and the NF silently reverts to its seed — `optional: true`
      # cannot tell a missing ConfigMap from a misnamed one.
      name: oai-smf-cm-intent
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet. Empty disables the digest.
    seedConfigPath: /openair-smf/etc/config.yaml

# --- PCF (Policy Control Function) ---
pcf:
  enabled: true
  image: cn5g-pcf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-normal
  command:
    - /openair-pcf/bin/oai_pcf
    - -c
    - /openair-pcf/etc/config.yaml
    - -o
  configMountPath: /openair-pcf/etc/config.yaml
  waitForMysql: true
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  fcaps:
    enabled: false
    mnsPort: 9091
    # Same two modes as the AMF and SMF; see amf.fcaps.intentMode for the cost
    # of each. The PCF was written against 1.0.7 from the start, so `pvc` is
    # here for symmetry rather than as a supported deployment.
    intentMode: configmap
    datastore:
      # The fcaps-common default, so the NF finds cm.json with no environment
      # variable at all.
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the PCF NE in the NMS. A
      # mismatch mounts EMPTY and the PCF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-pcf-cm-intent
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet, which on the PCF is most of them.
    seedConfigPath: /openair-pcf/etc/config.yaml

# --- UPF (User Plane Function) ---
upf:
  enabled: true
  oaiImage: cn5g-upf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  oaiImageTag: ""
  # Full reference for the OAI UPF, winning over registry + oaiImage + oaiImageTag.
  oaiImageOverride: ""
  # Kubernetes Service type for the GTP-U Service(s).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config.
  serviceType: LoadBalancer
  hostNetwork: true
  privileged: true
  # Multus secondary NICs when hostNetwork=false: eth0 (pod/CNI) stays SBI+N4;
  # Multus attaches net1 (N3) then net2 (N6). Requires Multus CNI + macvlan/ipvlan.
  # XDP_REDIRECT between Multus macvlan net1/net2 in the pod netns drops UL —
  # multus.enableBpfDatapath defaults false (simpleswitch). Same-host gNB on a
  # host macvlan needs a /32 to UPF N3 via that macvlan (parent cannot reach children).
  multus:
    enabled: false
    # Opt-in XDP for Multus only (ignored when hostNetwork=true). Default false.
    # Set true when using cniType: host-device (Option 2, xdpAttachMode: native)
    # or cniType: bridge on both N3 and N6 (Option 1, xdpAttachMode: generic).
    enableBpfDatapath: false
    # RPS CPU mask, quoted hex as in /sys/class/net/*/queues/rx-*/rps_cpus, written to
    # every rx queue of the N3/N6 interfaces at pod start. With generic XDP (Option 1)
    # the whole N6 -> bridge -> XDP -> veth path runs in softirq on the core that took
    # the NIC interrupt; RPS spreads it per flow. Applied to bridge (veth) and
    # host-device interfaces only: a macvlan/ipvlan receives in the parent NIC's
    # softirq, so pin that NIC's IRQs on the host instead. Use the cores the host pins
    # its NIC IRQs to, e.g. "3c003c" = CPUs 2-5,18-21. Empty leaves RPS off.
    rpsCpus: ""
    n3:
      nadName: upf-n3-net
      # Supported cniType values:
      #   - "host-device": moves physical NIC (masterInterface/device) into UPF pod netns (Option 2, native XDP)
      #   - "bridge":      attaches veth to host Linux bridge (masterInterface/bridge) (Option 1, generic XDP)
      #   - "macvlan" / "ipvlan": attaches sub-interface on masterInterface
      cniType: macvlan
      mode: bridge
      masterInterface: ""       # site: physical NIC (host-device/macvlan) or bridge name (bridge CNI)
      ip: ""                    # e.g. 10.3.0.101
      subnetPrefix: 24
      # Optional list of N3 peer IPs (e.g. ["10.3.0.4", "10.3.0.5"]) to ping from net1 in multus-datapath-init
      arpWarmIPs: []
    n6:
      nadName: upf-n6-net
      cniType: macvlan
      mode: bridge
      masterInterface: ""       # site: physical NIC (host-device/macvlan) or bridge name (bridge CNI)
      ip: ""                    # e.g. 10.10.0.101
      subnetPrefix: 24
  # CP/UP interface separation
  # n3IP: explicit GTP-U bind/advertise IP (set to network.upfExternalIP for MetalLB UP VIP)
  n3IP: "198.51.100.101"        # Must match network.upfExternalIP
  n3Interface: "eth1"            # UP NIC — used when n3IP is empty; Multus → net1
  n4Interface: "eth0"            # CP NIC — parent for pfcp-macvlan-init; PFCP toward SMF
  # OAI hostNetwork only: SBI/NRF HTTP bind (e.g. k3s cni0 — must reach ClusterIP/pod CIDR)
  sbiInterface: ""
  # OAI hostNetwork: N6 data-plane NIC (do not set to cni0; use physical uplink/DN)
  # Multus non-hostNetwork: set to net2
  n6Interface: ""
  # OAI hostNetwork: optional N6 IP/CIDR on n6Interface (required for datapath-init in single-instance mode).
  n6Cidr: ""
  # N6 default gateway toward DN (set in site overlay, e.g. values-dataplane-*.yaml / host_vars). Required when n6Cidr is set.
  remoteN6Gw: ""
  # IPv6 user plane (P23), hostNetwork or Multus UPF, used when the UPF serves an IPv6 DNN
  # (coreConfig.dnns). The n6-ipv6-init container then sets net.ipv6.conf.all.forwarding=1,
  # puts n6Ipv6Cidr on the N6 interface, and routes the DNN IPv6 pools (source rule, no
  # NAT66) to a per-UPF table whose default route is remoteN6GwIpv6.
  # - hostNetwork: all in the node's namespace, so forwarding is node-wide (interfaces with
  #   accept_ra=1 stop accepting RAs). Per instance: upf.instances[].n6Ipv6Cidr /
  #   remoteN6GwIpv6.
  # - Multus: in the pod's own namespace; n6Ipv6Cidr is added to the n6 NetworkAttachment
  #   (static IPAM, next to multus.n6.ip).
  # The DN router must route each UE IPv6 pool to n6Ipv6Cidr's address (no NAT66).
  n6Ipv6Cidr: ""                 # e.g. 2001:db8:6::2/64
  remoteN6GwIpv6: ""             # e.g. 2001:db8:6::1
  # datapath-init: block UPF start until remoteN6Gw ARP succeeds — avoids empty BPF m_arp_table.
  datapathInit:
    n6GatewayArpRetries: 60
    n6GatewayArpIntervalSec: 5
    # n6-ipv6-init (IPv6 user plane): tries for the remoteN6GwIpv6 neighbour, same interval.
    # Not fatal: the UPF starts with a WARNING when the neighbour is still missing.
    n6GatewayNdRetries: 12
  # When true, n3-ip-init automatically creates n3Interface (e.g. upf-n3) as a
  # bridge-mode macvlan on n4Interface and adds an on-link route to remoteN6Gw.
  autoCreateN3Macvlan: false
  # When true and cilium_host exists on the node, datapath-init injects the
  # cilium_host pod-CIDR route into the UPF policy routing table so traffic from
  # the N3/N6 VIP reaches in-cluster pods (gNB, ext-dn) without external Ansible tasks.
  injectCiliumPodRoute: true
  # OAI: optional N9; defaults to n3Interface in generated YAML
  n9Interface: ""
  # OAI UPF hostNetwork: yes = XDP/eBPF; no = simpleswitch. Multus uses multus.enableBpfDatapath.
  enableBpfDatapath: true
  # Hostnet config.yaml schema: mr97 (develop @ 486acc3+) or legacy (cn5g-upf v5.1.0.x).
  configSchema: mr97
  # Runtime XDP attach (cn5g-upf UPF_XDP_ATTACH_MODE): auto | native | generic
  xdpAttachMode: auto
  # cn5g-upf support_features.delete_sessions_on_smf_restart. Empty: not written, the UPF
  # default (yes): when an SMF Heartbeat carries a larger Recovery Time Stamp (the SMF
  # restarted), the UPF deletes that SMF's PFCP sessions (TS 23.527 4.4.2.1). Set "no" while
  # an SMF older than v6.0 rc-02 P20 (a new Recovery Time Stamp in every Heartbeat) talks to
  # this UPF, e.g. during a mixed-version upgrade or an SMF rollback.
  deleteSessionsOnSmfRestart: ""
  # OAI UPF only: Layer-2 Ethernet PDU sessions (cn5g-upf support_features.enable_eth_pdu).
  # Default no — set true only when SMF/UE use Ethernet PDU; does not remove XDP "ETH PDU"
  # fallback trace strings (see cn5g-upf UserPlaneComponent / pfcp_session_lookup_xdp_kernel).
  oaiEnableEthPdu: false
  # Ethernet PDU downlink flooding (cn5g-upf support_features.eth_dl_broadcast_enabled and
  # eth_dl_flood_max_copies; seeds of the FCAPS switches ethDlBroadcastEnabled and
  # ethDlFloodMaxCopies). Written only with oaiEnableEthPdu. A DL frame from N6 to a broadcast,
  # multicast or not-yet-learnt MAC is copied to every Ethernet PDU session that has a DL tunnel
  # (TS 23.501 5.8.2.5.3), at most ethDlFloodMaxCopies copies (1..50; the UPF refuses other
  # values at start). ethDlBroadcastEnabled false: such frames are dropped, not flooded.
  ethDlBroadcastEnabled: true
  ethDlFloodMaxCopies: 50
  # OAI UPF: framed routing (cn5g-upf support_features.enable_fr). When true the UPF
  # matches downlink traffic to the Framed-Route prefixes the SMF signals for a PDU
  # session (TS 29.244 Framed-Route IE). Default off.
  enableFramedRouting: false
  # Optional overrides for hostnet ConfigMap (see docs/developer/oai-upf-ebpf-hostnet.md)
  oaiHostNet:
    stubInterface: ""            # Else sbiInterface, else eno8303
    smfN4Interface: ""         # Else hostPfcpMacvlan, else n4Interface
  hostPfcpMacvlan: ""            # If set, create a host macvlan bridge slave on n4Interface for PFCP
  hostPfcpIP: ""                 # IP to assign to hostPfcpMacvlan (must be free on the CP subnet)
  pfcpHost: ""                   # Override UPF PFCP host for SMF config (use macvlan IP when hostPfcpMacvlan is set)
  dnsServers:
    - 10.152.183.10
  dnsSearchDomains:
    - firecell-core.svc.cluster.local
    - svc.cluster.local
    - cluster.local
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  fcaps:
    enabled: false
    mnsPort: 9091
    # Same two modes as the AMF and SMF; see amf.fcaps.intentMode for the cost
    # of each. The UPF was written against 1.0.7 from the start, so `pvc` is
    # here for symmetry rather than as a supported deployment.
    intentMode: configmap
    datastore:
      # The fcaps-common default, so the NF finds cm.json with no environment
      # variable at all.
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UPF NE in the NMS. A
      # mismatch mounts EMPTY and the UPF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one. First slice is one NE (`upf-1` / `oai-upf`); extra
      # hostNetwork instances need their own NE and ConfigMap.
      name: oai-upf-cm-intent
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet.
    seedConfigPath: /openair-upf/etc/config.yaml
    # PM push period (FCAPS_MEAS_PERIOD_SEC): how often the UPF sends
    # notifyMeasurementReport with the N3 GTP octet counters the NMS Dashboard
    # turns into CN throughput. The UPF default is 60 s, which makes that
    # figure a 60 s average that trails traffic by up to ~2 min.
    measPeriodSec: 5
    # Alarm dispatch interval (FCAPS_NOTIFY_INTERVAL_SEC). UPF default 30 s.
    notifyIntervalSec: 5

  # Multi-UPF instance list. When non-empty, replaces legacy single-UPF config.
  # Each entry produces one independent Deployment + Service (type: upf.serviceType).
  # Leave empty for single-UPF operation (backward compatible).
  instances: []
  # instances:
  #   - suffix: ""           # Deployment name suffix: "oai-upf" when empty
  #     n3IP: "10.x.x.x"    # MetalLB VIP for GTP-U (must be in up.poolRange)
  #     n3Interface: eno1
  #     n6Interface: eno1
  #     n4Interface: eno1
  #     inSmfPool: true                   # include this UPF in SMF upf_pool/upfs
  #     poolState: ACTIVE                 # ACTIVE|DRAINING (rendered to SMF config)
  #     dnns: ["oai"]                     # per-UPF DNN steering (e.g. oai/oai2)
  #     hostPfcpMacvlan: "smf-pfcp-mac"   # unique per instance
  #     hostPfcpIP: "10.x.x.y"            # PFCP source IP (not in any MetalLB pool)
  #     pfcpHost: "10.x.x.y"

# --- IMS (Kamailio + Cx-on-UDR default; Asterisk via examples/values-ims-asterisk.yaml) ---
ims:
  enabled: true
  # kamailio (default) | asterisk — Asterisk-only: examples/values-ims-asterisk.yaml
  engine: kamailio
  image: kamailio-ims
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  imageTag: latest
  priorityClassName: firecell-prio-support
  registrationExpires: "3600"
  # Empty → templates default to mysql.<namespace>.svc.cluster.local (works for
  # hostNetwork CSCF/Cx when cluster DNS + ClusterIP reachability exist). Override
  # only if MySQL is external / on a host IP.
  mysqlHost: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 2000m
  # Asterisk-only (ignored when engine=kamailio)
  sipConf: |
    [general]
    language=en
    tcpenable=yes
    tcpbindaddr=0.0.0.0
    tcpbindport=5060
    srvlookup=yes
  # Leave empty. After the IMS sidecar is in the pod it is the only runtime
  # writer of users.conf (emptyDir). A non-empty ConfigMap seed would still be
  # wiped on restart; the sidecar's bootId is how the NMS re-asserts the list.
  # Filling this in would reintroduce a second writer.
  usersConf: ""
  sidecar:
    # Asterisk engine only. OFF by default until the image is published to
    # imageRegistry. The composed default resolves to
    # ghcr.io/accelleran/.../nms-ims-sidecar:latest, which does not exist: the
    # image is built locally and imported into the node. A default-on sidecar
    # whose image cannot be pulled leaves the whole pod NotReady, and the
    # Service then drops the endpoint - turning a working Asterisk into an
    # unreachable one. Enable it explicitly, with imageOverride:
    #   --set ims.sidecar.enabled=true \
    #   --set ims.sidecar.imageOverride=nms-ims-sidecar:<tag>
    enabled: false
    image: nms-ims-sidecar
    imageOverride: ""
    imageTag: latest
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
  # MySQL accounts of the IMS (Kamailio CSCFs and Cx gateway; cn5g-ims rc-02
  # images, which create and re-password their accounts on every start).
  credentials:
    # Name of an existing Secret with keys cx-db-password and
    # kamailio-db-password. Empty: the chart creates ims-db-credentials.
    existingSecret: ""
    # Empty: 32 random alphanumerics, generated once and kept on upgrade.
    # The Kamailio password must match [A-Za-z0-9._~-]{1,64}.
    cxDbPassword: ""
    kamailioDbPassword: ""
  # Host part of the pyhss/pcscf/icscf/scscf MySQL accounts: the client address
  # MySQL sees (with hostNetwork CSCFs usually the node IP; check
  # information_schema.processlist). Empty keeps the images' default '%' (any
  # host). Accounts left with another host part are not dropped by the images
  # (they log a WARN with the DROP USER to run); see cxGateway.dropWildcardAccount.
  dbAccountHost: ""
  # Refuse legacy default passwords and an empty Cx peer allow-list
  # (CX_STRICT_SECURITY / FIRECELL_STRICT_SECRETS). Off: warnings only.
  # Switch on last, once credentials, dbAccountHost and allowedPeers are set.
  strictSecrets: false
  # Kamailio CSCFs — hostNetwork IPs must exist on the node before Ready.
  ueImsSubnet: "14.1.1.0/25"
  upfN6Gateway: ""
  rtpengine:
    enabled: false
    ip: "127.0.0.1"
  # Rx to N5 interworking function of the P-CSCF (cn5g-ims rx-n5-iwf; Diameter Rx,
  # TS 29.214, to Npcf_PolicyAuthorization, TS 29.514). Off by default. A normal pod
  # behind the ClusterIP Service ims-rx-n5-iwf: the P-CSCF connects to it on diameterPort,
  # the PCF posts its notify / terminate to notifyPort. The P-CSCF side (its Rx peer
  # pcrf.<EPC_DOMAIN>) is configured in the kamailio-ims image. mcc and mnc are the
  # P-CSCF's (coreConfig); set epcDomain only if the P-CSCF's EPC_DOMAIN is set.
  rxN5Iwf:
    enabled: false
    image: rx-n5-iwf
    imageOverride: ""
    imageTag: latest
    # Diameter realm of the Rx link (EPC_DOMAIN), given to the IWF and to the P-CSCFs. Empty: each
    # derives epc.mnc<MNC>.mcc<MCC>.3gppnetwork.org from coreConfig.mcc / mnc, the same value.
    epcDomain: ""
    # Diameter identity of the IWF (RX_N5_IWF_ORIGIN_HOST) and the name the P-CSCF connects to
    # (RX_PEER_HOST). Empty: the Service name ims-rx-n5-iwf, which resolves in the namespace.
    originHost: ""
    # Diameter identities (Origin-Host) whose CER the IWF accepts, comma-separated; "*" = any
    # (RX_N5_IWF_ALLOWED_PEERS, cn5g-ims L8-R-5). Empty: the IWF default, pcscf.<IMS domain> and
    # pcscf-alternative.<IMS domain>, the identities of the P-CSCF and of the alternative P-CSCF
    # (cn5g-ims L8-P-4; the IWF gets the CSCFs' IMS_DOMAIN). A list set here must name the
    # alternative one when ims.pcscf.alternative.enabled (the render fails otherwise).
    allowedPeers: ""
    # With the IWF on, the P-CSCF gets RX_ENABLED=true (Rx at INVITE / re-INVITE). true also
    # sets RX_REG_ENABLED (an AAR at REGISTER): not needed for voice QoS.
    rxRegEnabled: false
    logLevel: INFO
    diameterPort: 3868
    notifyPort: 8080
    # Empty: http://oai-pcf.<namespace>.svc.cluster.local:8080 (how the other NFs reach the PCF);
    # with global.sbi.tls.enabled https://oai-pcf:8080 (the name in the PCF certificate). A set
    # value must use the scheme that follows global.sbi.tls.enabled.
    pcfUri: ""
    # Empty: coreConfig.httpVersion (1 in this chart). 1 or 2. Always 2 with global.sbi.tls.enabled.
    pcfHttpVersion: ""
    # Registration at the NRF as an AF (cn5g-ims L8-P-2b): needed for the OAuth2 access tokens
    # (global.sbi.oauth2.enabled; the render fails with OAuth2 on and register false). uri empty:
    # <scheme>://oai-nrf:<nrf.sbiPort>. nfInstanceId empty: a UUID derived from the namespace,
    # the same at every start (the IWF draws a random one without it).
    nrf:
      register: false
      uri: ""
      nfInstanceId: ""
    pcfTimeoutS: 5
    # Empty: http://ims-rx-n5-iwf.<namespace>.svc.cluster.local:<notifyPort>. It must be
    # an address the PCF can reach.
    notifyUri: ""
    # The Rx session map on disk (cn5g-ims L8-P-3, RX_N5_IWF_STATE_FILE /var/lib/rx-n5-iwf/sessions.db):
    # after an IWF restart the calls in progress still get their N5 Delete / Update and RAR / ASR.
    # volume: emptyDir (default) survives a container restart, not a replaced pod; pvc survives
    # both (claim ims-rx-n5-iwf-state, size, storageClassName); none keeps the map in memory, as
    # the IWF does without the variable. maxAgeS (60..2592000): entries not written for that long
    # are dropped when the IWF starts.
    state:
      volume: emptyDir
      maxAgeS: 86400
      size: 64Mi
      storageClassName: local-path
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m
  pcscf:
    ip: "192.168.31.205"
    hostNetwork: true
    privileged: true
    bindPort: 5060
    ipsecClientPort: 5100
    ipsecServerPort: 6100
    # The alternative P-CSCF of P-CSCF restoration (TS 23.380 5.8.5.2; cn5g-ims L4-A9-5). Off by
    # default: no second P-CSCF is rendered and the S-CSCF retries nothing. On: a second P-CSCF
    # Deployment ims-pcscf-alt at ip (required; like the first, a hostNetwork address that must
    # exist on the node), and the S-CSCF gets ALTERNATIVE_PCSCF=<ip>:<bindPort>. It asks the PCF
    # for the restoration at pcfUri over pcfHttpVersion; the PCF side is
    # coreConfig.pcf.policyAuthorization.pcscfRestoration and the SMF acts on it. Ports empty:
    # those of the first P-CSCF. Empty pcfUri: http://oai-pcf.<namespace>.svc.cluster.local:8080;
    # empty pcfHttpVersion: coreConfig.httpVersion (1 or 2).
    alternative:
      enabled: false
      ip: ""
      bindPort: ""
      ipsecClientPort: ""
      ipsecServerPort: ""
      pcfUri: ""
      pcfHttpVersion: ""
  icscf:
    ip: "192.168.31.206"
    hostNetwork: true
    bindPort: 4060
  scscf:
    ip: "192.168.31.207"
    hostNetwork: true
    bindPort: 6060
    # Seconds a P-CSCF that did not answer a terminating request stays non-reachable, without a
    # sign of life, before the S-CSCF tries it again (TS 23.380 5.4.2.2.1; cn5g-ims L8-P-1,
    # PCSCF_DOWN_SECONDS, 1..86400). Empty: the S-CSCF default, 60.
    pcscfDownSeconds: ""
  cxGateway:
    enabled: true
    ip: "192.168.31.208"
    hostNetwork: true
    port: 3868
    image: ims-cx-gateway
    imageOverride: ""
    imageTag: latest
    # udr = oai_db SoT (Cx-on-UDR); legacy = pyHSS DB + seed
    cxSot: udr
    # split: an init container with CX_MODE=provision (MySQL root password:
    # databases, account, grants, self-check) then CX_MODE=serve without root.
    # all: one container does both (root password stays in the serving pod).
    # Both need a cn5g-ims rc-02 gateway image; older images ignore CX_MODE.
    mode: split
    # CX_DIAMETER_ALLOWED_PEERS: IPs/CIDRs of the I-CSCF and S-CSCF as the
    # gateway sees them (comma separated). Empty: every host that reaches
    # ip:port (the gateway logs a WARN; strictSecrets refuses it).
    allowedPeers: ""
    # Drop a leftover 'pyhss'@'%' account at provisioning. Set it once, in the
    # same upgrade that first sets a restricted ims.dbAccountHost.
    dropWildcardAccount: false
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# --- External Data Network ---
# Off by default; lab/examples enable it when a traffic generator is needed.
extDn:
  enabled: false
  image: trf-gen-cn5g
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  imageTag: latest
  priorityClassName: firecell-prio-support
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  # Second interface (net1) on the UPF's N6 bridge, for a Multus UPF with
  # upf.multus.n6.cniType: bridge only. The extdn-probe sidecar needs it to
  # ping a UE: it routes the UE address via upf.multus.n6.ip on net1 and the
  # echo enters the UPF like any other downlink packet. Without net1 the echo
  # leaves through Cilium, which masquerades it, and no UE ever answers.
  #
  # Not for host-device (the N6 NIC belongs to the UPF pod), macvlan (a sibling
  # on the same parent bypasses generic XDP) or a hostNetwork UPF: rendering
  # fails.
  n6:
    # Free address in the UPF's N6 subnet (upf.multus.n6.ip/subnetPrefix),
    # e.g. 10.10.0.102. Empty: no N6 interface.
    ip: ""
    nadName: ext-dn-n6
  sidecar:
    # OFF by default until the image is published to imageRegistry. The
    # composed default below resolves to
    # ghcr.io/accelleran/.../nms-extdn-probe-sidecar:latest, which does not exist: the
    # image is built locally and imported into the node. A default-on sidecar
    # whose image cannot be pulled leaves the whole pod NotReady, and the
    # Service then drops the endpoint - turning a working ext-dn into an
    # unreachable one. Enable it explicitly, with imageOverride:
    #   --set extDn.sidecar.enabled=true \
    #   --set extDn.sidecar.imageOverride=nms-extdn-probe-sidecar:<tag>
    enabled: false
    image: nms-extdn-probe-sidecar
    imageOverride: ""
    imageTag: latest
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

# --- FC ACS Agent (TR-069 ACS endpoint) ---
# Off by default (CloudRAN / ACS installs enable it explicitly).
fcAcsAgent:
  enabled: false
  image: fc-acs-agent
  # Full image reference, winning over the registry + image + tag composition.
  # Every NF already has this; the agents did not, so an agent published
  # anywhere but imageRegistry could not be named at all.
  imageOverride: ""
  imageTag: "5.0.1.0"   # NMS release line, independent of global.pkgVersion
  # Kubernetes Service type for fc-acs-agent (TR-069 must be reachable off-cluster).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config — and network.acsExternalIP
  # is no longer required.
  serviceType: LoadBalancer
  priorityClassName: firecell-prio-normal
  logLevel: info
  pmUploadDir: /tmp/pm_uploads
  database:
    host: mysql
    port: 3306
    user: root
    name: firecell_ran_tr069
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 1000m
  # Rendered into /app/config/config.yaml via tpl()
  config: |
    auth:
      enabled: true
      realm: "TR-069 ACS"
      algorithm: MD5
      qop: auth
      nonce_timeout: 3600

    credentials:
      username: cpe
      password: cpe

    initial_attach:
      vendors:
        cloudran:
          management:
            Device.ManagementServer.PeriodicInformEnable: true
            Device.ManagementServer.PeriodicInformInterval: 20
          perf_mgmt:
            Device.FAP.PerfMgmt.Config.1.Enable: true
            Device.FAP.PerfMgmt.Config.1.URL: "http://{{ .Values.network.acsExternalIP }}:7547/smallcell/FileUploadService"
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadInterval: 300
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadTime: "2026-02-17T14:25:00Z"
            Device.FAP.PerfMgmt.Config.1.Username: "cpe"
            Device.FAP.PerfMgmt.Config.1.Password: "cpe"
        askey:
          management:
            Device.ManagementServer.PeriodicInformEnable: true
            Device.ManagementServer.PeriodicInformInterval: 20
          perf_mgmt:
            Device.FAP.PerfMgmt.Config.1.Enable: true
            Device.FAP.PerfMgmt.Config.1.URL: "http://{{ .Values.network.acsExternalIP }}:7547/smallcell/FileUploadService"
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadInterval: 300
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadTime: "2026-02-17T14:25:00Z"
            Device.FAP.PerfMgmt.Config.1.Username: "cpe"
            Device.FAP.PerfMgmt.Config.1.Password: "cpe"

    monitoring:
      ue_count_poll_interval_s: 10

    nms_address: "http://nms-api.firecell-nms.svc.cluster.local:5001"

# --- 5G Core Configuration (injected into shared ConfigMap) ---
coreConfig:
  # debug dumps key material (Kamf, KNASint, NAS cipher keys, XRES, ...) from
  # the OAI NFs; use it only for troubleshooting.
  logLevel: info
  registerNf: "yes"
  httpVersion: 1

  # PLMN identity
  mcc: "001"
  mnc: "01"
  tac: "0x0001"

  # AMF configuration
  amf:
    name: "OAI-AMF"
    relativeCapacity: 30
    statisticsTimerInterval: 20
    emergencySupport: false
    # AMF paging (cn5g-amf amf.paging). fanoutMultiGnb: page an idle UE on every gNB
    # serving its registration area, not only the last serving gNB. The AMF built-in
    # default is false when the key is absent; cn5g-amf etc/config.yaml sets true.
    paging:
      fanoutMultiGnb: true
    # SNPN / CAG (cn5g-amf amf.npn). A key is rendered only when it is set, so the
    # AMF defaults apply otherwise: cagEnforcement true, nonCagUeRejectCause 7.
    # nonCagUeRejectCause is the 5GMM cause for a UE without CAG support that is
    # rejected because of CAG restrictions (TS 24.501 5.5.1.2.8); the AMF accepts
    # 7, 11, 27 and 73 and refuses any other value at start.
    npn: {}
    #  cagEnforcement: true
    #  nonCagUeRejectCause: 7
    # NID of the SNPN: written into the AMF plmn_support_list entry when set (11
    # hex digits, first digit 0-2, cn5g-amf NID_REGEX). Empty: no nid is written.
    # FIXME(limitation): the chart renders one plmn_support_list entry, and nid goes
    # onto it, so setting nid makes the AMF SNPN-only (no public PLMN entry). Public
    # PLMN + SNPN on one AMF (SNPN-CAG HLD HD14: a second entry with the same PLMN ID
    # and TAC plus the nid) cannot be expressed here; it needs a hand-edited AMF config.
    nid: ""
    # NR RedCap (cn5g-amf amf.redcap), seed of the FCAPS switch redcapEnabled. The key
    # is rendered only when set; the AMF default is true, and the setting only matters
    # for a gNB that sends a RedCap Indication. false: a RedCap UE is reported to the
    # UDM and the SMF with RAT type NR, as before the feature, not NR_REDCAP.
    redcap: {}
    #  enabled: true
    # NR extended idle mode DRX (cn5g-amf amf.edrx; TS 24.501 5.3.16), seeds of the FCAPS
    # switches edrxEnabled, edrxRedcapOnly and edrxMaxCycleMs. Each key is rendered only when
    # set; the AMF defaults are enabled false, redcapOnly true, maxCycleMs 10240. enabled: the
    # AMF accepts a UE's Requested extended DRX parameters, capped at maxCycleMs (2560, 5120 or
    # 10240 ms, cycles without a Paging Time Window; the render fails on other values, as the
    # AMF refuses them), and pages the UE with that cycle. redcapOnly: only UEs with a RedCap
    # Indication (and redcap.enabled on).
    edrx: {}
    #  enabled: false
    #  redcapOnly: true
    #  maxCycleMs: 10240
    # UE-AMBR the AMF sends to the gNB when neither the PCF nor the subscription
    # (am-data) gives one (cn5g-amf amf.ue_ambr_default). TS 29.571 BitRate strings,
    # at most 4000000000000 bps (TS 38.413 9.3.1.4); the AMF refuses other values at
    # start. 1 Gbps is the AMF default, so this block does not change behaviour as is.
    ueAmbrDefault:
      uplink: "1 Gbps"
      downlink: "1 Gbps"
    # N2 handover (cn5g-amf amf.handover). sourceReleaseDelayMs, seed of the FCAPS switch
    # hoSourceReleaseDelayMs (0..5000 ms, AMF default 1000): how long after the Handover Notify the
    # AMF releases the source RAN's UE context, so that forwarded packets can still arrive; 0
    # releases at the Notify, as before the feature. The AMF refuses other values at start.
    handover:
      sourceReleaseDelayMs: 1000
    # NAS timer T3512 (periodic registration update) in minutes, sent to the UE in the
    # Registration Accept (cn5g-amf amf.nas_timers.t3512_min, default 50; TS 24.501 5.3.7).
    # It must be exactly encodable as a GPRS Timer 3 (TS 24.008 10.5.7.4a: a value of 1 to
    # 31 in units of 1 minute, 10 minutes, 1 hour or 10 hours), so 50 or 60 but not 54;
    # the AMF refuses other values at start. The mobile reachable and implicit
    # de-registration timers follow it (T3512 + 4 minutes).
    nasTimers:
      t3512Min: 50
    # PEI check against the EIR at registration (cn5g-amf amf.eir), seeds of the FCAPS
    # switches eirCheckEnabled and eirEnforcementMode. Both values are the AMF defaults.
    # enabled true also when the release has no EIR (eir.enabled false): the AMF then finds
    # none through the NRF and, in either mode, lets the UE register. false: no check at all.
    # enforcementMode permissive: a PEI the EIR does not know (404 ERROR_EQUIPMENT_UNKNOWN)
    # is allowed, only BLACKLISTED is refused. strict: an unknown PEI is refused too
    # (5GMM cause #6, TS 29.511 5.2.2.2, TS 24.501 Annex A). The AMF refuses any other value.
    eir:
      enabled: true
      enforcementMode: permissive
    # AM policy association with the PCF at registration (cn5g-amf amf.am_policy; TS 23.502
    # 4.2.2.2.2 step 16, TS 29.507), seed of the FCAPS switch amPolicyEnabled. Off by
    # default, which is the AMF default. On: the AMF asks the PCF (the nfs.pcf entry of the
    # config, no NRF discovery) for the RFSP index and the UE-AMBR, and deletes the
    # association at de-registration. The PCF values are set under coreConfig.pcf.amPolicy.
    amPolicy:
      enabled: false
    # NGAP call trace (cn5g-amf amf.call_trace; TS 32.422, TS 38.413 Trace Start). Empty
    # (default) is off: the AMF sends no Trace Start without a usable profile. A profile needs
    # ngranTraceId = 16 hex digits whose first 6 are a PLMN-coded Trace Reference prefix (for
    # MCC 001 / MNC 01: 00F110) and tceIpv4 = the Trace Collection Entity (not in
    # 192.0.2.0/24, the documentation range). interfacesToTrace is the Interfaces To Trace
    # byte (AMF default 0x80), traceDepth a string (AMF default "minimum"); autoStartSupi
    # starts a trace for that SUPI at registration. enabled (AMF default true) is the seed of
    # the FCAPS switch callTraceEnabled (cn5g-amf L5-FS-AMF amf.call_trace.enabled): false = no
    # Trace Start even with a profile. Keys are written only when set.
    callTrace: {}
    #  ngranTraceId: "00F1100000010001"
    #  tceIpv4: "10.0.0.10"
    #  interfacesToTrace: "0x80"
    #  traceDepth: minimum
    #  autoStartSupi: imsi-001010000000002
    enableSimpleScenario: "no"
    enableNssf: "no"
    enableSmfSelection: "no"
    releaseAllPduSessions: "no"
    enableIms: "yes"
    enableUdsf: "yes"
    amfRegionId: "01"
    amfSetId: "001"
    amfPointer: "01"
    supportedIntegrityAlgorithms:
      - "NIA2"
    # The AMF selects the first algorithm in this list that the UE supports, so the
    # order is the preference. NEA0 (null ciphering) last: it is chosen only for a UE
    # that supports nothing else.
    supportedEncryptionAlgorithms:
      - "NEA2"
      - "NEA1"
      - "NEA0"

  # NSSAI / Slices
  nssai:
    - sst: 1
      sd: "000001"

  # DNN configuration
  # IPv6 / IPv4v6 PDU sessions (P23), optional keys per DNN, written to the SMF and
  # UPF DNN lists only when set:
  #   ipv6Prefix: "2001:db8:1::/48"  -> ipv6_prefix. The UE /64 pool, length 0..64;
  #                                     each PDU session gets its own /64 from it.
  #   ipAllocationMode: dhcp         -> ip_allocation_mode, static (NF default) | dhcp.
  #     dhcp on an IPV6/IPV4V6 DNN takes the /64 from an external DHCPv6 server and
  #     needs coreConfig.smf.ipv6.dhcpv6 (primaryServer, linkAddress): without them
  #     every IPv6 PDU session of that DNN is rejected with 5GSM cause #26.
  # An IPV6 or IPV4V6 DNN with ipv6Prefix or ipAllocationMode dhcp turns the IPv6 user
  # plane on for the whole release (ipv6Prefix on an IPV4 DNN is ignored, as by the NFs): the smf ipv6 block, the CP relay
  # on the SMF and every UPF (N4 must then differ from N3), the SMF N4-u port, the
  # NetworkPolicy for UDP 2152 and the UPF N6 IPv6 setup. An IPV4V6 DNN without
  # either (like "ims" below) stays IPv4-only, as before.
  dnns:
    - dnn: "oai"
      pduSessionType: "IPV4"
      ipv4Subnet: "12.1.1.0/25"
    - dnn: "ims"
      pduSessionType: "IPV4V6"
      ipv4Subnet: "14.1.1.0/25"

  # DNS servers for UE
  # primaryIpv6 / secondaryIpv6 (optional): ue_dns primary_ipv6 / secondary_ipv6, the
  # IPv6 DNS the SMF gives the UE (ePCO and the RDNSS option of its RAs).
  dns:
    primaryIpv4: "8.8.8.8"
    secondaryIpv4: "8.8.8.8"

  # IMS P-CSCF
  ims:
    # A valid IPv4 address, never "": the SMF refuses an empty or malformed value at start.
    # 0.0.0.0 means "no IPv4 P-CSCF", e.g. for an IPv6-only IMS DNN: the SMF then sends no
    # P-CSCF IPv4 container (cn5g-smf L4-11-2).
    pcscfIpv4: "192.168.31.205"
    # Empty (default) or "::" means no IPv6 P-CSCF: the SMF sends no IPv6 container. To offer
    # one, set the P-CSCF's global IPv6 address, not a link-local one (RFC 4291 2.5.6:
    # link-local addresses are not valid outside their link). A malformed address makes the
    # SMF refuse its config at start. IPv6 P-CSCF sent when set (needs smf L4-11-2b); the SMF
    # reads the two addresses independently.
    pcscfIpv6: ""

  # SMF configuration
  smf:
    ueMtu: 1452   # 1500 (backhaul) - 36 (GTP-U/UDP/IP overhead) = 1464; further clamped to ogstun MTU (1452)
                  # UE advertises this as its PDU session IP MTU → prevents uplink fragmentation at UPF
    useLocalSubscriptionInfo: "no"
    useLocalPccRules: "no"
    enableQer: "yes"
    enableUdsf: "yes"
    # 5MBS (TS 23.247): the co-located MB-SMF of the SMF (cn5g-smf smf.mbs; "SMF and MB-SMF may be
    # co-located"), multicast sessions preconfigured here ("can be pre-configured in the network").
    # Off by default, no sessions. enabled true lets a UE join or leave a session in a PDU Session
    # Establishment Request or a PDU Session Modification Request (the SMF checks mbsAllowed with
    # the UDM, mbs-data); radio delivery is not done yet (FIXME(limitation) T1 in cn5g-smf). sessions is passed to the SMF as written, with its
    # own key names (snake_case), one entry per multicast session:
    #   - tmgi: {service_id: "000001", mcc: "001", mnc: "01"}   # service_id: 6 hex digits
    #     ssm: {source: 10.0.0.1, group: 232.1.1.1}             # optional
    #     dnn: oai
    #     snssai: {sst: 1, sd: "000001"}                         # sd optional
    #     any_ue: false          # open to any UE (a UE still needs mbsAllowed)
    #     state: active          # active | inactive
    #     qos_flows:
    #       - {qfi: 9, 5qi: 9, arp_priority: 8}
    # The SMF refuses a bad block at start. Seed of the FCAPS switch mbsMulticastEnabled.
    mbs:
      enabled: false
      sessions: []
    # Handover (cn5g-smf smf.handover). endMarker, seed of the FCAPS switch endMarkerEnabled:
    # at an Xn path switch or an N2 handover the SMF asks the UPF to send End Marker packets on
    # the old N3 path (SNDEM, TS 29.244 5.3.2, TS 23.501 5.8.2.9.1). It takes effect only when
    # the UPF reports the EMPU feature. The SMF default is true. false: no SNDEM is requested.
    # dataForwarding, seed of hoDataForwardingMode (cn5g-smf smf.handover.data_forwarding;
    # TS 23.502 4.9.1.3.2): off | direct_only | direct_and_indirect. Lossless N2 handover: the SMF
    # tells the target RAN whether a direct forwarding path exists (direct_only) or also sets up an
    # indirect forwarding tunnel on the UPF (direct_and_indirect, the SMF default). off: no
    # forwarding. indirectForwardingTimerMs, seed of hoIndirectForwardingTimerMs
    # (smf.handover.indirect_forwarding_timer_ms, 100..10000, SMF default 2000): how long the
    # indirect forwarding tunnel is kept after the handover; the SMF refuses other values at start.
    # The render fails on a value the SMF would refuse; an unquoted off (a YAML boolean) is read
    # as "off".
    handover:
      endMarker: true
      dataForwarding: direct_and_indirect
      indirectForwardingTimerMs: 2000
    # PDU session type switches (cn5g-smf smf.support_features), the seeds of the FCAPS
    # switches ipv6PduEnabled and ethernetPduEnabled. A key is written only when it is
    # set, so the SMF defaults apply: enableIpv6Pdu yes, enableEthernetPdu no.
    # enableIpv6Pdu "no": the SMF treats its configuration as limited to IPv4 only
    # (IPv4v6 request: IPv4 and 5GSM cause #50; IPv6 request: reject #50 or #28, TS 24.501
    # 6.4.1.3, 6.4.1.4.1), whatever the DNNs say. enableEthernetPdu "yes": the SMF admits
    # an Ethernet PDU session on a DNN with pdu_session_type ETHERNET; the UPF side is
    # not set here.
    # enableIpv6Pdu: "yes"
    # enableEthernetPdu: "no"
    # OAI key: smf.location_api_root (cn5g-smf #49). apiRoot the SMF puts in the Location of a
    # created SM context, e.g. "http://oai-smf:8080", so the AMF keeps a URI that outlives the SMF pod
    # (TS 29.502 6.1.3.2.3.1, TS 29.500 6.10.4). Empty = SMF default (its listen address).
    # Only with one SMF, or several that share the SM contexts through UDSF. With global.sbi.tls
    # it must be https://, e.g. "https://oai-smf:8080" (the render fails otherwise).
    locationApiRoot: ""
    enableUsageReporting: "no"
    # OAI key: enable_dl_pdr_in_pfcp_session_establishment (per-UPF under smf.upfs[].config)
    enableDlPdrInPfcpSessionEstablishment: "yes"
    # Per-UPF OAI key: enable_upf_wo_nf_discovery. "yes" => static upf_pool (skip NRF).
    # "no" => SMF discovers UPFs via NRF (dynamic UPF selection). Requires UPFs to register
    # to NRF successfully (SBI on cni0 for hostNetwork UPFs).
    enableUpfWoNfDiscovery: "yes"
    # IPv6 user plane (P23-c, P23-g): the cn5g-smf "smf: ipv6:" block, written only when
    # the IPv6 user plane is on (see dnns above). An empty value is left out, and the SMF
    # uses its own default (in brackets).
    ipv6:
      smfLinkLocal: ""         # smf_link_local, fe80::/64 source of the RAs [fe80::1]
      n4u:
        # n4u.address: the SMF's N4-u GTP-U endpoint (IPv4). The SMF binds it, and the
        # UPF's CP-relay FAR sends the UE's RS/NS to it, so it must be an address of the
        # SMF itself (never a ClusterIP). [the SMF N4 address] For an address that
        # survives an SMF pod replacement (D-1b) use smf.multus.enabled + smf.n4IP, or
        # smf.hostNetwork + smf.hostPfcpIP; with the pod IP, NOTES prints a warning.
        # FIXME(TS 29.244 V18.10.0 clause 5.3.1; D-1b, user decision 2026-11-10): there
        # is no N4-u Service. The SMF binds n4u.address itself (cn5g-smf smf_n4u.cpp:99-100)
        # and puts it in the UPF's "CP function side" FAR, which forwards "to a GTP-u
        # F-TEID uniquely assigned in the CP function per PFCP session and PDR"; a
        # ClusterIP is neither bindable by the SMF nor a CP-function F-TEID. On the pod
        # network the address changes with the pod: the SMF's N4 restore rebuilds the FAR
        # with the new address (P23-c set_restore_rules), but a session the UPF keeps
        # without that restore still sends the UE's RS/NS to the old address (HLD R-3).
        address: ""
        port: ""               # n4u.port [2152]
      ra:                      # Router Advertisements (TS 29.061 11.2.1.3.4 defaults)
        maxRtrAdvIntervalS: ""  # max_rtr_adv_interval_s, 4..65535 [21600]
        routerLifetimeS: ""    # router_lifetime_s, 0 or >= maxRtrAdvIntervalS [65535]
        initialCount: ""       # initial_count, 0..10 [3]
        initialIntervalS: ""   # initial_interval_s, 1..3600 [10]
        mtu: ""                # mtu, 0 (= ueMtu) or >= 1280 [0]
        rdnss: ""              # rdnss, "yes"/"no": DNS option in the RA [yes]
      # DHCPv6 client for DNNs with ipAllocationMode dhcp (TS 29.561 10.2.3). One server
      # set and link-address for all DNNs. The SMF needs an IPv6 path to the server and
      # must be able to bind UDP 547; the server's subnet must contain linkAddress, with
      # a pd-pool of delegated length 64. A secondaryServer must share lease state with
      # the primary (Kea HA or a shared lease database).
      dhcpv6:
        primaryServer: ""      # primary_server, global or ULA IPv6
        secondaryServer: ""    # secondary_server
        linkAddress: ""        # link_address, selects the server's prefix pool
        allocateTimeoutS: ""   # allocate_timeout_s, 1..30 [2]
        sendRelease: ""        # send_release, "yes"/"no" [yes]

  # SBI HTTP client timeout (ms) — default OAI is 3000; raise on busy labs to avoid NRF heartbeat false failures
  httpRequestTimeoutMs: 10000

  # NRF configuration
  nrf:
    heartbeat: 50
    suspendedNfInterval: 120

  # PCF configuration
  pcf:
    enablePolicyProvisioningApi: "yes"
    # AM policy the PCF returns to the AMF (cn5g-pcf pcf.am_policy; Npcf_AMPolicyControl,
    # TS 29.507). Only used when the AMF asks for it: coreConfig.amf.amPolicy.enabled. Empty
    # (default): the PCF answers with the values the AMF sent. rfspIndex 1..256; ueAmbr needs
    # both uplink and downlink as TS 29.571 BitRate strings; servAreaRes is the Service Area
    # Restriction (TS 29.571 ServiceAreaRestriction, L1-A3-8): restrictionType ALLOWED_AREAS
    # or NOT_ALLOWED_AREAS and tacs, a list of 4 or 6 hex digit TACs, which must be QUOTED
    # (an unquoted 000009 is the number 9). The PCF sends it only when the AMF sent a
    # servAreaRes in its request. supi overrides the defaults per SUPI (the same three keys).
    # The PCF refuses a bad value at start; the render fails first for a missing
    # restrictionType or tacs.
    amPolicy: {}
    #  rfspIndex: 12
    #  ueAmbr:
    #    uplink: "100 Mbps"
    #    downlink: "1 Gbps"
    #  servAreaRes:
    #    restrictionType: NOT_ALLOWED_AREAS
    #    tacs: ["000009"]
    #  supi:
    #    imsi-001010000000002:
    #      rfspIndex: 7
    #      servAreaRes:
    #        restrictionType: ALLOWED_AREAS
    #        tacs: ["000001", "00000A"]
    # Npcf_PolicyAuthorization (N5) switches (cn5g-pcf pcf.policy_authorization), seeds of the
    # FCAPS switches afEventsEnabled and pcscfRestorationEnabled. Both values are the PCF
    # defaults. afEvents: the AF events subscription over N5 and the optional notifications to
    # the AF (resources allocation outcome, already met events); the termination request the
    # PCF sends when the PDU session ends is always sent (TS 29.514 4.2.5.3). pcscfRestoration:
    # PCF based P-CSCF restoration (TS 29.514 4.2.2.27, TS 29.512 4.2.3.18).
    policyAuthorization:
      afEvents: true
      pcscfRestoration: true
    # Subscription trace (cn5g-pcf pcf.trace; TS 29.507 4.2.2.1, TS 32.422): for a UE whose
    # subscription has traceData naming the PCF, the PCF writes the AM and SM policy messages
    # of its associations as JSON lines to <dir>/<traceRef>_<TRSR>.jsonl. Empty (default): the
    # key is not written, the PCF uses its own defaults and no volume is added. Setting any
    # key writes pcf.trace and mounts an emptyDir at dir, because the image has no
    # /openair-pcf/trace and the PCF does not create the directory (without it the PCF logs
    # "Trace record not written"). The files are lost when the pod restarts and are collected
    # with kubectl cp; they are not sent to a Trace Collection Entity (FIXME in the PCF).
    # dir: an absolute path (default /openair-pcf/trace); maxSessions: Trace Sessions at a
    # time, 1 or more (PCF default 100).
    trace: {}
    #  dir: /openair-pcf/trace
    #  maxSessions: 100

  # UDM configuration
  udm:
    suciProfileId: 1
    suciKeyFile: /openair-udm/etc/a.key
    suciScheme: 1

  # Database
  database:
    host: mysql
    user: root
    password: ""              # REQUIRED — set via overlay (see values-lab-insecure-defaults.yaml)
    type: mysql
    name: oai_db
    generateRandom: true
    connectionTimeout: 10

# --- Network Policies ---
networkPolicies:
  enabled: true
  # Whether to allow ingress from nms.namespace (defaults to true when fcAcsAgent enabled)
  allowNmsNamespace: true
  allowedNamespaces: []
  # CIDRs allowed to reach core NFs from outside the cluster (RAN, gNB, test hosts)
  # Example: ["10.218.184.0/24"] to allow the Multipass lab subnet
  allowedExternalCIDRs: []

# --- NMS access ---
nms:
  # -- Let ServiceAccount nms of the firecell-nms release read pods and logs,
  # write intent ConfigMaps, and restart, stop and start the NF Deployments
  # (AMF, SMF, PCF, UDR, UDM, NRF, AUSF, UDSF and every UPF instance) here.
  rbac: true
  # -- Namespace of the firecell-nms release: the RBAC subject, and the
  # namespace networkPolicies.allowNmsNamespace admits.
  namespace: firecell-nms

# --- Helm Lifecycle Hooks (Standalone Atomic Install / Upgrade / Uninstall) ---
hooks:
  enabled: true
  preFlight:
    enabled: true
    image: ""
    backoffLimit: 1
    timeoutSeconds: 120
    requireSctp: true
    verifyGateway: true
  postFlight:
    enabled: true
    image: ""
    backoffLimit: 1
    timeoutSeconds: 300
    retries: 30
    intervalSeconds: 4
    verifyNrfRegistrations: true
    verifyPfcpAssociation: true
  postDelete:
    enabled: true
    image: ""
    timeoutSeconds: 90

# --- Image Pull Secret ---
# Pre-create before helm install (Docker Hub):
#   kubectl create secret docker-registry dockerhub-regcred \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=<user> --docker-password=<token> \
#     -n firecell-core
