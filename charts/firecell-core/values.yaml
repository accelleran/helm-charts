# Firecell 5G Core - Simplified (non-HA) Deployment
# This values file configures a single-replica deployment of all 5GC NFs.

global:
  # Namespace for all resources
  namespace: firecell-core

  # Docker Hub — pre-create a docker-registry pull secret before helm install
  imageRegistry: docker.io/accelleran
  # The busybox used by every initContainer in this chart. Composed from
  # imageRegistry when unset; name it in full to pull it from anywhere else.
  busyboxImage: docker.io/library/busybox:1.38.0-glibc
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: dockerhub-regcred

  # Package version — default image tag when an NF imageTag is empty
  pkgVersion: "6.0.0"

  # Timezone for all NF containers
  timezone: Europe/Paris

  # SBI security (TS 29.500 5.1: "all 3GPP NFs shall support TLS and TLS shall be used within a
  # PLMN if network security is not provided by other means"; TS 33.501 13.1.0 mutual TLS; TS 29.500
  # 6.7.3 OAuth2 access tokens). Both are off by default and then nothing below is rendered. They
  # are the operator's choice (TS 33.501 13.1.0 NOTE 2); cn5g-common-src tls / oauth2 blocks.
  #
  # TLS on: the NFs serve and call the SBI over HTTP/2 with TLS, so http_version is written as 2
  # whatever coreConfig.httpVersion says (the NFs refuse TLS with HTTP/1). Each NF mounts the
  # Secret <secretPrefix>-<nf> (keys tls.crt, tls.key, ca.crt) at /etc/firecell/sbi-tls.
  # The Rx-N5 IWF (ims.rxN5Iwf) is covered: HTTPS + OAuth2 to the PCF and the NRF, client
  # certificate sbi-tls-rx-n5-iwf; OAuth2 needs ims.rxN5Iwf.nrf.register (the render fails without
  # it). The P-CSCFs get SBI_TLS_ENABLED / SBI_OAUTH2_ENABLED and only warn: the Rx link to the
  # IWF is Diameter, not SBI.
  # Not covered when TLS is on (FIXME(limitation)): the P-CSCF restoration request of the
  # alternative P-CSCF (cleartext, no token: the PCF refuses it with TLS or OAuth2 on), the PCF's
  # notifications to the IWF (http), the NMS and ACS agents, and the post-flight verify hook (it
  # reads the NRF over http).
  # The NEF (nef.enabled) is covered: TLS on its northbound API and toward the AMF, SMF, UDM and
  # NRF; OAuth2 needs nef.config.nrf.register (the render fails without it). Its image must be a
  # build with Pistache SSL (cn5g-nef NEF_PISTACHE_SSL), else the NEF exits with TLS on. With
  # requireClientCert an AF calling the NEF needs a client certificate from the SBI CA.
  # The NEF gives the AMF its notification URI with the host name oai-nef (NEF_HOSTNAME).
  # NEF with TLS and nef.config.nrf.discoverAmf: the NEF dials the discovered AMF by the fqdn of
  # its NF profile (cn5g-nef nef_nrf.hpp amf_event_exposure_url), and an AMF with TLS registers
  # fqdn = its SBI host name, oai-amf here (cn5g-amf generate_amf_profile, R1 A-26), which its
  # certificate carries. So discovery works with TLS when both are rc-02 feature wave images
  # (from the code; not run on the lab). An AMF profile without an fqdn (an older AMF image) is
  # skipped, and the NEF falls back to the static AMF peer (nef.config.peers.amf).
  sbi:
    tls:
      enabled: false
      # Mutual TLS: a client must present a certificate the CA verifies. verifyPeer: the NFs verify
      # the server certificate of the NFs they call.
      requireClientCert: true
      verifyPeer: true
      # secrets: the Secrets exist already: scripts/gen-sbi-certs.sh makes the PKI files (a test
      # PKI, not for production) and scripts/sbi-secrets-from-certs.sh creates the Secrets from
      # them. Run gen-sbi-certs.sh with -p oai- -a rx-n5-iwf=ims-rx-n5-iwf: the NFs dial each
      # other by the Service names (oai-<nf>), and the peer certificate must carry them. certManager: the chart creates a self-signed CA Issuer, the CA, a CA Issuer and one
      # Certificate per NF (cert-manager must be installed).
      # helm: the chart makes the CA (Secret <secretPrefix>-ca) and one certificate per NF itself,
      # RSA 2048, server and client auth, the same host names as certManager. An upgrade keeps
      # them (lookup); a new NF gets a certificate from the same CA. helm template and a
      # client-side dry run cannot look up, so each of those renders new keys (a GitOps tool
      # that renders with helm template rotates the PKI at every sync: use secrets or
      # certManager there). The certificates are not renewed: delete the Secrets and upgrade
      # (all NFs restart) before certDays run out. A test PKI, as gen-sbi-certs.sh.
      source: secrets
      secretPrefix: sbi-tls
      # certManager issues ECDSA P-256 keys: NF images built before cs 36fab3d8 fail the TLS
      # handshake with them (curl-gnutls certificate-info bug); helm and the lab runs use RSA.
      certManager:
        duration: 8760h
        renewBefore: 720h
      helm:
        caDays: 3650
        certDays: 825
    # OAuth2 access tokens (TS 29.500 6.7.3, TS 33.501 13.4.1): the NRF signs them with ES256
    # (EC P-256), the producers check them with its public key. Two Secrets, made by
    # scripts/gen-sbi-certs.sh: signingKeySecret (key signing-key.pem, mounted in the NRF only) and
    # publicKeySecret (key public-key.pem, mounted in every NF; they all read the shared config).
    # The NFs refuse OAuth2 with http_version 1, so OAuth2 needs TLS on and HTTP/2.
    oauth2:
      enabled: false
      # secrets: the two Secrets exist already (gen-sbi-certs.sh). helm: the chart makes the EC
      # P-256 signing key and derives the public key from it; an upgrade keeps the key (lookup;
      # not with helm template, see tls.source helm).
      keySource: secrets
      signingKeySecret: nrf-oauth2-signing-key
      publicKeySecret: nrf-oauth2-public-key
      # Seconds before expiry at which an NF fetches a new token (0..3600; NF default 30).
      tokenRefreshMarginS: 30
      # Lifetime of a token issued by the NRF (60..86400; NRF default 3600).
      tokenValiditySeconds: 3600

# --- Namespace Management ---
# Set create: false when using `helm upgrade --install --create-namespace` or when
# the namespace is pre-created externally (e.g., to hold registry pull secrets).
namespace:
  create: false
  keepOnUninstall: true

# --- Network / MetalLB ---
# MetalLB is optional. templates/metallb-pool.yaml is rendered only when
# metallb.enabled is true (AMF/ACS LoadBalancer VIPs for an off-cluster gNB).
# Set metallb.enabled: false when the cluster has no MetalLB.
#
# CP/UP separation model:
#   cp.interface (e.g. eth0 / bond0) — control plane NIC: AMF NGAP, SBI
#   up.interface (e.g. eth1 / bond1) — user plane NIC:  UPF GTP-U (N3)
#
# Both can point to the same interface for single-NIC lab setups,
# but assign IPs from different ranges so MetalLB distinguishes pools.
network:
  metallb:
    enabled: true
    cp:
      # Override via site/environment values (documentation ranges as placeholders).
      poolRange: "192.0.2.101-192.0.2.110"
      l2Interface: eth0          # NIC facing gNB/RAN control-plane network
    up:
      # When false, skip MetalLB UP pool (OAI hostNetwork N3 on a physical IP, no LB pool).
      enabled: true
      poolRange: "198.51.100.101-198.51.100.110"
      l2Interface: eth1          # NIC facing gNB GTP-U / data network
    ingress:
      poolRange: "192.0.2.100/32"
      l2Interface: eth0
  # oai-amf Service type. Keep LoadBalancer when the gNB is off-cluster and
  # reaches N2 through a VIP. Set ClusterIP for a pod-networked RAN, where the
  # gNB resolves the headless oai-amf-n2 Service and NGAP is pod-to-pod;
  # amfExternalIP is then unused and the address can be returned to the pool.
  amfServiceType: LoadBalancer

  # External IPs — always override from sites/*/site.yaml generated values
  amfExternalIP: "192.0.2.101"
  acsExternalIP: "192.0.2.102"
  upfExternalIP: "198.51.100.101"

# --- Database (MySQL 8.3 single-node) ---
# For production, consider switching to Percona XtraDB Cluster operator.
# Credentials: set via --set / site overlay. Lab-only insecure defaults:
#   environments/values-lab-insecure-defaults.yaml
mysql:
  enabled: true
  image: mysql:8.3
  # Full image reference, winning over registry + image composition.
  # image is "mysql:8.3" (includes a tag); without this override the chart
  # would ask Hub for accelleran/mysql:8.3.
  imageOverride: "docker.io/library/mysql:8.3"
  # Extra SQL run once at first initialisation of the data directory, after the chart's own
  # scripts (a docker-entrypoint-initdb.d file, so it does not run on an existing volume).
  # Empty: nothing is added. examples/values-5gc-eth.yaml uses it for an Ethernet subscriber.
  extraInitSql: ""
  rootPassword: ""            # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  database: oai_db
  user: ""                    # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  password: ""                # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  keepSecretOnUninstall: false
  storage:
    size: 6Gi
    storageClass: ""          # Empty = use cluster default
  resources:
    requests:
      memory: 1Gi
      cpu: 600m
    limits:
      memory: 2Gi
      cpu: 1000m

# --- UDSF (Unstructured Data Storage Function) + Redis backing store ---
udsf:
  enabled: true
  image: cn5g-udsf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  serviceName: oai-udsf
  # The name the NFs dial (nfs.udsf.host; with hostNetwork NFs <host>.<namespace>.svc.cluster.local).
  # With global.sbi.tls it must be in the UDSF certificate: source certManager adds it when it
  # differs from serviceName; source secrets: gen-sbi-certs.sh -a udsf=<host>.
  host: oai-udsf
  sbiPort: 8080
  healthPath: /nudsf-data-mgmt/v1/healthz
  redis:
    image: redis:7-alpine
    # Full image reference, winning over the verbatim image above.
    # Same escape hatch every workload has: without it a registry mirror
    # or retag cannot be named.
    imageOverride: ""
    port: 6379
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 1000m
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UDSF NE in the NMS. A
      # mismatch mounts EMPTY and the UDSF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-udsf-cm-intent
      optional: true
    # No seedConfigPath: the UDSF is configured by environment
    # variables, not a YAML file, so there is no seed document to
    # snapshot before the overlay.


# --- NRF (NF Repository Function) ---
nrf:
  enabled: true
  image: cn5g-nrf
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-crit
  command:
    - /openair-nrf/bin/oai_nrf
    - -c
    - /openair-nrf/etc/config.yaml
    - -o
  configMountPath: /openair-nrf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the NRF NE in the NMS. A
      # mismatch mounts EMPTY and the NRF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-nrf-cm-intent
      optional: true
    seedConfigPath: /openair-nrf/etc/config.yaml

# --- UDR (Unified Data Repository) ---
udr:
  enabled: true
  image: cn5g-udr
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-crit
  command:
    - /openair-udr/bin/oai_udr
    - -c
    - /openair-udr/etc/config.yaml
    - -o
  configMountPath: /openair-udr/etc/config.yaml
  waitForMysql: true
  # Process binds SBI on 8080 only. Do not advertise containerPort 80 — nothing
  # listens there (see templates/udr/service.yaml: Service port 80 maps to 8080).
  ports:
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  fcaps:
    enabled: false
    mnsPort: 9091
    # Same two modes as the AMF and SMF; see amf.fcaps.intentMode for the cost
    # of each. The UDR was written against 1.0.7 from the start, so `pvc` is
    # here for symmetry rather than as a supported deployment.
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UDR NE in the NMS. A
      # mismatch mounts EMPTY and the UDR reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-udr-cm-intent
      optional: true
    seedConfigPath: /openair-udr/etc/config.yaml

# --- UDM (Unified Data Management) ---
udm:
  enabled: true
  image: cn5g-udm
  # Used as-is with imageRegistry. Empty: global.pkgVersion.
  imageTag: ""
  # Full image reference, winning over registry + image + tag composition.
  imageOverride: ""
  priorityClassName: firecell-prio-normal
  command:
    - /openair-udm/bin/oai_udm
    - -c
    - /openair-udm/etc/config.yaml
    - -o
  configMountPath: /openair-udm/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
  resources:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  # SUCI decryption private key — REQUIRED via overlay (see values-lab-insecure-defaults.yaml for lab demo key)
  suciKey: ""
  # -- More SUCI home network profiles, next to the one from coreConfig.udm.suci* (TS 33.501 Annex C.3).
  # Each entry: `id` = the home network public key ID the UE sends (the UDM has no fallback when it
  # matches no profile), `scheme` = 1 (Profile A, X25519) or 2 (Profile B, P-256), `key` = PKCS#8 PEM
  # private key. Each key is stored in ConfigMap oai-udm-config as suci-<id>.pem (like suciKey) and
  # mounted at /openair-udm/etc/suci-<id>.pem. Empty (default): only the single profile, as before.
  # Example:
  #   extraSuciProfiles:
  #     - id: 11
  #       scheme: 1
  #       key: |
  #         -----BEGIN PRIVATE KEY-----
  #         ...
  #         -----END PRIVATE KEY-----
  extraSuciProfiles: []
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UDM NE in the NMS. A
      # mismatch mounts EMPTY and the UDM reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-udm-cm-intent
      optional: true
    seedConfigPath: /openair-udm/etc/config.yaml


