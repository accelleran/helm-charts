# --- UPF (User Plane Function) ---
upf:
  enabled: true
  # "o5gs" for Open5GS UPF (default), "oai" for OAI UPF
  type: o5gs
  o5gsImage: o5gs-upf
  # Full reference for the o5gs UPF, like oaiImageOverride for the OAI one.
  o5gsImageOverride: ""
  oaiImage: oai-upf
  # Full reference for the OAI UPF, like o5gsImageOverride for the o5gs one.
  oaiImageOverride: ""
  # Kubernetes Service type for the GTP-U Service(s).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config.
  serviceType: LoadBalancer
  hostNetwork: true
  privileged: true
  # Multus secondary NICs when hostNetwork=false: eth0 (pod/CNI) stays SBI+N4;
  # Multus attaches net1 (N3) then net2 (N6). Requires Multus CNI + macvlan/ipvlan.
  # XDP_REDIRECT between Multus macvlan net1/net2 in the pod netns drops UL —
  # multus.enableBpfDatapath defaults false (simpleswitch). Same-host gNB on a
  # host macvlan needs a /32 to UPF N3 via that macvlan (parent cannot reach children).
  multus:
    enabled: false
    # Opt-in XDP for Multus only (ignored when hostNetwork=true). Default false.
    # Set true when using cniType: host-device (Option 2, xdpAttachMode: native)
    # or cniType: bridge on both N3 and N6 (Option 1, xdpAttachMode: generic).
    enableBpfDatapath: false
    n3:
      nadName: upf-n3-net
      # Supported cniType values:
      #   - "host-device": moves physical NIC (masterInterface/device) into UPF pod netns (Option 2, native XDP)
      #   - "bridge":      attaches veth to host Linux bridge (masterInterface/bridge) (Option 1, generic XDP)
      #   - "macvlan" / "ipvlan": attaches sub-interface on masterInterface
      cniType: macvlan
      mode: bridge
      masterInterface: ""       # site: physical NIC (host-device/macvlan) or bridge name (bridge CNI)
      ip: ""                    # e.g. 10.3.0.101
      subnetPrefix: 24
      # Optional list of N3 peer IPs (e.g. ["10.3.0.4", "10.3.0.5"]) to ping from net1 in multus-datapath-init
      arpWarmIPs: []
    n6:
      nadName: upf-n6-net
      cniType: macvlan
      mode: bridge
      masterInterface: ""       # site: physical NIC (host-device/macvlan) or bridge name (bridge CNI)
      ip: ""                    # e.g. 10.10.0.101
      subnetPrefix: 24
  # CP/UP interface separation
  # n3IP: explicit GTP-U bind/advertise IP (set to network.upfExternalIP for MetalLB UP VIP)
  n3IP: "198.51.100.101"        # Must match network.upfExternalIP
  n3Interface: "eth1"            # UP NIC — used when n3IP is empty; Multus → net1
  n4Interface: "eth0"            # CP NIC — parent for pfcp-macvlan-init; PFCP toward SMF
  # OAI hostNetwork only: SBI/NRF HTTP bind (e.g. k3s cni0 — must reach ClusterIP/pod CIDR)
  sbiInterface: ""
  # OAI hostNetwork: N6 data-plane NIC (do not set to cni0; use physical uplink/DN)
  # Multus non-hostNetwork: set to net2
  n6Interface: ""
  # OAI hostNetwork: optional N6 IP/CIDR on n6Interface (required for datapath-init in single-instance mode).
  n6Cidr: ""
  # N6 default gateway toward DN (set in site overlay, e.g. values-dataplane-*.yaml / host_vars). Required when n6Cidr is set.
  remoteN6Gw: ""
  # datapath-init: block UPF start until remoteN6Gw ARP succeeds — avoids empty BPF m_arp_table.
  datapathInit:
    n6GatewayArpRetries: 60
    n6GatewayArpIntervalSec: 5
  # When true, n3-ip-init automatically creates n3Interface (e.g. upf-n3) as a
  # bridge-mode macvlan on n4Interface and adds an on-link route to remoteN6Gw.
  autoCreateN3Macvlan: false
  # When true and cilium_host exists on the node, datapath-init injects the
  # cilium_host pod-CIDR route into the UPF policy routing table so traffic from
  # the N3/N6 VIP reaches in-cluster pods (gNB, ext-dn) without external Ansible tasks.
  injectCiliumPodRoute: true
  # OAI: optional N9; defaults to n3Interface in generated YAML
  n9Interface: ""
  # OAI UPF hostNetwork: yes = XDP/eBPF; no = simpleswitch. Multus uses multus.enableBpfDatapath.
  enableBpfDatapath: true
  # Hostnet config.yaml schema: mr97 (develop @ 486acc3+) or legacy (cn5g-upf v5.1.0.x).
  configSchema: mr97
  # Runtime XDP attach (cn5g-upf UPF_XDP_ATTACH_MODE): auto | native | generic
  xdpAttachMode: auto
  # OAI UPF only: Layer-2 Ethernet PDU sessions (cn5g-upf support_features.enable_eth_pdu).
  # Default no — set true only when SMF/UE use Ethernet PDU; does not remove XDP "ETH PDU"
  # fallback trace strings (see cn5g-upf UserPlaneComponent / pfcp_session_lookup_xdp_kernel).
  oaiEnableEthPdu: false
  # fc-packet-capture sidecar (REST on FC_REST_PORT). See docs/operations/upf-packet-capture.md.
  packetCapture:
    enabled: true
    # Multiple hostNetwork UPF pods: one REST port per pod, cn-agent has a single n3_interface_name.
    disableOnMultiInstance: true
    # fc-packet-capture is a Firecell agent-family image on the NMS release line (like cnAgent/
    # fcAcsAgent), NOT the OAI 5GC core line. It has no global.pkgVersion (e.g. v5.1.0) build, so
    # pin it to the NMS tag. Empty => falls back to global.pkgVersion.
    imageTag: "5.0.1.0"
    imageOverride: ""
  # fc-dnn-dataplane sidecar. The NMS calls it once, after an operator
  # Start/Restart, to add the routes and SNAT rules a newly added DNN needs.
  # It has no loop of its own and never deletes a rule it did not expect.
  #
  # Off by default: it is only useful with the CM DNN feature enabled on the
  # NMS side (NMS_DNN_DATAPLANE_ENABLED), and it is only load-bearing for the
  # userspace datapath. With enableBpfDatapath: true it reports NOT_APPLICABLE
  # on every call, because XDP programs the pool in eBPF and there is no
  # per-DNN Linux route to check.
  #
  # See cm-poc/docs/dnn-dataplane.md.
  dnnDataplane:
    enabled: false
    image: fc-dnn-dataplane
    # Firecell agent-family image on the NMS release line, like packetCapture:
    # it has no global.pkgVersion build. Empty => falls back to pkgVersion.
    imageTag: "5.0.1.0"
    # Full image ref (skips registry + :vTAG), for a locally imported lab build
    # that helm must still name, or the next upgrade silently reverts it.
    # e.g. imageOverride: "fc-dnn-dataplane:route-fix"
    imageOverride: ""
    # One port per pod: N hostNetwork UPFs on one host would otherwise collide.
    # Offset from 8095 (packetCapture) far enough that the two ranges cannot
    # overlap however many instances are declared.
    basePort: 8196
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m
  # Optional overrides for hostnet ConfigMap (see docs/developer/oai-upf-ebpf-hostnet.md)
  oaiHostNet:
    stubInterface: ""            # Else sbiInterface, else eno8303
    smfN4Interface: ""         # Else hostPfcpMacvlan, else n4Interface
  hostPfcpMacvlan: ""            # If set, create a host macvlan bridge slave on n4Interface for PFCP
  hostPfcpIP: ""                 # IP to assign to hostPfcpMacvlan (must be free on the CP subnet)
  pfcpHost: ""                   # Override UPF PFCP host for SMF config (use macvlan IP when hostPfcpMacvlan is set)
  dnsServers:
    - 10.152.183.10
  dnsSearchDomains:
    - firecell-core.svc.cluster.local
    - svc.cluster.local
    - cluster.local
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m
  fcaps:
    enabled: false
    mnsPort: 9091
    # Same two modes as the AMF and SMF; see amf.fcaps.intentMode for the cost
    # of each. The UPF was written against 1.0.7 from the start, so `pvc` is
    # here for symmetry rather than as a supported deployment.
    intentMode: configmap
    datastore:
      # The fcaps-common default, so the NF finds cm.json with no environment
      # variable at all.
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UPF NE in the NMS. A
      # mismatch mounts EMPTY and the UPF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one. First slice is one NE (`upf-1` / `oai-upf`); extra
      # hostNetwork instances need their own NE and ConfigMap.
      name: oai-upf-cm-intent
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet.
    seedConfigPath: /openair-upf/etc/config.yaml
  # UPF-specific env vars (o5gs)
  disableNat: "FALSE"
  blockSshAccess: "FALSE"
  protectedSshNetworks: "10.0.0.0/8,192.168.31.0/24,172.17.5.0/24"
  sshExemptedIps: "192.168.31.254"

  # open5gs-upfd global.max.ue — max concurrent PDU sessions (not UE count;
  # each UE may have multiple sessions). Memory ≈ 1–2 KB per session.
  maxSessions: 1024

  # Userplane performance tuning — all gated on performance.enabled.
  # Safe to leave disabled (default). Enable per environment in values-<env>.yaml.
  performance:
    enabled: false
    mtu: 1420             # ogstun MTU; also used as session MTU in upf.yaml
                          # 1420 = safe default (GTP-U overhead 36B + 44B headroom)
                          # 1380 = conservative (use on known-good single-hop LAN)
    tcpMssClamp: true     # iptables mangle TCPMSS --clamp-mss-to-pmtu on ogstun
    socketRmemMax: 26214400   # net.core.rmem_max (25 MB) — absorbs ~17ms of 10Gbps burst
    socketWmemMax: 26214400   # net.core.wmem_max
    conntrackMax: 524288      # net.netfilter.nf_conntrack_max
    conntrackUdpTimeout: 120        # seconds; default 30 causes flow stall when iperf report-back is lost
    conntrackUdpStreamTimeout: 3600  # seconds after first bidirectional UDP exchange
    enableBBR: true           # load tcp_bbr2 / tcp_bbr kernel module
    txQueueLen: 10000         # ogstun txqueuelen (default 500 is too small for bursts)
    disableLRO: true          # ethtool lro off on N3 NIC (LRO corrupts GTP inner checksums)
    tunQdisc: "pfifo_fast"    # TUN qdisc; pfifo_fast has lower overhead than fq_codel for bulk forwarding
    netdevBudget: 600         # packets processed per NAPI cycle (default 300 throttles high-PPS)
    netdevBudgetUsecs: 8000   # CPU time budget per NAPI cycle in µs (default 2000)
    cpuAffinity: ""           # taskset core list for open5gs-upfd (e.g. "8-15"); empty = no pinning

  # Multi-UPF instance list. When non-empty, replaces legacy single-UPF config.
  # Each entry produces one independent Deployment + Service (type: upf.serviceType).
  # Leave empty for single-UPF operation (backward compatible).
  instances: []
  # instances:
  #   - suffix: ""           # Deployment name suffix: "o5gs-upf" when empty
  #     n3IP: "10.x.x.x"    # MetalLB VIP for GTP-U (must be in up.poolRange)
  #     n3Interface: eno1
  #     n6Interface: eno1
  #     n4Interface: eno1
  #     inSmfPool: true                   # include this UPF in SMF upf_pool/upfs
  #     poolState: ACTIVE                 # ACTIVE|DRAINING (rendered to SMF config)
  #     dnns: ["oai"]                     # per-UPF DNN steering (e.g. oai/oai2)
  #     tunDev: "ogstun"                   # TUN device name — MUST be unique per instance on same host
  #     hostPfcpMacvlan: "smf-pfcp-mac"   # unique per instance
  #     hostPfcpIP: "10.x.x.y"            # PFCP source IP (not in any MetalLB pool)
  #     pfcpHost: "10.x.x.y"
  #     sessions: "12.1.1.0/24"           # comma-separated UE subnets for this instance

# --- IMS (Kamailio + Cx-on-UDR default; Asterisk via examples/values-ims-asterisk.yaml) ---
ims:
  enabled: true
  # kamailio (default) | asterisk — Asterisk-only: examples/values-ims-asterisk.yaml
  engine: kamailio
  image: kamailio-ims
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  imageTag: latest
  priorityClassName: firecell-prio-support
  registrationExpires: "3600"
  # Empty → templates default to mysql.<namespace>.svc.cluster.local (works for
  # hostNetwork CSCF/Cx when cluster DNS + ClusterIP reachability exist). Override
  # only if MySQL is external / on a host IP.
  mysqlHost: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 2000m
  # Asterisk-only (ignored when engine=kamailio)
  sipConf: |
    [general]
    language=en
    tcpenable=yes
    tcpbindaddr=0.0.0.0
    tcpbindport=5060
    srvlookup=yes
  # Leave empty. After the IMS sidecar is in the pod it is the only runtime
  # writer of users.conf (emptyDir). A non-empty ConfigMap seed would still be
  # wiped on restart; the sidecar's bootId is how the NMS re-asserts the list.
  # Filling this in would reintroduce a second writer.
  usersConf: ""
  sidecar:
    # Asterisk engine only. OFF by default until the image is published to
    # imageRegistry. The composed default resolves to
    # ghcr.io/accelleran/.../nms-ims-sidecar:latest, which does not exist: the
    # image is built locally and imported into the node. A default-on sidecar
    # whose image cannot be pulled leaves the whole pod NotReady, and the
    # Service then drops the endpoint - turning a working Asterisk into an
    # unreachable one. Enable it explicitly, with imageOverride:
    #   --set ims.sidecar.enabled=true \
    #   --set ims.sidecar.imageOverride=nms-ims-sidecar:<tag>
    enabled: false
    image: nms-ims-sidecar
    imageOverride: ""
    imageTag: latest
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
  # Kamailio CSCFs — hostNetwork IPs must exist on the node before Ready.
  ueImsSubnet: "14.1.1.0/25"
  upfN6Gateway: ""
  rtpengine:
    enabled: false
    ip: "127.0.0.1"
  pcscf:
    ip: "192.168.31.205"
    hostNetwork: true
    privileged: true
    bindPort: 5060
    ipsecClientPort: 5100
    ipsecServerPort: 6100
  icscf:
    ip: "192.168.31.206"
    hostNetwork: true
    bindPort: 4060
  scscf:
    ip: "192.168.31.207"
    hostNetwork: true
    bindPort: 6060
  cxGateway:
    enabled: true
    ip: "192.168.31.208"
    hostNetwork: true
    port: 3868
    image: ims-cx-gateway
    imageOverride: ""
    imageTag: latest
    # udr = oai_db SoT (Cx-on-UDR); legacy = pyHSS DB + seed
    cxSot: udr
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# --- External Data Network ---
extDn:
  enabled: true
  image: trf-gen-cn5g
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  imageTag: latest
  priorityClassName: firecell-prio-support
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  sidecar:
    # OFF by default until the image is published to imageRegistry. The
    # composed default below resolves to
    # ghcr.io/accelleran/.../nms-extdn-probe-sidecar:latest, which does not exist: the
    # image is built locally and imported into the node. A default-on sidecar
    # whose image cannot be pulled leaves the whole pod NotReady, and the
    # Service then drops the endpoint - turning a working ext-dn into an
    # unreachable one. Enable it explicitly, with imageOverride:
    #   --set extDn.sidecar.enabled=true \
    #   --set extDn.sidecar.imageOverride=nms-extdn-probe-sidecar:<tag>
    enabled: false
    image: nms-extdn-probe-sidecar
    imageOverride: ""
    imageTag: latest
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

# --- CN Agent (Firecell Core Network Agent) ---
# Kubernetes health uses cn-agent CoreServiceK8sHandler label selector app=<nf>,role=active.
# All core NF pod templates set role: active so /cn_agent_health can pass without manual kubectl label.
cnAgent:
  enabled: true
  image: cn-agent
  # Full image reference, winning over the registry + image + tag composition.
  # Every NF already has this; the agents did not, so an agent published
  # anywhere but imageRegistry could not be named at all.
  imageOverride: ""
  # cn-agent/fc-acs-agent ship on the NMS release line (v5.0.1.0), independent of
  # the 5GC global.pkgVersion. Unset imageTag falls back to global.pkgVersion.
  imageTag: "5.0.1.0"
  # DB migration target for cn_version env (must match cn-agent migration registry).
  dbVersion: "5.0.1"
  priorityClassName: firecell-prio-normal
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m
  # Agent-specific configuration
  config:
    logLevel: debug
    qosEnabled: true
    deployment: kubernetes    # docker-compose | kubernetes
    n3InterfaceName: eno8303  # later make it bond0

    # Platform-agnostic health check settings
    healthCheck:
      sbiCheck: true          # set false for infra-only health (no NF REST API probes)
      sbiProbeTimeoutS: 3     # per-NF SBI HTTP probe timeout in seconds
    # Packet capture client settings
    packetCapture:
      connectTimeoutS: 1.0
      readTimeoutS: 2.0
      retryCount: 1
      retryBackoffS: 0.2
      k8sServiceName: upf-packet-capture
      servicePort: 8095

    # Required when deployment: kubernetes
    kubernetes:
      namespace: ""           # leave empty to inherit global.namespace
      coreNfLabelSelector: "firecell.io/role=core-nf"
      podSelection: any       # any | active  (active requires role=active label on pods)
      execContainer: null     # null = K8s default container (single-container pods, k3s)
      # minHealthy: 1         # minimum ready pods per component
      # kubeconfigPath: ""    # leave unset when running inside the cluster
      components: {}          # per-component overrides, e.g:
                              #   oai-upf:
                              #     minHealthy: 2
                              #   oai-ausf:
                              #     podSelection: any
  backendIp: "nms-api.firecell-nms.svc.cluster.local"
  # Headless service used for packet-capture endpoint discovery across all UPF pods.
  packetCaptureAddress: "upf-packet-capture:8095"
  apiVictoriaMetricsUrl: "http://nms-api-victoria-metrics-dev.firecell-nms.svc.cluster.local:8430"
  redisCacheHost: "redis-cache.firecell-nms.svc.cluster.local"
  redisCachePort: 6799
  redisCacheDb: 0

# --- FC ACS Agent (TR-069 ACS endpoint) ---
fcAcsAgent:
  enabled: true
  image: fc-acs-agent
  # Full image reference, winning over the registry + image + tag composition.
  # Every NF already has this; the agents did not, so an agent published
  # anywhere but imageRegistry could not be named at all.
  imageOverride: ""
  imageTag: "5.0.1.0"   # NMS release line; see cnAgent.imageTag
  # Kubernetes Service type for fc-acs-agent (TR-069 must be reachable off-cluster).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config — and network.acsExternalIP
  # is no longer required.
  serviceType: LoadBalancer
  priorityClassName: firecell-prio-normal
  logLevel: info
  pmUploadDir: /tmp/pm_uploads
  database:
    host: mysql
    port: 3306
    user: root
    name: firecell_ran_tr069
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 1000m
  # Rendered into /app/config/config.yaml via tpl()
  config: |
    auth:
      enabled: true
      realm: "TR-069 ACS"
      algorithm: MD5
      qop: auth
      nonce_timeout: 3600

    credentials:
      username: cpe
      password: cpe

    initial_attach:
      vendors:
        cloudran:
          management:
            Device.ManagementServer.PeriodicInformEnable: true
            Device.ManagementServer.PeriodicInformInterval: 20
          perf_mgmt:
            Device.FAP.PerfMgmt.Config.1.Enable: true
            Device.FAP.PerfMgmt.Config.1.URL: "http://{{ .Values.network.acsExternalIP }}:7547/smallcell/FileUploadService"
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadInterval: 300
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadTime: "2026-02-17T14:25:00Z"
            Device.FAP.PerfMgmt.Config.1.Username: "cpe"
            Device.FAP.PerfMgmt.Config.1.Password: "cpe"
        askey:
          management:
            Device.ManagementServer.PeriodicInformEnable: true
            Device.ManagementServer.PeriodicInformInterval: 20
          perf_mgmt:
            Device.FAP.PerfMgmt.Config.1.Enable: true
            Device.FAP.PerfMgmt.Config.1.URL: "http://{{ .Values.network.acsExternalIP }}:7547/smallcell/FileUploadService"
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadInterval: 300
            Device.FAP.PerfMgmt.Config.1.PeriodicUploadTime: "2026-02-17T14:25:00Z"
            Device.FAP.PerfMgmt.Config.1.Username: "cpe"
            Device.FAP.PerfMgmt.Config.1.Password: "cpe"

    monitoring:
      ue_count_poll_interval_s: 10

    nms_address: "http://nms-api.firecell-nms.svc.cluster.local:5001"

# --- 5G Core Configuration (injected into shared ConfigMap) ---
coreConfig:
  logLevel: debug
  registerNf: "yes"
  httpVersion: 1

  # PLMN identity
  mcc: "001"
  mnc: "01"
  tac: "0x0001"

  # AMF configuration
  amf:
    name: "OAI-AMF"
    relativeCapacity: 30
    statisticsTimerInterval: 20
    emergencySupport: false
    enableSimpleScenario: "no"
    enableNssf: "no"
    enableSmfSelection: "no"
    releaseAllPduSessions: "no"
    enableIms: "yes"
    enableUdsf: "no"
    amfRegionId: "01"
    amfSetId: "001"
    amfPointer: "01"
    supportedIntegrityAlgorithms:
      - "NIA2"
    supportedEncryptionAlgorithms:
      - "NEA0"
      - "NEA1"
      - "NEA2"

  # NSSAI / Slices
  nssai:
    - sst: 1
      sd: "000001"

  # DNN configuration
  dnns:
    - dnn: "oai"
      pduSessionType: "IPV4"
      ipv4Subnet: "12.1.1.0/25"
    - dnn: "ims"
      pduSessionType: "IPV4V6"
      ipv4Subnet: "14.1.1.0/25"

  # DNS servers for UE
  dns:
    primaryIpv4: "8.8.8.8"
    secondaryIpv4: "8.8.8.8"

  # IMS P-CSCF
  ims:
    pcscfIpv4: "192.168.31.205"
    pcscfIpv6: "fe80::7915:f408:1787:db8b"

  # SMF configuration
  smf:
    ueMtu: 1452   # 1500 (backhaul) - 36 (GTP-U/UDP/IP overhead) = 1464; further clamped to ogstun MTU (1452)
                  # UE advertises this as its PDU session IP MTU → prevents uplink fragmentation at UPF
    useLocalSubscriptionInfo: "no"
    useLocalPccRules: "no"
    enableQer: "yes"
    enableUdsf: "no"
    enableUsageReporting: "no"
    # OAI key: enable_dl_pdr_in_pfcp_session_establishment (per-UPF under smf.upfs[].config)
    enableDlPdrInPfcpSessionEstablishment: "yes"
    # Per-UPF OAI key: enable_upf_wo_nf_discovery. "yes" => static upf_pool (skip NRF).
    # "no" => SMF discovers UPFs via NRF (dynamic UPF selection). Requires UPFs to register
    # to NRF successfully (SBI on cni0 for hostNetwork UPFs).
    enableUpfWoNfDiscovery: "yes"

  # SBI HTTP client timeout (ms) — default OAI is 3000; raise on busy labs to avoid NRF heartbeat false failures
  httpRequestTimeoutMs: 10000

  # NRF configuration
  nrf:
    heartbeat: 50
    suspendedNfInterval: 120

  # PCF configuration
  pcf:
    enablePolicyProvisioningApi: "yes"

  # UDM configuration
  udm:
    suciProfileId: 1
    suciKeyFile: /openair-udm/etc/a.key
    suciScheme: 1

  # Database
  database:
    host: mysql
    user: root
    password: ""              # REQUIRED — set via overlay (see values-lab-insecure-defaults.yaml)
    type: mysql
    name: oai_db
    generateRandom: true
    connectionTimeout: 10

  # UPF session subnets (used in o5gs-upf config templates)
  upfSessions:
    - subnet: "12.1.1.0/24"
      gateway: "12.1.1.1"
    - subnet: "14.1.1.0/24"
      gateway: "14.1.1.1"

# --- Network Policies ---
networkPolicies:
  enabled: true
  # Whether to allow ingress from firecell-nms namespace (defaults to true when cnAgent/fcAcsAgent enabled)
  allowNmsNamespace: true
  nmsNamespace: firecell-nms
  allowedNamespaces: []
  # CIDRs allowed to reach core NFs from outside the cluster (RAN, gNB, test hosts)
  # Example: ["10.218.184.0/24"] to allow the Multipass lab subnet
  allowedExternalCIDRs: []

# --- Helm Lifecycle Hooks (Standalone Atomic Install / Upgrade / Uninstall) ---
hooks:
  enabled: true
  preFlight:
    enabled: true
    image: ""
    backoffLimit: 1
    timeoutSeconds: 120
    requireSctp: true
    verifyGateway: true
  postFlight:
    enabled: true
    image: ""
    backoffLimit: 1
    timeoutSeconds: 300
    retries: 30
    intervalSeconds: 4
    verifyNrfRegistrations: true
    verifyPfcpAssociation: true
  postDelete:
    enabled: true
    image: ""
    timeoutSeconds: 90

# --- Image Pull Secret ---
# Pre-create before helm install:
#   kubectl create secret docker-registry ghcr-regcred \
#     --docker-server=ghcr.io \
#     --docker-username=<user> --docker-password=<token> \
#     -n firecell-core
