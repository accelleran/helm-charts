# Firecell 5G Core - Simplified (non-HA) Deployment
# This values file configures a single-replica deployment of all 5GC NFs.

global:
  # Namespace for all resources
  namespace: firecell-core

  # GHCR — pre-create ghcr-regcred secret before helm install
  imageRegistry: ghcr.io/accelleran
  # The busybox used by every initContainer in this chart. Composed from
  # imageRegistry when unset; name it in full to pull it from anywhere else.
  busyboxImage: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-regcred

  # Package version — used as the image tag suffix (images tagged as v<pkgVersion>)
  pkgVersion: "1.0.0"

  # Timezone for all NF containers
  timezone: Europe/Paris

# --- Namespace Management ---
# Set create: false when using `helm upgrade --install --create-namespace` or when
# the namespace is pre-created externally (e.g., to hold registry pull secrets).
namespace:
  create: false
  keepOnUninstall: true

# --- Network / MetalLB ---
# MetalLB is optional. templates/metallb-pool.yaml is rendered only when
# metallb.enabled is true (AMF/ACS LoadBalancer VIPs for an off-cluster gNB).
# Set metallb.enabled: false when the cluster has no MetalLB.
#
# CP/UP separation model:
#   cp.interface (e.g. eth0 / bond0) — control plane NIC: AMF NGAP, SBI
#   up.interface (e.g. eth1 / bond1) — user plane NIC:  UPF GTP-U (N3)
#
# Both can point to the same interface for single-NIC lab setups,
# but assign IPs from different ranges so MetalLB distinguishes pools.
network:
  metallb:
    enabled: true
    cp:
      # Override via site/environment values (documentation ranges as placeholders).
      poolRange: "192.0.2.101-192.0.2.110"
      l2Interface: eth0          # NIC facing gNB/RAN control-plane network
    up:
      # When false, skip MetalLB UP pool (OAI hostNetwork N3 on a physical IP, no LB pool).
      enabled: true
      poolRange: "198.51.100.101-198.51.100.110"
      l2Interface: eth1          # NIC facing gNB GTP-U / data network
    ingress:
      poolRange: "192.0.2.100/32"
      l2Interface: eth0
  # oai-amf Service type. Keep LoadBalancer when the gNB is off-cluster and
  # reaches N2 through a VIP. Set ClusterIP for a pod-networked RAN, where the
  # gNB resolves the headless oai-amf-n2 Service and NGAP is pod-to-pod;
  # amfExternalIP is then unused and the address can be returned to the pool.
  amfServiceType: LoadBalancer

  # External IPs — always override from sites/*/site.yaml generated values
  amfExternalIP: "192.0.2.101"
  acsExternalIP: "192.0.2.102"
  upfExternalIP: "198.51.100.101"

# --- Database (MySQL 8.0 single-node) ---
# For production, consider switching to Percona XtraDB Cluster operator.
# Credentials: set via --set / site overlay. Lab-only insecure defaults:
#   environments/values-lab-insecure-defaults.yaml
mysql:
  enabled: true
  image: mysql:8.0
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  rootPassword: ""            # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  database: oai_db
  user: ""                    # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  password: ""                # REQUIRED — set via overlay or --set (preserved on upgrade via lookup)
  keepSecretOnUninstall: false
  storage:
    size: 6Gi
    storageClass: ""          # Empty = use cluster default
  resources:
    requests:
      memory: 1Gi
      cpu: 600m
    limits:
      memory: 2Gi
      cpu: 1000m

# --- UDSF (Unstructured Data Storage Function) + Redis backing store ---
# Disabled by default. Enable via environments/values-stateless.yaml (Phase 3 stateless overlay).
udsf:
  enabled: false
  image: firecell-udsf
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  # e.g. imageOverride: ghcr.io/accelleran/firecell-udsf:v5.1.0.2
  imageOverride: ""
  serviceName: oai-udsf
  host: oai-udsf
  sbiPort: 8080
  healthPath: /nudsf-data-mgmt/v1/healthz
  redis:
    image: redis:7-alpine
    # Full image reference, winning over the verbatim image above.
    # Same escape hatch every workload has: without it a registry mirror
    # or retag cannot be named.
    imageOverride: ""
    port: 6379
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 1000m
  fcaps:
    enabled: false
    mnsPort: 9091
    intentMode: configmap
    datastore:
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Must equal nf_instance.instance_name for the UDSF NE in the NMS. A
      # mismatch mounts EMPTY and the UDSF reverts to its seed with nothing
      # logged: `optional: true` cannot tell a missing ConfigMap from a
      # misnamed one.
      name: oai-udsf-cm-intent
      optional: true
    # No seedConfigPath: the UDSF is configured by environment
    # variables, not a YAML file, so there is no seed document to
    # snapshot before the overlay.


# --- NRF (NF Repository Function) ---
nrf:
  enabled: true
  image: oai-nrf
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
