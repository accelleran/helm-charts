# --- AMF (Access and Mobility Management Function) ---
amf:
  enabled: true
  image: oai-amf
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  # Kubernetes Service type for oai-amf (NGAP must be reachable off-cluster).
  # Empty falls back to network.amfServiceType ("LoadBalancer" by default).
  # Anything but LoadBalancer drops the MetalLB annotations below — a pool/VIP
  # annotation on a ClusterIP Service is dead config.
  serviceType: ""
  # Optional in-chart headless SCTP Service (oai-amf-n2) for pod-networked RANs
  headlessN2:
    enabled: false
    serviceName: oai-amf-n2
    publishNotReadyAddresses: true
  priorityClassName: firecell-prio-crit
  command:
    - /openair-amf/bin/oai_amf
    - -c
    - /openair-amf/etc/config.yaml
    - -o
  configMountPath: /openair-amf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: ngap
      containerPort: 38412
      protocol: SCTP
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m
  # --- FCAPS Configuration Management (CM PoC) ---
  # Off by default: the stock image has no FCAPS and would expose a dead port.
  fcaps:
    enabled: false
    mnsPort: 9091
    # Where the NF's intent document comes from.
    #
    #   pvc        the NF owns a writable file (contract 1.0.6). Intent is
    #              per-pod and dies with it: lost on restart if the volume
    #              goes, and divergent the moment there is more than one
    #              replica, since only the active pod is ever PATCHed.
    #   configmap  the NMS owns the document and the NF mounts it read-only
    #              (contract 1.0.7). Durable in etcd, identical for every
    #              replica, and visible to GitOps.
    intentMode: pvc
    datastore:
      mountPath: /openair-amf/state
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Written by the NMS on every apply. Named for the NE, not the
      # deployment, because intent belongs to the network element.
      name: oai-amf-cm-intent
      # The pod must start before the NMS has ever applied anything, so a
      # missing ConfigMap is an empty mount rather than ContainerCreating
      # forever. The NF then boots on the seed alone, which is correct: no
      # intent has been expressed yet.
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet. Empty disables the digest.
    seedConfigPath: /openair-amf/etc/config.yaml

# --- SMF (Session Management Function) ---
smf:
  enabled: true
  image: oai-smf
  # Full image reference, winning over the registry + image + tag composition.
  # Same escape hatch every NF has: the composition glues on imageRegistry,
  # so an image published anywhere else cannot be named without it.
  imageOverride: ""
  priorityClassName: firecell-prio-high
  command:
    - /openair-smf/bin/oai_smf
    - -c
    - /openair-smf/etc/config.yaml
    - -o
  configMountPath: /openair-smf/etc/config.yaml
  ports:
    - name: sbi
      containerPort: 80
      protocol: TCP
    - name: http
      containerPort: 8080
      protocol: TCP
    - name: n4
      containerPort: 8805
      protocol: UDP
  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m
  # Multus secondary NIC for PFCP N4 — gives SMF a stable IP on the CP network
  # so UPFs (in-cluster and external) always see a consistent PFCP peer identity.
  # Requires Multus CNI on the cluster (disabled by default).
  multus:
    enabled: false
    cniType: ipvlan        # ipvlan (recommended for single-NIC) or macvlan
    mode: l3s              # L3S: host (hostNetwork UPF) can reach slave; ARP passthrough for external UPFs
    masterInterface: eth0  # parent NIC on CP network
    nadName: smf-n4-net    # NetworkAttachmentDefinition name
    subnetPrefix: 24       # prefix length for the secondary NIC address
  # PFCP N4 interface inside the SMF pod.
  # Set to "net1" when Multus is enabled (Multus names secondary NICs net1, net2, ...).
  n4Interface: eth0
  # Time before Deployment marks ProgressDeadlineExceeded (image pull + Multus + NRF wait).
  progressDeadlineSeconds: 1200
  # Explicit PFCP bind IP — must match the Multus secondary NIC IP when Multus is enabled.
  # When set: UPF connects to this IP directly (no ClusterIP SNAT = no PFCP split-peer).
  # When empty: UPF uses ClusterIP DNS (subject to SNAT — known PFCP instability).
  n4IP: ""
  # Host PFCP (optional): same pattern as OAI UPF — hostNetwork pod, SBI on cni0, N4 on
  # hostPfcpMacvlan @ hostPfcpIP/n4IP. Disables Multus. Use when UPF uses hostNetwork on
  # the same CP parent (eno1); see environments/values-smf-pfcp-hostnet.yaml.
  hostNetwork: false
  sbiInterface: cni0
  # MnS/FCAPS (:9091) bind interface. Empty => falls back to sbiInterface. Set per-instance
  # (e.g. the PFCP macvlan) so N hostNetwork UPFs on one host don't collide on the shared SBI IP.
  # Requires a FCAPS image that reads nfs.<nf>.mns.interface_name.
  mnsInterface: ""
  # k3s cni0 bridge IP where hostNetwork SMF listens for SBI (Service Endpoints when hostNetwork).
  sbiClusterIP: "10.42.0.1"
  hostPfcpMacvlan: smf-n4-mac
  hostPfcpIP: ""
  pfcpParentInterface: ""
  fcaps:
    enabled: false
    mnsPort: 9091
    # Where the NF's intent document comes from. Same two modes as the AMF —
    # see amf.fcaps.intentMode for what each one costs.
    #
    # The SMF has no reason to run `pvc`: the AMF kept it for the 1.0.6 contract
    # it shipped with, and the SMF's CM path was written against 1.0.7 from the
    # start. `pvc` is here so the two NFs are configured the same way, not
    # because it is a supported deployment.
    intentMode: configmap
    datastore:
      # /var/lib/firecell/cm is the fcaps-common default, so the NF finds its
      # intent with no FCAPS_CM_DATASTORE at all. The AMF's /openair-amf/state
      # predates that default and is kept for its existing volumes.
      mountPath: /var/lib/firecell/cm
      file: cm.json
      size: 128Mi
      storageClassName: local-path
    intentConfigMap:
      # Written by the NMS on every apply, and named from
      # nf_instance.instance_name. If this name and the NMS's disagree the mount
      # is EMPTY and the NF silently reverts to its seed — `optional: true`
      # cannot tell a missing ConfigMap from a misnamed one.
      name: oai-smf-cm-intent
      optional: true
    # Hashed raw for seedSha256 — the only signal covering parameters no
    # capability manifest models yet. Empty disables the digest.
    seedConfigPath: /openair-smf/etc/config.yaml

