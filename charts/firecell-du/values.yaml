# Firecell RAN DU - one Ocudu O-RAN 7.2 DU per release.
#
# Install one release per DU next to a firecell-cu release (same namespace by
# default). Values the CU and its DUs must agree on (global.image, gnb.*) belong
# in one shared site file passed to every release; only the per-DU differences
# go in the DU's own file.

global:
  # -- Namespace for every object. Empty uses the release namespace.
  namespace: ""
  # -- Ocudu runtime image built with -DENABLE_MPLANE=ON and the O1 entrypoint
  # (/usr/local/bin/entrypoint-o1.sh).
  image: docker.io/accelleran/ran:0.1.0
  # -- Pull policy for the Ocudu image. Use Never for images imported into containerd.
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets for every pod.
  imagePullSecrets: []
  # -- Default nodeSelector. `nodeSelector` overrides it.
  nodeSelector: {}
  # -- Default tolerations. `tolerations` overrides them.
  tolerations: []

# gNB identity. Must be identical in the CU release and every DU release.
gnb:
  # -- gNB-ID.
  gnbId: 1
  # -- gNB-ID length in bits.
  gnbIdBitLength: 22
  # -- Serving PLMN (MCC+MNC).
  plmn: "00101"
  # -- Tracking area code.
  tac: 1
  # -- Slices. sst/sd go to the DU slicing list; schedCfg, when set, becomes the per-slice sched_cfg.
  slices:
    - sst: 1
      sd: 1
      schedCfg:
        min_prb_policy_ratio: 15
        max_prb_policy_ratio: 100
        priority: 10

# -- F1-C target. Empty resolves to cu-cp.<namespace>.svc.cluster.local (the firecell-cu Service).
cuCpAddress: ""

# -- DU name: Deployment, Service (O1), ConfigMaps, DPDK file prefix. Empty uses the release name.
name: ""
# -- gNB-DU ID (gnb_du_id). Required; unique among the DUs of one CU.
duId: ""
# -- Binary started by the launcher. Empty: odu_split_7_2 (ru.split "7.2") or the dynamic odu (ru.split "8").
binary: ""
# -- Image override (defaults to global.image).
image: ""
# -- nodeSelector override (defaults to global.nodeSelector).
nodeSelector: {}
# -- Tolerations override (defaults to global.tolerations).
tolerations: []
# -- 2 MiB hugepages for this DU (requests = limits). Only used with ofh.mode dpdk.
hugepages2Mi: 2Gi
# -- Memory request.
memory: 1Gi
# -- Seconds Kubernetes waits after SIGTERM before SIGKILL. An M-plane DU switches the O-RU
# carriers off at stop and needs up to the carrier ready timeout + 10 s for that (Benetel and
# Eridan default 90 s -> 100 s, Comba 30 s -> 40 s); 150 adds margin. A DU that is killed first
# leaves the O-RU radiating. With CBRS the stop takes
# longer: max(gate_close_timeout_ms, carrier ready timeout + 5 s) + 25 s + 1 s per cell, about 120 s + 1 s
# per cell with the Eridan default; raise this then. The chart checks only the M-plane bound, without CBRS.
terminationGracePeriodSeconds: 150
cpus:
  # -- OFH timing thread CPU. Required with ru.split "7.2".
  timing: ""
  # -- OFH TX/RX thread CPU(s), comma list. Required with ru.split "7.2".
  txrx: ""
  # -- Radio (lower PHY) thread CPUs, comma list (cell_affinities ru_cpus). Required with ru.split "8".
  ru: ""
  # -- Main pool CPUs (comma list, ranges allowed). Required. The build reserves 3 CPUs in the mask.
  pool: ""
  # -- DPDK EAL lcores CPU set (hal.eal_args --lcores (0-1)@(...)). Required with ofh.mode dpdk.
  ealLcores: ""
  # -- Main pool worker threads. Ocudu starts min(nofThreads, len(pool) - 3).
  nofThreads: 3
cell:
  sectorId: 1
  pci: 1
  dlArfcn: 663680
  band: 77
  bandwidthMHz: 100
  commonScs: 30
  antennasDl: 4
  antennasUl: 4
# Radio unit. These are the boot defaults: a value the NMS sets over O1 (ru-type, radio-unit/sdr, tx-power) is
# persisted by the DU and overrides them at the next start.
ru:
  # -- Pod shape. "7.2": O-RAN 7.2 O-RU over the `ofh` block (production: DPDK VF; lab: kernel socket to the
  # Amarisoft emulator). "8": split 8 radio through ru_sdr (AW2S Swallow RRH, USB B210 or ZMQ).
  split: "7.2"
  # -- Radio of the cell, checked against `split`. 7.2: benetel, comba or eridan (M-plane profile and timing profile), liteon, vvdn or mti (timing profile only), simulator (an O-RU simulator such as the Amarisoft one: no M-plane, no identity, the generic timing and compression; the DU is told its type). 8: aw2s
  # (Swallow card, host network namespace), b210 (USB 3 through UHD) or zmq (no hardware).
  vendor: benetel
  sdr:
    aw2s:
      # -- true: the DU writes the Swallow file (rf_config) at every start from the cell and these values, and the
      # chart renders no srate, bw=, nrb_dl= or oversampling. false: static-file mode, the file in configDir is
      # yours and the chart renders srate, bw= and nrb_dl= from the values below.
      generate: false
      # -- Device library loaded by the aw2s driver (device_args lib=).
      lib: liboai_device.so
      # -- Host directory with the Swallow libraries the image does not carry (libswallow.so, libratcm.so), mounted read-only. The device library (lib) is taken from the image first; a copy here is only a fallback.
      hostLibDir: /usr/local/lib
      # -- Host directory with the Swallow RU XML. The DU hands the file to the vendor library (device_args rf_config). With generate it is mounted
      # read-write and the DU overwrites the file.
      configDir: ""
      # -- Swallow RU XML in configDir (device_args rf_config=).
      rfConfigFile: ""
      # -- RRH model for generate: panther (33 dBm), jaguar (40 dBm) or neo (37 dBm). Sets the sample rate and the
      # power limit.
      sku: panther
      # -- Antennas for generate: {id, masterPort, antennaPort} per antenna of the cell. Master ports 0 to 3 are
      # the CPRI ports of the Swallow card; antenna ports restart at 0 on each RRH.
      antennas: []
      # -- IQ TX shift (device_args iq_txshift): IQ amplitude divided by 2^n.
      iqTxShift: 4
      # -- IQ compression for generate: none or large.
      iqCompression: none
      # -- Swallow time offset in microseconds (generate).
      timeOffsetUs: 0
      # -- Sample rate in MHz (ru_sdr srate), static-file mode only. 122.88 for 100 MHz, 61.44 for 40-50 MHz, 30.72 for 20 MHz.
      srateMHz: 122.88
      # -- DL PRBs (device_args nrb_dl), static-file mode only. Empty: max for cell.bandwidthMHz at 30 kHz SCS (273 for 100 MHz).
      nrbDl: ""
      txGain: 0
      rxGain: 75
      # -- Clock and sync sources (ru_sdr clock/sync), e.g. internal, external, gpsdo. Empty: DU default.
      clock: ""
      sync: ""
      # -- Extra comma-separated device_args, appended in static-file mode and with generate.
      extraArgs: ""
      # -- Lower PHY execution profile (expert_execution.threads.lower_phy.execution_profile).
      lowerPhyProfile: triple
    b210:
      # -- Serial of the B210 (device_args serial=). Empty: the first device UHD finds.
      serial: ""
      # -- Sample rate in MHz: 23.04 for 20 MHz, 46.08 for 40 MHz.
      srateMHz: 23.04
      txGain: 50
      rxGain: 60
      # -- Mount /dev/bus/usb from the node into the pod.
      usb: true
      # -- Extra comma-separated device_args.
      extraArgs: ""
      lowerPhyProfile: dual
    zmq:
      # -- Sample rate in MHz.
      srateMHz: 23.04
      txGain: 50
      rxGain: 60
      # -- device_args, e.g. tx_port=tcp://*:2000,rx_port=tcp://localhost:2001.
      args: "tx_port=tcp://*:2000,rx_port=tcp://localhost:2001"
      lowerPhyProfile: blocking
txPower:
  # -- Boot default of the NMS leaf tx-power/tx-power-dbm, per antenna port, in dBm. Only with ru.sdr.aw2s.generate
  # (the DU writes it into the Swallow file and refuses a value above the RRH model's maximum). Unset: the DU's default.
  dbm: null
ofh:
  # -- How the DU sends fronthaul: dpdk (SR-IOV VF on vfio-pci, hugepages) or socket (kernel raw socket on a
  # host netdev that Multus host-device moves into the pod, e.g. a veth toward an emulated RU on the same node).
  mode: dpdk
  # -- PCI address of the SR-IOV VF bound to vfio-pci. Required with mode dpdk.
  vfPciAddr: ""
  # -- Host netdev for mode socket (e.g. veth-du1). It keeps its name inside the pod and goes back to the
  # host when the pod stops. Set its MTU and offloads on the host. Required with mode socket.
  interface: ""
  duMac: ""
  ruMac: ""
  # -- C-plane VLAN tag. 0 sends untagged.
  vlanCp: 0
  # -- U-plane VLAN tag. 0 sends untagged.
  vlanUp: 0
  dlPorts: [0, 1, 2, 3]
  ulPorts: [0, 1]
  prachPorts: [4, 5]
  promiscuous: false
  # -- Deprecated: use ru.vendor. When set (benetel | comba | eridan) it wins over ru.vendor for the M-plane profile.
  ruType: ""
  # -- true: the DU applies the Open Fronthaul timing windows and IQ compression of the O-RU type (ru.vendor: benetel, comba,
  # eridan, liteon, vvdn or mti; the DU's table) to every key that is not set in ofh.ruOfh. The chart then renders
  # the vendor in the cell and none of ofh.genericTiming. false (default): the generic set below, as before.
  vendorProfile: false
  # -- The generic timing windows and compression every OFH DU got before the per-vendor profiles. Rendered unless
  # vendorProfile is true. Keys set in ofh.ruOfh win.
  genericTiming:
    t1a_max_cp_dl: 336
    t1a_min_cp_dl: 285
    t1a_max_cp_ul: 336
    t1a_min_cp_ul: 285
    t1a_max_up: 300
    t1a_min_up: 80
    ta4_max: 500
    ta4_min: 50
    compr_method_ul: bfp
    compr_bitwidth_ul: 9
    compr_method_dl: bfp
    compr_bitwidth_dl: 9
    compr_method_prach: bfp
    compr_bitwidth_prach: 9
  # -- Raw ru_ofh keys merged into ru_ofh. A timing or compression key set here wins over both the generic set and the vendor profile.
  ruOfh:
    ru_bandwidth_MHz: 100
    is_prach_cp_enabled: true
    enable_ul_static_compr_hdr: true
    enable_dl_static_compr_hdr: true
    iq_scaling: 1.0
f1u:
  network:
    # -- Put F1-U (GTP-U toward the CU-UP) on a macvlan of a host NIC instead of the pod network. Use when the CU-UP runs on another node and the pod network between the nodes is slower than the user plane.
    enabled: false
    # -- macvlan (F1-U over a host NIC toward a CU-UP on another node) or bridge (veth on a Linux bridge, for a
    # CU-UP on the same node: all-in-one). RPS works only on the bridge veth.
    cniType: macvlan
    # -- Host interface the F1-U macvlan sits on (link toward the CU-UP node), or the Linux bridge (cniType bridge, e.g. br-f1u).
    master: ""
    # -- DU F1-U address with prefix. The IP part is the F1-U bind address.
    cidr: ""
    # -- RPS CPU mask, quoted hex (e.g. "c00000" = CPUs 22,23), set on the f1u0 veth rx queues at start. Moves
    # the receive softirq for DL GTP-U off the sending CU-UP worker. Needs cniType bridge. Empty leaves RPS off.
    rpsCpus: ""
  # -- F1-U bind address when f1u.network is off. Empty: the pod IP (the node IP with ru.vendor aw2s, which
  # runs in the host network). With aw2s next to a CU-UP on the same node, use a host address on br-f1u.
  bindAddress: ""
mplane:
  # -- Run the M-plane NETCONF client toward the O-RU (needs an M-plane build).
  enabled: false
  # -- Host interface the M-plane macvlan sits on. One O-RU per interface.
  parentInterface: ""
  # -- DU M-plane address with prefix (call-home target the RU learns via DHCP).
  duCidr: ""
  callHomePort: 4334
  sshUser: oranbenetel
  # -- SSH password rendered into a chart Secret. Ignored when existingSecret is set.
  sshPassword: ""
  # -- Existing Secret holding the password under key ssh-password. The DU reads it
  # at start, so restart the DU after changing that Secret.
  existingSecret: ""
  txArrayGainDb: 27.0
  # -- Raw mplane keys merged over the generated mplane section.
  extra:
    supervision_enabled: true
    supervision_watchdog_period_s: 23
    copy_to_startup_after_provision: false
    require_oper_state_enabled: false
    log_xml: false
    mplane_log_filename: /tmp/logs/mplane.log
    cache_path: /tmp/logs/mplane_cache
    ptp_lock_timeout_ms: 60000
    radiate_gate_bypass_on_timeout: false
  dhcp:
    # -- Serve the O-RU its M-plane lease from a dnsmasq sidecar on the macvlan.
    # Off by default: a Benetel RU went silent after taking this lease, so
    # serve DHCP from the node unless the sidecar is proven with your RU.
    enabled: false
    image: docker.io/4km3/dnsmasq:2.90-r3
    # -- Fixed address handed to ofh.ruMac.
    ruIp: ""
    leaseTime: 12h
    # -- Router option. Empty omits it.
    router: ""
    # -- O-RAN option 43 sub-option 130 (controller FQDN). Empty omits it.
    controllerFqdn: ""
o1:
  # -- Run netopeer2/sysrepo (O1 NETCONF server for the NMS) in the DU container.
  enabled: false
  port: 830
  # -- Host directory kept across restarts (O1 overlay and NETCONF host key). Empty uses /var/lib/firecell/ocudu/<name>.
  statePath: ""
  yangSearchPath: /usr/local/yang
  restartOnColdCommit: false
  # -- netopeer2 log level: error, warning, info (a few [INF] lines per NMS request) or debug; 0-3 also accepted. Images built before the entrypoint read NETCONF_VERBOSITY always log at info.
  netconfVerbosity: warning
  ueMetrics:
    # -- Publish per-UE PM (/ocudu-performance gnb-du-id and ue-metrics) for the NMS UE dashboard. Needs o1.enabled. Turns on scheduler metrics (metrics.layers.enable_sched).
    enabled: true
    # -- Report windows kept per cell. Must cover the NMS poll interval plus timeout, in du_report_period units (1-60).
    historyWindows: 40
    # -- Maximum UE rows per cell and window.
    maxUes: 256
resources: {}
# -- Raw Ocudu DU YAML merged over the generated config.
extraConfig:
  cell_cfg:
    ssb:
      ssb_period: 10
      ssb_block_power_dbm: -11
      pss_to_sss_epre_db: 0
    ul_common:
      p_max: 23
    pdsch:
      mcs_table: qam256
      max_pdschs_per_slot: 6
      max_alloc_attempts: 8
      olla_target_bler: 0.1
      olla_max_cqi_offset: 20
      olla_cqi_inc_step: 0.05
      dc_offset: center
    pusch:
      mcs_table: qam64
      min_k2: 3
      olla_target_bler: 0.1
      olla_snr_inc_step: 0.05
      olla_max_snr_offset: 20
      p0_nominal_with_grant: -76
    pucch:
      min_k1: 3
      sr_period_ms: 40
      p0_nominal: -96
    prach:
      preamble_trans_max: 200
      power_ramping_step_db: 2
      prach_config_index: 159
      prach_frequency_start: 11
    tdd_ul_dl_cfg:
      dl_ul_tx_period: 10
      nof_dl_slots: 7
      nof_dl_symbols: 6
      nof_ul_slots: 2
      nof_ul_symbols: 4
    srs:
      period_ms: 40
    scheduler:
      policy:
        qos_sched:
          pdb_enabled: true
          gbr_enabled: true
  expert_phy:
    max_request_headroom_slots: 3
    pusch_dec_max_iterations: 4
    max_proc_delay: 5
  expert_execution:
    threads:
      upper_phy:
        pdsch_processor_type: flexible
      ofh:
        enable_busy_waiting: true
  log:
    # stdout, so the node's log collector (firecell-node-logs) keeps the DU
    # log across pod restarts. A file under /tmp/logs (an emptyDir, which
    # still holds the pcaps and the M-plane log) is lost with the pod.
    filename: stdout
    all_level: warning
    du_level: info
    f1ap_level: info
    mac_level: info
    rlc_level: warning
    f1u_level: info
    gtpu_level: warning
    hex_max_size: 0
    high_latency_diagnostics_enabled: false
  metrics:
    # Off: with the log on stdout, the per-second console metrics table would
    # fill the node's log store. The NMS already gets these metrics over O1 PM.
    autostart_stdout_metrics: false
    enable_log: false
    # enable_sched is generated from o1.ueMetrics (true when per-UE PM is on); set it here to override.
    layers:
      enable_rlc: false
      enable_mac: true
    periodicity:
      du_report_period: 1000
  pcap:
    mac_enable: false
    f1ap_enable: false
    f1u_enable: false
  o2:
    enabled: true
    bind_addr: 0.0.0.0
    port: 9090

preflight:
  # -- Pre-install/pre-upgrade Job on the DU node: VF on vfio-pci and hugepages (dpdk), the OFH netdev (socket), or the Swallow host libraries (the image device library must resolve against them), the Swallow XML and the RMU socket (aw2s); F1-U bridge, M-plane parent NIC.
  enabled: true
  # -- Image for the check (needs bash and, for aw2s, ldd and the DU's /usr/local/lib/aw2s). Empty uses the DU image.
  image: ""
  timeoutSeconds: 120

# NMS access: ServiceAccount nms of the firecell-nms release.
nms:
  # -- Let the NMS read pods here, and restart, stop and start this DU's
  # Deployment.
  rbac: true
  # -- Namespace of the firecell-nms release.
  namespace: firecell-nms
