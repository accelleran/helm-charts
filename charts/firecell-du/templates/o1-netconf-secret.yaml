{{- $i := include "firecell-du.inst" . | fromJson }}
{{- if $i.o1.enabled }}
{{- $labels := printf "app: %s\n%s" $i.name (include "firecell-du.labels" .) }}
{{- include "firecell-du.o1NetconfSecretObject" (dict "netconf" $i.o1.netconf "name" $i.name "namespace" (include "firecell-du.namespace" .) "labels" $labels) }}
{{- end }}
