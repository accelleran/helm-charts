{{- $i := include "firecell-du.inst" . | fromJson }}
{{- $ns := include "firecell-du.namespace" . }}
{{- $img := include "firecell-du.image" (dict "root" $ "image" $i.image) }}
{{- $o2Port := dig "o2" "port" 9090 $i.extraConfig }}
{{- $dpdk := eq (include "firecell-du.dpdk" $i) "true" }}
{{- $aw2s := eq (include "firecell-du.ruType" $i) "aw2s" }}
{{- $sdr := eq (include "firecell-du.sdr" $i) "true" }}
{{- $b210 := eq (include "firecell-du.ruType" $i) "uhd" }}
{{- $generate := eq (include "firecell-du.aw2sGenerate" $i) "true" }}
{{- $networks := list }}
{{- if eq (include "firecell-du.ofhSocket" $i) "true" }}
{{- $networks = append $networks (dict "name" (printf "%s-ofh" $i.name) "namespace" $ns "interface" (toString $i.ofh.interface)) }}
{{- end }}
{{- if $i.mplane.enabled }}
{{- $networks = append $networks (dict "name" (printf "%s-mplane" $i.name) "namespace" $ns "interface" "mplane0") }}
{{- end }}
{{- if dig "network" "enabled" false ($i.f1u | default dict) }}
{{- $networks = append $networks (dict "name" (printf "%s-f1u" $i.name) "namespace" $ns "interface" "f1u0") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $i.name }}
  namespace: {{ $ns }}
  labels:
    app: {{ $i.name }}
    {{- include "firecell-du.labels" . | nindent 4 }}
  annotations:
    {{- include "firecell-du.claims" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # The OFH device (VF or host netdev), hugepages and pinned CPUs are exclusive: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $i.name }}
  template:
    metadata:
      labels:
        app: {{ $i.name }}
        {{- include "firecell-du.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "firecell-du.duConfig" (dict "root" $ "inst" $i) | sha256sum }}
        {{- if and $i.mplane.enabled (not $i.mplane.existingSecret) }}
        # The launcher reads the password once at start; roll the pod when it changes.
        checksum/mplane-secret: {{ printf "%s/%s" (include "firecell-du.mplaneSecretName" $i) (toString $i.mplane.sshPassword) | sha256sum }}
        {{- end }}
        {{- with $networks }}
        k8s.v1.cni.cncf.io/networks: {{ toJson . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $i.terminationGracePeriodSeconds | int }}
      {{- include "firecell-du.scheduling" (dict "root" $ "nodeSelector" $i.nodeSelector "tolerations" $i.tolerations) | trim | nindent 6 }}
      {{- if $aw2s }}
      # liboai_device.so talks to the host Radio Management Unit and the Swallow card
      # netdevs (swa0p*), which stay in the host network namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      initContainers:
        - name: wait-cu-cp-f1
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - bash
            - -c
            - |
              for i in $(seq 1 90); do
                getent hosts {{ include "firecell-du.cuCpAddress" . }} >/dev/null 2>&1 && exit 0
                sleep 2
              done
              echo "timeout resolving {{ include "firecell-du.cuCpAddress" . }} for F1-C" >&2
              exit 1
      containers:
        - name: odu
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            {{- if $i.o1.enabled }}
            # Starts netopeer2/sysrepo (O1), then execs the launcher.
            - /usr/local/bin/entrypoint-o1.sh
            {{- end }}
            - /bin/bash
            - /opt/firecell/du-launcher.sh
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DU_BINARY
              value: {{ include "firecell-du.binary" $i | quote }}
            - name: DU_CPUS
              value: {{ include "firecell-du.allCpus" $i | quote }}
            - name: DU_POOL_CPUS
              value: {{ $i.cpus.pool | toString | quote }}
            - name: O1_ENABLED
              value: {{ $i.o1.enabled | toString | quote }}
            - name: NETCONF_VERBOSITY
              value: {{ include "firecell-du.netconfVerbosity" $i.o1.netconfVerbosity | quote }}
            {{- if $sdr }}
            # The DU pins its own radio and pool threads (ru_cpus, main_pool_cpus); a
            # taskset wrapper would drag its housekeeping threads onto those cores.
            - name: DU_SELF_PIN
              value: "true"
            {{- end }}
            {{- if $aw2s }}
            - name: LD_LIBRARY_PATH
              value: /host-aw2s:/usr/local/lib/aw2s:/usr/local/lib
            {{- end }}
            {{- if eq (include "firecell-du.ofhSocket" $i) "true" }}
            - name: OFH_INTERFACE
              value: {{ $i.ofh.interface | toString | quote }}
            {{- end }}
            {{- with dig "network" "rpsCpus" "" ($i.f1u | default dict) }}
            - name: F1U_RPS_CPUS
              value: {{ . | quote }}
            {{- end }}
            {{- if $i.mplane.enabled }}
            - name: MPLANE_SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "firecell-du.mplaneSecretName" $i }}
                  key: ssh-password
            {{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: [SYS_NICE, SYS_PTRACE, NET_ADMIN]
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - curl -sf -m 2 http://127.0.0.1:{{ $o2Port }}/o2/health >/dev/null
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          resources:
            {{- $res := $i.resources | default dict }}
            requests:
              {{- if $dpdk }}
              hugepages-2Mi: {{ $i.hugepages2Mi }}
              {{- end }}
              memory: {{ $i.memory }}
              {{- with $res.requests }}
              {{- toYaml (omit . "hugepages-2Mi" "memory") | nindent 14 }}
              {{- end }}
            {{- $lim := omit ($res.limits | default dict) "hugepages-2Mi" }}
            {{- if or $dpdk $lim }}
            limits:
              {{- if $dpdk }}
              hugepages-2Mi: {{ $i.hugepages2Mi }}
              {{- end }}
              {{- with $lim }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config/du.yml
              subPath: du.yml
            - name: launcher
              mountPath: /opt/firecell
            - name: logs
              mountPath: /tmp/logs
            {{- if $dpdk }}
            - name: hugepages
              mountPath: /dev/hugepages
            {{- end }}
            {{- if and $b210 (dig "sdr" "b210" "usb" true $i.ru) }}
            - name: usb
              mountPath: /dev/bus/usb
            {{- end }}
            {{- if $aw2s }}
            - name: aw2s-libs
              mountPath: /host-aw2s
              readOnly: true
            - name: aw2s-config
              mountPath: /root/.config
              {{- if not $generate }}
              readOnly: true
              {{- end }}
            # libratcm.so reaches the host Radio Management Unit through a socket in /tmp.
            # Without it the DU logs "Radio Management Unit is not running".
            - name: host-tmp
              mountPath: /tmp
            {{- end }}
            {{- if $i.o1.enabled }}
            - name: o1-state
              mountPath: /var/lib/ocudu
            {{- end }}
        {{- if and $i.mplane.enabled $i.mplane.dhcp.enabled }}
        - name: mplane-dhcp
          image: {{ $i.mplane.dhcp.image }}
          imagePullPolicy: IfNotPresent
          command:
            - dnsmasq
            - --keep-in-foreground
            - --log-facility=-
            - --conf-file=/etc/firecell/dnsmasq.conf
          securityContext:
            capabilities:
              add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/firecell/dnsmasq.conf
              subPath: dnsmasq.conf
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $i.name }}-config
        - name: launcher
          configMap:
            name: {{ $i.name }}-launcher
            defaultMode: 0755
        - name: logs
          emptyDir: {}
        {{- if $dpdk }}
        - name: hugepages
          hostPath:
            path: /dev/hugepages
            type: DirectoryOrCreate
        {{- end }}
        {{- if and $b210 (dig "sdr" "b210" "usb" true $i.ru) }}
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
        {{- end }}
        {{- if $aw2s }}
        - name: aw2s-libs
          hostPath:
            path: {{ $i.ru.sdr.aw2s.hostLibDir }}
            type: Directory
        - name: aw2s-config
          hostPath:
            path: {{ $i.ru.sdr.aw2s.configDir }}
            type: Directory
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
        {{- end }}
        {{- if $i.o1.enabled }}
        - name: o1-state
          hostPath:
            path: {{ include "firecell-du.o1StatePath" $i }}
            type: DirectoryOrCreate
        {{- end }}
