{{- $i := include "firecell-du.inst" . | fromJson }}
{{- $f1u := dig "network" dict ($i.f1u | default dict) }}
{{- if dig "enabled" false $f1u }}
{{- $cfg := dict
  "cniVersion" "0.3.1"
  "ipam" (dict "type" "static" "addresses" (list (dict "address" $f1u.cidr))) }}
{{- if eq (toString ($f1u.cniType | default "macvlan")) "bridge" }}
{{- $_ := set $cfg "type" "bridge" }}
{{- $_ := set $cfg "bridge" $f1u.master }}
{{- else }}
{{- $_ := set $cfg "type" "macvlan" }}
{{- $_ := set $cfg "master" $f1u.master }}
{{- $_ := set $cfg "mode" "bridge" }}
{{- end }}
# F1-U (GTP-U toward the CU-UP) off the pod network: a macvlan over a direct link to
# the CU node, or a veth on a Linux bridge shared with a CU-UP on this node.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $i.name }}-f1u
  namespace: {{ include "firecell-du.namespace" . }}
  labels:
    app: {{ $i.name }}
    {{- include "firecell-du.labels" . | nindent 4 }}
spec:
  config: {{ toJson $cfg | quote }}
{{- end }}
