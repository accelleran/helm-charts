{{- $np := .Values.networkPolicy }}
{{- if $np.enabled }}
# Who may open a connection to the API pods, which is what makes
# backend.config.trustGatewayHeaders safe: oauth2-proxy sets the identity
# headers and nms-front forwards them unchanged. Core NFs POST
# /api/fcaps without a token on the same port, so a pod in coreNamespace
# could also send X-Forwarded-User. Kubelet probes are left to the CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nms-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nms-api
spec:
  podSelector:
    matchLabels:
      app: nms-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nms-front
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $np.oauth2ProxyLabel | quote }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.rbac.coreNamespace | quote }}
        {{- if .Values.acs.enabled }}
        # fc-acs posts CPE faults to the FCAPS ingest.
        - podSelector:
            matchLabels:
              app: fc-acs
        {{- end }}
        {{- range $np.extraFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# nms-front forwards the identity headers too, so it is closed the same way:
# oauth2-proxy and the listed peers only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nms-front
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nms-front
spec:
  podSelector:
    matchLabels:
      app: nms-front
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $np.oauth2ProxyLabel | quote }}
        {{- range $np.frontExtraFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
{{- if .Values.acs.enabled }}
---
# fc-acs: its northbound API (8080) for the NMS API and workers only; CWMP
# (7547, and 7548 for plain HTTP) from anywhere, since CPE connect from outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fc-acs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: fc-acs
spec:
  podSelector:
    matchLabels:
      app: fc-acs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nms-api
        - podSelector:
            matchLabels:
              app: nms-worker
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 7547
        {{- if .Values.acs.southbound.plainHttp }}
        - protocol: TCP
          port: 7548
        {{- end }}
{{- end }}
{{- end }}
