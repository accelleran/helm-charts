{{- if and .Values.ingress.enabled .Values.cmConsole.enabled }}
{{- $path := trimSuffix "/" .Values.cmConsole.path }}
# The bare path (/nms-cm) is redirected to /nms-cm/ so the console's relative
# asset URLs resolve. The path below is a regex anchored with `$`, so this
# Ingress needs use-regex itself. ingress-nginx does already apply regex
# matching to every path on a host once any Ingress for that host sets
# use-regex or rewrite-target, as cm-nms below does. Relying on that would
# leave the redirect working only because of another object's annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cm-nms-slash-redirect
  namespace: {{ .Values.cmConsole.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: https://{{ .Values.ingress.hostname }}{{ $path }}/
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: {{ $path }}$
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.cmConsole.service.name }}
                port:
                  number: {{ .Values.cmConsole.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cm-nms
  namespace: {{ .Values.cmConsole.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: {{ $path }}/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.cmConsole.service.name }}
                port:
                  number: {{ .Values.cmConsole.service.port }}
{{- end }}
