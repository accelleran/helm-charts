# Standalone PVC so it sorts before templates/redis/deployment.yaml (lexicographic path order).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nms-redis-data
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ required "firecell-nms: set global.storageClass to your StorageClass name (see values.yaml)" .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
