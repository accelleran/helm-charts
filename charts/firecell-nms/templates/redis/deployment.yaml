apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nms-redis
  template:
    metadata:
      labels:
        app: nms-redis
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.imageOverride | default (printf "%s/%s" .Values.global.imageRegistry .Values.redis.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: nms-redis-data
