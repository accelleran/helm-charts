{{- if .Values.acs.enabled }}
{{- /*
Credentials of fc-acs, generated on the first install and read back from the
live Secret on every later render, so an upgrade never changes them. lookup
finds nothing under helm template or a client-side dry run: those render
fresh random values, which is expected. Kept on uninstall, like the database
whose user they belong to.
*/}}
{{- $live := lookup "v1" "Secret" .Release.Namespace "fc-acs" }}
{{- $data := dict }}
{{- if $live }}
{{- $data = $live.data | default dict }}
{{- end }}
{{- $password := "" }}
{{- if hasKey $data "database-password" }}
{{- $password = index $data "database-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: fc-acs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: fc-acs
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  database-password: {{ $password | b64enc | quote }}
  database-url: {{ index $data "database-url" | default (printf "mysql+pymysql://acs:%s@nms-db:3306/firecell_acs" $password | b64enc) | quote }}
  northbound-token: {{ index $data "northbound-token" | default (randAlphaNum 32 | b64enc) | quote }}
  credential-key: {{ index $data "credential-key" | default (randAlphaNum 48 | b64enc) | quote }}
{{- end }}
