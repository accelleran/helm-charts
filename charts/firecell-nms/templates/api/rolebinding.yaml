{{- if or (not (hasKey .Values.api "enabled")) .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nms-api-pod-reader
  namespace: {{ .Values.api.coreNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nms-api-pod-reader
subjects:
  - kind: ServiceAccount
    name: nms-api
    namespace: {{ .Values.global.namespace }}
{{- end }}
