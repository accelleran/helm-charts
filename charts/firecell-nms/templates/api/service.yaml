{{- if or (not (hasKey .Values.api "enabled")) .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nms-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-api
spec:
  selector:
    app: nms-api
  ports:
    - name: http
      port: 5001
      targetPort: 5001
      protocol: TCP
{{- end }}
