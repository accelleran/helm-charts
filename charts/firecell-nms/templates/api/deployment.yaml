{{- if or (not (hasKey .Values.api "enabled")) .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-api
spec:
  {{- /* sprig default treats 0 as empty, which would start a retired API */}}
  replicas: {{ hasKey .Values.api "replicas" | ternary .Values.api.replicas 1 }}
  selector:
    matchLabels:
      app: nms-api
  template:
    metadata:
      labels:
        app: nms-api
    spec:
      serviceAccountName: nms-api
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "firecell-nms.waitForDb" . | nindent 8 }}
        {{- include "firecell-nms.waitForRedis" . | nindent 8 }}
      containers:
        - name: nms-api
          image: {{ .Values.api.imageOverride | default (printf "%s/%s:v%s" .Values.global.imageRegistry .Values.api.image (.Values.api.imageTag | default .Values.global.pkgVersion)) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - flask
            - run
            - --host
            - "0.0.0.0"
            - --port
            - "5001"
          workingDir: /app
          env:
            - name: backend_version
              value: {{ .Values.api.schemaVersion | default .Values.global.pkgVersion | quote }}
            - name: PYTHONUNBUFFERED
              value: "0"
            - name: PYTHONPATH
              value: /app
            - name: FIRST_CONNECTION_TO_CN_AGENT
              value: "0"
            # Database — connects to Service "db" on port 3310 (→ MySQL 3306)
            - name: FIRECELL_NMS_API_DATABASE_PORT
              value: "3310"
            # Redis — connects to Service "redis-cache" on port 6799 (→ Redis 6379)
            - name: REDIS_CACHE_HOST
              value: redis-cache
            - name: REDIS_CACHE_PORT
              value: "6799"
            - name: REDIS_CACHE_DB
              value: "0"
            # Victoria Metrics
            - name: FIRECELL_NMS_API_VICTORIA_METRICS_URL
              value: http://nms-api-victoria-metrics-dev:8430
            # Mail
            - name: FIRECELL_NMS_API_MAIL_SERVER
              value: {{ .Values.api.mailServer | quote }}
            - name: FIRECELL_NMS_API_MAIL_PORT
              value: {{ .Values.api.mailPort | quote }}
            - name: FIRECELL_NMS_API_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nms-secrets
                  key: mail-username
            - name: FIRECELL_NMS_API_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nms-secrets
                  key: mail-password
            # Deployment context
            - name: DEPLOYMENT_TYPE
              value: kubernetes
            - name: TZ
              value: {{ .Values.global.timezone }}
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health_check
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health_check
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
