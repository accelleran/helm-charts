{{- if or (not (hasKey .Values.api "enabled")) .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nms-api-pod-reader
  namespace: {{ .Values.api.coreNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
{{- end }}
