{{- $rbac := .Values.rbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
automountServiceAccountToken: true
---
# In coreNamespace, which must exist before install. Binds the ServiceAccount
# from the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nms-runtime
  namespace: {{ $rbac.coreNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  # The CM runtime reads pods. Pod names are dynamic, so resourceNames
  # cannot narrow list/watch.
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Support bundles read bounded pod logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- with $rbac.deploymentNames }}
  # Lifecycle operations (restart, stop, start) on these Deployments only.
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames:
      {{- toYaml . | nindent 6 }}
    verbs: ["get", "patch", "update"]
  {{- end }}
  # Intent ConfigMap names come from the runtime inventory. Kubernetes does
  # not permit resourceNames on create, so access stays namespace-scoped.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nms-runtime
  namespace: {{ $rbac.coreNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nms-runtime
subjects:
  - kind: ServiceAccount
    name: nms
    namespace: {{ .Release.Namespace }}
{{- if and $rbac.ranNamespace $rbac.ranDeploymentNames }}
---
# RAN Deployments (the ocudu DU) outside coreNamespace. Pods are read so the
# lifecycle can follow the rollout.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nms-ran
  namespace: {{ $rbac.ranNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames:
      {{- toYaml $rbac.ranDeploymentNames | nindent 6 }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nms-ran
  namespace: {{ $rbac.ranNamespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nms-ran
subjects:
  - kind: ServiceAccount
    name: nms
    namespace: {{ .Release.Namespace }}
{{- end }}
