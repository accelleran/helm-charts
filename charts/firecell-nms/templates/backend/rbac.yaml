apiVersion: v1
kind: ServiceAccount
metadata:
  name: nms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
automountServiceAccountToken: true
---
# The control plane's own account. It has what `nms` has in the core and RAN
# namespaces (the core, CU and DU charts bind both accounts), and, alone, the
# SNMP key Secret below: nms-api and nms-worker keep `nms` and cannot read it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nms-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nms-control-plane
automountServiceAccountToken: true
---
# The SNMP northbound key Secret: the control plane creates it, once, the first
# time the module is switched on (sealing key pair and engine ID suffix), as an
# immutable Secret, and reads it afterwards. Kubernetes cannot narrow `create`
# by resourceNames, so the account may create any Secret in this namespace,
# but it can read only this one; it never updates or patches it (a rotation is
# a new Secret).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nms-control-plane-snmp-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nms-control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nms-snmp-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nms-control-plane-snmp-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: nms-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nms-control-plane-snmp-keys
subjects:
  - kind: ServiceAccount
    name: nms-control-plane
    namespace: {{ .Release.Namespace }}
---
# Grants nothing until the core chart binds it in coreNamespace, together
# with its own Role on its Deployments (see the README). The name carries the
# release namespace, which the binding charts already need for the subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nms-core-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  # The CM runtime reads pods. Pod names are dynamic, so resourceNames
  # cannot narrow list/watch.
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Support bundles read bounded pod logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Intent ConfigMap names come from the runtime inventory. Kubernetes does
  # not permit resourceNames on create, so access stays namespace-scoped.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
# Bound in ranNamespace by every CU-CP, CU-UP and DU chart, each with its own
# Role on its Deployments. Pods are read so the lifecycle can follow the
# rollout.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nms-ran-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
