apiVersion: v1
kind: ServiceAccount
metadata:
  name: nms
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
automountServiceAccountToken: true
---
# Grants nothing until the core chart binds it in coreNamespace, together
# with its own Role on its Deployments (see the README). The name carries the
# release namespace, which the binding charts already need for the subject.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nms-core-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  # The CM runtime reads pods. Pod names are dynamic, so resourceNames
  # cannot narrow list/watch.
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Support bundles read bounded pod logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Intent ConfigMap names come from the runtime inventory. Kubernetes does
  # not permit resourceNames on create, so access stays namespace-scoped.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
# Bound in ranNamespace by every CU-CP, CU-UP and DU chart, each with its own
# Role on its Deployments. Pods are read so the lifecycle can follow the
# rollout.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nms-ran-{{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
{{- with .Values.backend.branding.configMap }}
---
# The site's logos and colours (backend.branding.configMap): nms-api writes
# this one ConfigMap in its own namespace with kubectl create / replace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nms-branding
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get", "update", "delete"]
  # Kubernetes does not narrow create by name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nms-branding
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: nms
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nms-branding
{{- end }}
