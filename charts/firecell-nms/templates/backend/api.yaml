{{- $be := .Values.backend }}
{{- $pc := $be.passwordCheck }}
{{- if and $pc.zitadelUrl (not $pc.patSecret) }}{{ fail "backend.passwordCheck.patSecret is required when backend.passwordCheck.zitadelUrl is set" }}{{- end }}
{{- if and $pc.patSecret (not $pc.zitadelUrl) }}{{ fail "backend.passwordCheck.zitadelUrl is required when backend.passwordCheck.patSecret is set" }}{{- end }}
{{- if lt (int $be.api.replicas) 2 }}{{ fail "backend.api.replicas must be at least 2" }}{{- end }}
{{- if le (int $be.progressDeadlineSeconds) (int $be.terminationGracePeriodSeconds) }}{{ fail "backend.progressDeadlineSeconds must exceed backend.terminationGracePeriodSeconds: new pods wait for the old control plane to stop and the migration to finish" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-api
    app.kubernetes.io/component: nms-api
spec:
  replicas: {{ $be.api.replicas }}
  progressDeadlineSeconds: {{ $be.progressDeadlineSeconds }}
  selector:
    matchLabels:
      app: nms-api
  template:
    metadata:
      labels:
        app: nms-api
        app.kubernetes.io/component: nms-api
        app.kubernetes.io/part-of: firecell-nms
      annotations:
        {{- include "firecell-nms.backend.checksum" . | nindent 8 }}
    spec:
      serviceAccountName: nms
      securityContext:
        {{- include "firecell-nms.backend.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ $be.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nms-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nms-api
      initContainers:
        {{- include "firecell-nms.backend.schemaCheck" (dict "root" . "name" "wait-for-schema" "untilHead" true) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "firecell-nms.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["firecell-nms-ng-api"]
          securityContext:
            {{- include "firecell-nms.backend.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef: {name: nms-config}
          env:
            {{- include "firecell-nms.backend.env" . | nindent 12 }}
            {{- if $pc.zitadelUrl }}
            - {name: FIRECELL_NMS_NG_ZITADEL_URL, value: {{ $pc.zitadelUrl | quote }}}
            - {name: FIRECELL_NMS_NG_ZITADEL_SESSION_PAT_FILE, value: /etc/firecell-nms/zitadel/pat}
            {{- if $pc.caSecret }}
            - {name: FIRECELL_NMS_NG_ZITADEL_CA_FILE, value: /etc/firecell-nms/zitadel-ca/ca.crt}
            {{- end }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $be.api.resources | nindent 12 }}
          volumeMounts:
            - {name: kubeconfig, mountPath: /etc/firecell-nms/kubeconfig, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $pc.zitadelUrl }}
            - {name: zitadel-pat, mountPath: /etc/firecell-nms/zitadel, readOnly: true}
            {{- if $pc.caSecret }}
            - {name: zitadel-ca, mountPath: /etc/firecell-nms/zitadel-ca, readOnly: true}
            {{- end }}
            {{- end }}
      volumes:
        - name: kubeconfig
          configMap:
            name: nms-kubeconfig
            defaultMode: 0444
        - {name: tmp, emptyDir: {}}
        {{- if $pc.zitadelUrl }}
        # A mounted Secret (not an env var) follows rotation without a restart.
        - name: zitadel-pat
          secret:
            secretName: {{ $pc.patSecret | quote }}
            optional: true
            defaultMode: 0440
            items:
              - {key: {{ $pc.patKey | quote }}, path: pat}
        {{- if $pc.caSecret }}
        - name: zitadel-ca
          secret:
            secretName: {{ $pc.caSecret | quote }}
            optional: true
            defaultMode: 0444
            items:
              - {key: {{ $pc.caKey | quote }}, path: ca.crt}
        {{- end }}
        {{- end }}
---
# The API, the FCAPS notification receiver and the Grafana alert webhook
# (/api/alarms/webhook) all listen here.
apiVersion: v1
kind: Service
metadata:
  name: nms-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-api
    app.kubernetes.io/component: nms-api
spec:
  type: ClusterIP
  selector:
    app: nms-api
  ports:
    - {name: http, port: 8080, targetPort: http}
