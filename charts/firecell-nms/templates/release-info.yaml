{{- /*
What this release rendered, for the NMS support bundles and drift checks:
the NMS reads no Helm release Secret. No values content and nothing from a
Secret: the values appear only as a digest. List every template that
renders a pod.
*/}}
{{- $ns := .Release.Namespace }}
{{- $name := printf "%s-release-info" .Release.Name }}
{{- $templates := list
      "backend/api.yaml"
      "backend/worker.yaml"
      "backend/control-plane.yaml"
      "backend/database.yaml"
      "front/deployment.yaml"
      "victoria-metrics/deployment.yaml"
}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    firecell.io/release-info: "true"
data:
  release.json: {{ include "firecell-nms.releaseInfo.record" (dict "root" . "namespace" $ns "templates" $templates) | quote }}
  history.json: {{ include "firecell-nms.releaseInfo.history" (dict "root" . "live" (lookup "v1" "ConfigMap" $ns $name)) | quote }}
