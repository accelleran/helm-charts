{{- $backendUrl := .Values.front.backendUrl | default (include "firecell-nms.backend.url" .) }}
{{- $cmUrl := .Values.front.cmUrl | default (printf "%s/ui" (include "firecell-nms.backend.url" .)) }}
{{- $metricsUrl := .Values.front.metricsUrl | default (include "firecell-nms.victoriaMetrics.url" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nms-front-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
data:
  default.conf: |
    # nginx config for NMS frontend in Kubernetes
    # /api/* routed to front.backendUrl (the in-chart nms-api by default).
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy — route all API calls to the backend k8s Service
        location /api/ {
            proxy_pass {{ $backendUrl }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # CM console: the backend's built-in /ui/.
        location = /nms-cm {
            return 302 /nms-cm/;
        }

        location /nms-cm/ {
            proxy_pass {{ trimSuffix "/" $cmUrl }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Device Performance charts query VictoriaMetrics PromQL here
        # (/metrics-api/query_range -> /api/v1/query_range).
        location /metrics-api/ {
            proxy_pass {{ trimSuffix "/" $metricsUrl }}/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

{{- if .Values.front.grafanaUrl }}
        # The UI links to <origin>/grafana/d/...; Grafana lives on its own
        # host here, so send the browser there with the path and query intact.
        location = /grafana {
            return 302 {{ trimSuffix "/" .Values.front.grafanaUrl }}/;
        }
        location /grafana/ {
            rewrite ^/grafana/(.*)$ {{ trimSuffix "/" .Values.front.grafanaUrl }}/$1 redirect;
        }
{{- end }}

        # Handle manifest and other meta files
        location ~* \.(manifest|json|xml)$ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # React Router — handle all other routes
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
