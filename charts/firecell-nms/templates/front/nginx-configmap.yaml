apiVersion: v1
kind: ConfigMap
metadata:
  name: nms-front-nginx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
data:
  default.conf: |
    # nginx config for NMS frontend in Kubernetes
    # /api/* routed to nms-api Service (not 127.0.0.1 — no host network in k8s)
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy — route all API calls to the backend k8s Service
        location /api/ {
            proxy_pass http://nms-api:5001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
        }

        # Handle manifest and other meta files
        location ~* \.(manifest|json|xml)$ {
            expires 1d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # React Router — handle all other routes
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
