apiVersion: v1
kind: Service
metadata:
  name: nms-front
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-front
spec:
  selector:
    app: nms-front
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
