# Standalone PVC; path sorts before templates/grafana/deployment.yaml (lex order: grafana- before grafana/).
# local-path only binds a claim when a pod mounts it, and Helm --wait waits
# for that bind. With Grafana scaled to 0 there is no pod, so skip the claim.
{{- if and (or (not (hasKey .Values.grafana "enabled")) .Values.grafana.enabled) (gt (int .Values.grafana.replicas) 0) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nms-grafana-data
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ required "firecell-nms: set global.storageClass to your StorageClass name (see values.yaml)" .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage }}
{{- end }}
