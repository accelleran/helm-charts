apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-victoria-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-victoria-metrics
spec:
  replicas: 1
  # One pod on a ReadWriteOnce volume, and VictoriaMetrics locks its data
  # directory: a rolling update starts the new pod beside the old one, the new
  # pod cannot take the lock and crash-loops, and the old one is never stopped.
  # Recreate stops the old pod first (a short gap in writes and queries).
  # rollingUpdate: null removes the defaulted field on an upgrade of an existing
  # release; the API server refuses Recreate while it is still set.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: nms-victoria-metrics
  template:
    metadata:
      labels:
        app: nms-victoria-metrics
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: victoria-metrics
          image: {{ include "firecell-nms.image" (dict "global" .Values.global "image" .Values.victoriaMetrics.image "name" "victoriaMetrics.image") | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - --storageDataPath=/victoria-metrics-data
            - --httpListenAddr=:8430
            - --retentionPeriod={{ .Values.victoriaMetrics.retentionPeriod }}
            - --maxLabelsPerTimeseries={{ .Values.victoriaMetrics.maxLabelsPerTimeseries }}
            - --maxConcurrentInserts={{ .Values.victoriaMetrics.maxConcurrentInserts }}
            {{- with .Values.victoriaMetrics.searchLatencyOffset }}
            - --search.latencyOffset={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8430
              protocol: TCP
          volumeMounts:
            - name: vm-data
              mountPath: /victoria-metrics-data
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8430
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8430
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: vm-data
          persistentVolumeClaim:
            claimName: nms-vm-data
