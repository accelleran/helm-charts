# Service name matches Grafana datasource URL hardcoded in image:
# http://nms-api-victoria-metrics-dev:8430 — zero config change needed.
apiVersion: v1
kind: Service
metadata:
  name: nms-api-victoria-metrics-dev
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-victoria-metrics
spec:
  selector:
    app: nms-victoria-metrics
  ports:
    - name: http
      port: 8430
      targetPort: 8430
      protocol: TCP
