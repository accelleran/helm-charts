{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nms-grafana
  template:
    metadata:
      labels:
        app: nms-grafana
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-victoria
          image: {{ .Values.global.busyboxImage | default (printf "%s/busybox:stable" .Values.global.imageRegistry) }}
          command:
            - /bin/sh
            - -c
            - |
              until wget -q --spider http://nms-api-victoria-metrics-dev:8430/health 2>/dev/null; do
                echo "Victoria Metrics not ready, retrying in 3s..."
                sleep 3
              done
      containers:
        - name: grafana
          image: {{ .Values.grafana.imageOverride | default (printf "%s/%s" .Values.global.imageRegistry .Values.grafana.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nms-secrets
                  key: grafana-admin-password
            - name: GF_INSTALL_PLUGINS
              value: ""
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: publicDashboards
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_NAME
              value: "Main Org."
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Editor
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: "https://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: nms-grafana-data
        - name: grafana-datasources
          configMap:
            name: nms-grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: nms-grafana-dashboards-config
{{- end }}
