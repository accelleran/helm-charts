{{- if or (not (hasKey .Values.grafana "enabled")) .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: nms-grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-grafana
spec:
  selector:
    app: nms-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
{{- end }}
