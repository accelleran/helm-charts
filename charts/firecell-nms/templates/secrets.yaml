# nms-secrets must be pre-created before helm install:
#   kubectl create secret generic nms-secrets \
#     --from-literal=db-root-password=<pass> \
#     --from-literal=db-password=<pass> \
#     --from-literal=mail-username=<user> \
#     --from-literal=mail-password=<pass> \
#     -n firecell-nms
#
# This chart does NOT create nms-secrets to avoid storing credentials in values.yaml.
# Deployments reference it via envFrom/secretKeyRef.
