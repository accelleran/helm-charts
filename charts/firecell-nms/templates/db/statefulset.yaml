{{- if or (not (hasKey .Values.db "enabled")) .Values.db.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nms-db
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-db
spec:
  serviceName: nms-db-headless
  {{- /* sprig default treats 0 as empty, which would start a retired database */}}
  replicas: {{ hasKey .Values.db "replicas" | ternary .Values.db.replicas 1 }}
  selector:
    matchLabels:
      app: nms-db
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nms-db
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: {{ .Values.db.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nms-secrets
                  key: db-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.db.database }}
            - name: MYSQL_USER
              value: {{ .Values.db.user }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nms-secrets
                  key: db-password
            - name: TZ
              value: {{ .Values.global.timezone }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: nms-db-data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: 01-init-sql-script.sql
            - name: init-scripts
              mountPath: /etc/mysql/conf.d/custom-my.cnf
              subPath: my.cnf
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: nms-db-init
  volumeClaimTemplates:
    - metadata:
        name: nms-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.storage }}
{{- end }}
