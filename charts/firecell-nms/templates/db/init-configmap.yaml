{{- if or (not (hasKey .Values.db "enabled")) .Values.db.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nms-db-init
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "firecell-nms.labels" . | nindent 4 }}
    app: nms-db
data:
  my.cnf: |
    [mysqld]
    secure-file-priv = ""
    skip-log-bin

  # NMS schema — executed automatically by MySQL on first start
  01-init-sql-script.sql: |
    USE {{ .Values.db.database }};

    CREATE TABLE IF NOT EXISTS CoreNetworkElement (
      id integer PRIMARY KEY AUTO_INCREMENT,
      address VARCHAR(128),
      name VARCHAR(128),
      status VARCHAR(32),
      isHealthy BOOLEAN,
      ipPoolAddress VARCHAR(32),
      ipPoolNetmask VARCHAR(32),
      bitrateMaxUplink INT,
      bitrateMaxDownlink INT,
      opKey VARCHAR(32)
    );
    CREATE TABLE IF NOT EXISTS Plmn (
      id integer PRIMARY KEY AUTO_INCREMENT,
      core_id INT,
      plmn VARCHAR(32),
      mnc VARCHAR(32),
      mcc VARCHAR(32),
      mnc_length INT
    );
    CREATE TABLE IF NOT EXISTS Snssai (
      core_id_plmn VARCHAR(32) PRIMARY KEY,
      core_id INT,
      plmn VARCHAR(32),
      sst INT,
      sd VARCHAR(32)
    );
    CREATE TABLE IF NOT EXISTS coreBitrates (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cnId INT,
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS coreResources (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cnId INT,
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS RanNetworkElement (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cnId INT,
      address VARCHAR(32),
      name VARCHAR(32),
      type VARCHAR(32),
      position VARCHAR(32),
      frequencyBand VARCHAR(32),
      tac INT,
      ran_type VARCHAR(32),
      ran_id_length INT,
      ran_id INT,
      n3_ip_address VARCHAR(64),
      amf_address VARCHAR(64),
      connectivity BOOLEAN,
      is_alive BOOLEAN
    );
    CREATE TABLE IF NOT EXISTS ranN3Bitrates (
      id integer PRIMARY KEY AUTO_INCREMENT,
      ran_id INT,
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS coreN3Bitrates (
      id integer PRIMARY KEY AUTO_INCREMENT,
      core_id INT,
      uplink FLOAT,
      downlink FLOAT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS cells (
      id VARCHAR(32) PRIMARY KEY,
      coreId INT,
      ranId INT,
      name VARCHAR(32),
      type VARCHAR(32),
      status VARCHAR(32),
      position VARCHAR(32),
      bandwidth INT,
      frequency INT,
      scs INT,
      uplinkBandwidth INT,
      downlinkBandwidth INT,
      online_devices INT,
      frequencyBand VARCHAR(32),
      tac INT,
      nr_cell_id VARCHAR(32),
      ran_id INT,
      tx_layer INT,
      rx_layer INT,
      tdd_pattern INT,
      tdd_pattern_alias VARCHAR(128),
      physicall_cell_id INT,
      possible_tdd_pattern_list TEXT,
      dl_arfcn INT,
      ul_arfcn INT,
      is_cell_active BOOLEAN DEFAULT FALSE,
      mcc VARCHAR(8),
      mnc VARCHAR(8),
      sst INT,
      sd VARCHAR(32),
      cell_local_id INT
    );
    CREATE TABLE IF NOT EXISTS cellBitrates (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cellId VARCHAR(32),
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS cellResources (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cellId VARCHAR(32),
      uplink FLOAT,
      downlink FLOAT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS cellDevicesHistory (
      id integer PRIMARY KEY AUTO_INCREMENT,
      cellId VARCHAR(32),
      devices INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS devices (
      imsi VARCHAR(32) PRIMARY KEY,
      cellId VARCHAR(32),
      imei VARCHAR(32),
      name VARCHAR(32),
      type VARCHAR(32),
      status VARCHAR(32),
      tac INT,
      encryptionKey VARCHAR(64),
      opKey VARCHAR(64),
      opcKey VARCHAR(64),
      isIpAllocatedStatic BOOLEAN,
      ipAddress VARCHAR(64),
      qos VARCHAR(64),
      dnn_id INT,
      ran_ngap_id VARCHAR(32),
      amf_ngap_id VARCHAR(32),
      cu_f1ap_id VARCHAR(32),
      du_f1ap_id VARCHAR(32),
      crnti VARCHAR(32)
    );
    CREATE TABLE IF NOT EXISTS ipPool (
      id INT PRIMARY KEY AUTO_INCREMENT,
      ipAddress VARCHAR(64),
      dnn_id INT,
      isIpAllocatedStatic BOOLEAN,
      imsi VARCHAR(32)
    );
    CREATE TABLE IF NOT EXISTS dnn (
      id INT PRIMARY KEY AUTO_INCREMENT,
      name VARCHAR(64) UNIQUE,
      subnet VARCHAR(64)
    );
    CREATE TABLE IF NOT EXISTS ueBitrates (
      id integer PRIMARY KEY AUTO_INCREMENT,
      ueId INT,
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS ueResources (
      id integer PRIMARY KEY AUTO_INCREMENT,
      ueId INT,
      uplink INT,
      downlink INT,
      timestamp DATETIME
    );
    CREATE TABLE IF NOT EXISTS users (
      id INT PRIMARY KEY AUTO_INCREMENT,
      name VARCHAR(32),
      firstName VARCHAR(32),
      role VARCHAR(32),
      isAdmin BOOLEAN,
      email VARCHAR(32),
      hashPassword VARCHAR(255),
      isFirstConnexion BOOLEAN,
      theme VARCHAR(32),
      language VARCHAR(32)
    );
    CREATE TABLE IF NOT EXISTS connexion_tokens (
      id INT PRIMARY KEY AUTO_INCREMENT,
      userId INT,
      token VARCHAR(255),
      expirationDate DATETIME
    );
    CREATE TABLE IF NOT EXISTS password_tokens (
      id INT PRIMARY KEY AUTO_INCREMENT,
      userId INT,
      token VARCHAR(255),
      expirationDate DATETIME
    );
    CREATE TABLE IF NOT EXISTS userLog (
      id int NOT NULL PRIMARY KEY AUTO_INCREMENT,
      userId INT NOT NULL,
      user VARCHAR(255) NOT NULL,
      log VARCHAR(255) NOT NULL,
      date DATETIME NOT NULL
    );
    CREATE TABLE IF NOT EXISTS networkLog (
      id int NOT NULL PRIMARY KEY AUTO_INCREMENT,
      log VARCHAR(255) NOT NULL,
      date DATETIME NOT NULL
    );
    CREATE TABLE IF NOT EXISTS qos (
      id int NOT NULL PRIMARY KEY AUTO_INCREMENT,
      rule_order INT,
      ip VARCHAR(32),
      mask INT,
      port_start INT,
      port_stop INT,
      type_of_service INT,
      direction ENUM ('source', 'destination', 'both'),
      category INT,
      description VARCHAR(255),
      derived_rule_name VARCHAR(32),
      flow_description_index INT
    );
    CREATE TABLE IF NOT EXISTS Version (
      version VARCHAR(64) PRIMARY KEY
    );
    TRUNCATE TABLE Version;
    INSERT INTO Version (version) VALUES ('4.2.0');

    CREATE TABLE IF NOT EXISTS initialNetworkConnection (
      id VARCHAR(32) PRIMARY KEY,
      connectionFlag INT
    );
    INSERT INTO initialNetworkConnection (id, connectionFlag)
    VALUES ('initialNetworkConnection', 0);

    CREATE TABLE IF NOT EXISTS nmsInitialization (
      id INT PRIMARY KEY AUTO_INCREMENT,
      initializationKey VARCHAR(32) UNIQUE NOT NULL,
      isInitialized BOOLEAN NOT NULL
    );
    INSERT INTO nmsInitialization (initializationKey, isInitialized)
    VALUES ('nmsStartup', 0);

    INSERT INTO users (
      name,
      firstName,
      role,
      isAdmin,
      email,
      hashPassword,
      isFirstConnexion,
      language,
      theme
    )
    VALUES (
      'admin',
      'admin',
      'admin',
      1,
      'admin',
      'pbkdf2:sha256:260000$RBEVcdUh9Vr0TsuJ$d0339f2afc51fc9480cd79b4e36c5b782ebcc0bc2514d96e4da437d213c8bb38',
      0,
      'en',
      'light'
    );
{{- end }}
