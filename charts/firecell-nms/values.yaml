# Firecell NMS: the nginx frontend, the backend (API, worker, control plane
# and its MySQL) and VictoriaMetrics. Install one release per namespace:
# Service names are fixed so other releases can rely on them.

# Every image is one full reference (registry/repository:tag[@digest]) with
# an exact tag, so a mirror or a digest pin is a single value per image.

global:
  # -- Pull policy of every image in the chart.
  imagePullPolicy: IfNotPresent
  # -- Pull secrets of every pod in the chart, e.g. `[{name: ghcr-pull}]`.
  imagePullSecrets: []
  # -- StorageClass of every PVC. Must be non-empty: omitting storageClassName
  # lets the API inject the default StorageClass, and Helm upgrades then try
  # to unset it (immutable field).
  storageClass: "local-path"

# --- Backend ---
backend:
  # -- Backend image (API, worker, control plane, migration and bootstrap),
  # as a full reference.
  image: ghcr.io/accelleran/nms-backend:edge-1501118
  # -- Secret with the backend credentials, created before install; the
  # chart never creates it. Required keys: `database-root-password`,
  # `database-password`, `database-url`, `network-name`, `op`,
  # `api-tokens-json`, `default-admin-user`, `default-admin-password`
  # (see README).
  existingSecret: nms-secrets
  # -- Longer than the backend's slowest lifecycle operation (600s), so
  # workers and the control plane can finish in-flight work after SIGTERM.
  # On an image change the new control plane, and so the migration, starts
  # only after the old one has stopped: up to this long.
  terminationGracePeriodSeconds: 660
  # -- Rollout deadline of the API and worker Deployments. New pods wait for
  # the old control plane to stop and the migration to finish, so it must
  # exceed terminationGracePeriodSeconds plus the migration time. Keep the
  # Helm / HelmRelease timeout above it.
  progressDeadlineSeconds: 1200

  api:
    # -- API replicas (at least 2).
    replicas: 2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}

  worker:
    # -- Worker replicas (at least 1).
    replicas: 1
    # -- Job threads per worker.
    threads: 4
    # -- Seconds a new worker must stay up before it counts as available
    # (its probes only check that the process lives).
    minReadySeconds: 20
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}

  # The control plane is always exactly one pod, a StatefulSet of one: a
  # replacement starts only once the old pod is gone. Its init containers
  # check and migrate the schema and bootstrap the catalogue.
  controlPlane:
    # -- Seconds the control plane must stay up before it counts as
    # available (its probes only check that the process lives).
    minReadySeconds: 20
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}

  # -- Resources of the check-schema, migrate, bootstrap and wait-for-schema
  # init containers.
  initResources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

  database:
    # -- Backend MySQL image, as a full reference.
    image: docker.io/library/mysql:8.4.10
    # -- Database the backend uses; `database-url` must name it.
    name: firecell_nms
    # -- MySQL user the backend connects as, with privileges on `name` only;
    # `database-url` must name it. Created on the database's first start.
    user: nms
    # -- Size of PVC nms-db-data (kept on uninstall).
    storage: 10Gi
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}

  endpoints:
    # -- UDR provisioning API. Empty: `http://oai-udr.<rbac.coreNamespace>.svc.cluster.local:8080`.
    udr: ""
    # -- PCF API. Empty: `http://oai-pcf.<rbac.coreNamespace>.svc.cluster.local:8080`.
    pcf: ""
    # -- IMS API. Empty: `http://ims.<rbac.coreNamespace>.svc.cluster.local:8080`.
    ims: ""
    # -- Where PM reports and alarm gauges are written. Empty: the in-chart
    # VictoriaMetrics. Grafana alert rules read core_alarm_active from here
    # and post to /api/alarms/webhook, so without it no alarm arrives.
    victoria: ""
    # -- ext-dn probe sidecar for device ping (enable extDn.sidecar in
    # firecell-5gc first), e.g. `http://oai-ext-dn.firecell-core.svc.cluster.local:8080`.
    # Empty: the ping routes answer 503.
    extdnProbe: ""

  config:
    # -- JSON string array of allowed WebSocket origins.
    allowedWsOriginsJson: "[]"
    # -- JSON object array of extra S-NSSAIs given to new subscribers.
    defaultSnssaisJson: "[]"
    defaultPlmn: "00101"
    # -- Level-1 "Data network" instances the bootstrap seeds on an EMPTY
    # catalogue. Pass the DNNs the 5GC chart runs, e.g.
    # `[{"dnn":"oai","ipv4Subnet":"12.1.1.0/25","pduSessionType":"IPV4"}]`.
    # Empty keeps the built-in seed (a DNN called "default").
    seedDnnsJson: ""
    # -- The first slice the bootstrap seeds, e.g. `{"sst":1,"sd":"000001"}`.
    seedSliceJson: ""
    cmConfigMapKey: cm.json
    southboundTimeoutSeconds: 6
    reconcileTimeoutSeconds: 15
    # -- Finished jobs older than this are deleted. 0 keeps everything.
    jobRetentionSeconds: 604800
    # -- nf_observed rows older than this are deleted (the newest 50 per
    # instance always stay). 0 keeps everything.
    observationRetentionSeconds: 604800
    retentionIntervalSeconds: 3600
    # -- How often the operator's PCC rules are re-asserted on the PCF. 0 disables it.
    qosReconcileIntervalSeconds: 30
    qosMaxRules: 4
    # -- Believe X-Forwarded-User / -Groups from oauth2-proxy. Requires
    # networkPolicy.enabled: the backend does not check tokens on this path.
    trustGatewayHeaders: false

  # -- Extra environment (EnvVar list) for the API, worker and control plane,
  # e.g. FIRECELL_NMS_NG_ALARM_REASSERT_INTERVAL.
  extraEnv: []

# --- The 5GC and RAN namespaces the backend manages ---
rbac:
  # -- Namespace of the 5GC NFs: CM intent ConfigMaps, the default southbound
  # URLs and the NetworkPolicy. The chart renders nothing there, so it need
  # not exist yet; the core chart grants the access (see the README).
  coreNamespace: firecell-core
  # -- Namespace of all the CU-CPs, CU-UPs and DUs when they do not run in
  # coreNamespace. When set, RAN-domain elements are rolled there. The chart
  # renders nothing there; the RAN charts grant the access.
  ranNamespace: ""

# --- NetworkPolicies for the gateway identity headers ---
networkPolicy:
  # -- Restrict who reaches the API (nms-api, port 8080) and nms-front
  # (port 80). Needed for backend.config.trustGatewayHeaders.
  enabled: false
  # -- app.kubernetes.io/name label of the oauth2-proxy pods in this namespace.
  oauth2ProxyLabel: oauth2-proxy
  # -- More NetworkPolicyPeers allowed to the API besides nms-front,
  # oauth2-proxy and rbac.coreNamespace: the Grafana that posts alerts to
  # /api/alarms/webhook, the platform monitor that pushes FCAPS.
  extraFrom: []
  # -- More NetworkPolicyPeers allowed to nms-front besides oauth2-proxy,
  # e.g. a landing page that probes /healthz.
  frontExtraFrom: []

# --- Victoria Metrics ---
# Service nms-victoria-metrics, port 8430: point the Grafana datasource here.
victoriaMetrics:
  # -- VictoriaMetrics image, as a full reference.
  image: docker.io/victoriametrics/victoria-metrics:v1.93.4
  # -- Size of PVC nms-vm-data.
  storage: 20Gi
  retentionPeriod: 7d
  maxLabelsPerTimeseries: 50
  maxConcurrentInserts: 16
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m

# --- nginx frontend ---
front:
  # -- NMS frontend (nginx) image, as a full reference. Needs a CM-enabled
  # build that talks to the new backend.
  image: ghcr.io/accelleran/nms-frontend:edge-db0447e
  # -- Where nginx sends /api/. Empty: the in-chart nms-api Service.
  backendUrl: ""
  # -- Where nginx sends /nms-cm/ (the CM console). Empty: the backend's
  # built-in console, `<nms-api>/ui`.
  cmUrl: ""
  # -- VictoriaMetrics base URL for the Device Performance charts
  # (/metrics-api/ -> <metricsUrl>/api/v1/). Empty: the in-chart VictoriaMetrics.
  metricsUrl: ""
  # -- External Grafana base URL (the chart has no Grafana of its own). The UI
  # links to <origin>/grafana/...; /grafana/ redirects there, path and query
  # intact. Empty leaves the location out.
  grafanaUrl: ""
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
