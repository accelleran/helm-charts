suite: fc-acs Secret
release:
  name: t
  namespace: firecell-nms
templates:
  - templates/acs/secret.yaml
set:
  acs.enabled: true
tests:
  - it: survives uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: fc-acs
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  # The exact key set is pinned by "keeps the live credentials on upgrade":
  # lengthEqual counts arrays only, and fresh values are random.
  - it: holds the four credentials
    asserts:
      - exists:
          path: data["database-password"]
      - exists:
          path: data["database-url"]
      - exists:
          path: data["northbound-token"]
      - exists:
          path: data["credential-key"]
      - notExists:
          path: stringData

  - it: generates the credentials on the first install
    asserts:
      - matchRegex:
          path: data["database-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - matchRegex:
          path: data["database-url"]
          decodeBase64: true
          pattern: ^mysql\+pymysql://acs:[A-Za-z0-9]{32}@nms-db:3306/firecell_acs$
      - matchRegex:
          path: data["northbound-token"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - matchRegex:
          path: data["credential-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{48}$

  - it: keeps the live credentials on upgrade, and nothing else
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: {name: fc-acs, namespace: firecell-nms}
          data:
            database-password: bGl2ZS1wYXNzd29yZA==  # live-password
            database-url: bGl2ZS11cmw=                # live-url
            northbound-token: bGl2ZS10b2tlbg==        # live-token
            credential-key: bGl2ZS1rZXk=              # live-key
    asserts:
      - equal:
          path: data
          value:
            database-password: bGl2ZS1wYXNzd29yZA==
            database-url: bGl2ZS11cmw=
            northbound-token: bGl2ZS10b2tlbg==
            credential-key: bGl2ZS1rZXk=

  - it: builds a missing database URL from the live password
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: {name: fc-acs, namespace: firecell-nms}
          data:
            database-password: bGl2ZS1wYXNzd29yZA==  # live-password
    asserts:
      - equal:
          path: data["database-password"]
          value: bGl2ZS1wYXNzd29yZA==
      - equal:
          path: data["database-url"]
          decodeBase64: true
          value: mysql+pymysql://acs:live-password@nms-db:3306/firecell_acs
      - matchRegex:
          path: data["northbound-token"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
