apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cbrs-domain-proxy.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
