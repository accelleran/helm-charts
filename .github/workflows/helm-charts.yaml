name: Helm Charts

on:
  push:
    branches:
      - main
      - releases/**
  pull_request:
  workflow_dispatch:

# Serialize pushes to main/releases so Please cannot run while another push
# still owes a chart-releaser tag (see #1862 / #1866). PRs stay per-PR and
# may cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  vars:
    name: Variables
    # This is a work-around to be able to properly use variables.
    # This job should be made a dependency in order to be able to use its outputs.
    runs-on: ubuntu-24.04
    outputs:
      is_main_branch: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
      is_release_branch: ${{ github.ref_type == 'branch' && startsWith(github.ref_name, 'releases/') }}
      is_pull_request: ${{ github.event_name == 'pull_request' }}
      target_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      lib_charts: ${{ steps.list-charts.outputs.lib_charts }}
      charts_to_lint: ${{ steps.list-charts.outputs.charts_to_lint }}
      charts_to_test: ${{ steps.list-charts.outputs.charts_to_test }}
      charts_to_test_matrix: ${{ steps.list-charts.outputs.charts_to_test_matrix }}
      # renovate: github_repository=helm/helm versioning=semver extract_version=^v(?<version>.*)$
      helm_version: 4.3.1
    timeout-minutes: 2
    steps:
      - name: Expose variables
        run: echo "Exposing variables for proper usage"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        if: ${{ github.event_name == 'pull_request' }}
        uses: helm/chart-testing-action@v2.8.0

      - name: List charts
        id: list-charts
        run: |
          echo "lib_charts=$(./bin/list-charts ${{ github.event_name == 'pull_request' && format('--changed-only --target-branch={0}', github.base_ref) || '' }} --list --delimiter=, --path lib)" | tee -a $GITHUB_OUTPUT
          echo "charts_to_lint=$(./bin/list-charts ${{ github.event_name == 'pull_request' && format('--changed-only --target-branch={0}', github.base_ref) || '' }} --list --delimiter=, --path lint)" | tee -a $GITHUB_OUTPUT
          echo "charts_to_test=$(./bin/list-charts ${{ github.event_name == 'pull_request' && format('--changed-only --target-branch={0}', github.base_ref) || '' }} --list --delimiter=, --path test)" | tee -a $GITHUB_OUTPUT
          echo "charts_to_test_matrix=$(./bin/list-charts ${{ github.event_name == 'pull_request' && format('--changed-only --target-branch={0}', github.base_ref) || '' }} --matrix test)" | tee -a $GITHUB_OUTPUT

  check-chart-names:
    name: Check chart names
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check published chart names are unique
        run: ./bin/check-chart-name-collisions

  lint-charts:
    name: Lint Charts
    needs:
      - vars
    runs-on: ubuntu-24.04
    if: ${{ needs.vars.outputs.charts_to_lint != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "${{ needs.vars.outputs.helm_version }}"

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Add helm repositories
        run: ./bin/add-repos

      - name: Prepare library charts
        run: |
          lib_charts="${{ needs.vars.outputs.lib_charts }}"
          for lc in ${lib_charts//,/ } ; do
              # Add values.yaml file so the linter doesn't complain
              echo "${lc}/values.yaml"
              touch "${lc}/values.yaml"
          done

      - name: Lint charts
        run: >-
          ct
          lint
          --config etc/ct.yaml
          --charts ${{ needs.vars.outputs.charts_to_lint }}

  test-charts:
    name: Test Charts
    needs:
      - vars
    if: ${{ needs.vars.outputs.charts_to_test != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.vars.outputs.charts_to_test_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "${{ needs.vars.outputs.helm_version }}"

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Add helm repositories
        run: ./bin/add-repos

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Create accelleran pull secret
        run: >-
          kubectl create secret docker-registry
          --namespace default
          accelleran-secret
          --docker-username=${{ secrets.DOCKER_LOGIN }}
          --docker-password=${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Create accelleran license
        run: |-
          cat <<EOF > license.crt
          ${{ secrets.ACCELLERAN_LICENSE }}
          EOF

          kubectl create secret generic \
          --namespace default \
          accelleran-license \
          --from-file=license.crt

      - name: Create CU license
        run: |-
          cat <<EOF > license.crt
          ${{ secrets.ACCELLERAN_CU_LICENSE }}
          EOF

          kubectl create secret generic \
          --namespace default \
          accelleran-cu-license \
          --from-file=license.crt
      
      - name: Pre-install chart hook
        id: pre-install
        run: |
          pre_install_hook="${{ matrix.chart_path }}/pre-install.sh"
          if [ -x "$pre_install_hook" ]; then
            "$pre_install_hook"
          fi

          if ! grep -q "ct_install_args" "$GITHUB_OUTPUT" ; then
            printf "ct_install_args=\n" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Test charts
        run: >-
          ct
          install
          --namespace default
          --config etc/ct.yaml
          --charts ${{ matrix.chart_path }}
          ${{ steps.pre-install.outputs.ct_install_args }}

  # This is a work-around for a required check with matrix in the branch protection rules
  status-charts:
    name: Status Charts
    needs:
      - vars
      - check-chart-names
      - lint-charts
      - test-charts
    if: ${{ needs.vars.outputs.is_pull_request == 'true' && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Successful checks
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing checks
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

  release-charts:
    name: Release Charts
    # !failure() must apply on main too: a job `if` replaces implicit success().
    if: ${{ !cancelled() && !failure() && (needs.vars.outputs.is_main_branch == 'true' || needs.vars.outputs.is_release_branch == 'true') }}
    needs:
      - vars
      - check-chart-names
      - lint-charts
      - test-charts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set git user
        uses: git-actions/set-user@v1

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: "${{ needs.vars.outputs.helm_version }}"

      - name: Add helm repositories
        run: ./bin/add-repos

      - name: Login to Docker Hub
        run: helm registry login --username ${{ secrets.DOCKER_LOGIN }} --password ${{ secrets.DOCKER_ACCESS_TOKEN }} docker.io

      - name: Login to GHCR
        run: helm registry login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io

      - name: Install oras
        uses: oras-project/setup-oras@v1.2.4

      - name: Login to GHCR (oras)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Generate release notes
        run: ./bin/generate-release-notes

      - name: Run chart releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          config: etc/cr.yaml
          skip_existing: true
          oci_registry_url: oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # First-party CR leaves .tgz files in .cr-release-packages and pushes
      # gh-pages without updating origin/gh-pages in this checkout. Later CR
      # passes would then index leftover packages against a stale index.yaml
      # and fail: local changes would be overwritten by merge.
      - name: Reset packages and fetch gh-pages
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          git fetch origin gh-pages

      - name: Run chart releaser for deprecated charts
        if: hashFiles('deprecated/*/Chart.yaml') != ''
        uses: helm/chart-releaser-action@v1.9.0
        with:
          config: etc/cr.yaml
          charts_dir: deprecated
          skip_existing: true
          oci_registry_url: oci://ghcr.io/${{ github.repository_owner }}/charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Reset packages and fetch gh-pages after deprecated charts
        if: hashFiles('deprecated/*/Chart.yaml') != ''
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          git fetch origin gh-pages

      - name: Pull external helm charts
        run: ./bin/pull-external-charts

      - name: Publish external charts
        if: hashFiles('external/*.yaml') != '' || hashFiles('external/*/External.yaml') != ''
        uses: helm/chart-releaser-action@v1.9.0
        with:
          config: etc/cr.yaml
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Copy external charts to GHCR
        run: ./bin/copy-external-charts-to-oci
        env:
          DEST_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

      - name: Apply external chart release notes
        run: ./bin/apply-external-release-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate repo html index
        if: ${{ needs.vars.outputs.is_main_branch == 'true' }}
        run: |-
          # gh-pages has no bin/, so keep the generator outside the checkout.
          cp bin/generate-repo-html "$RUNNER_TEMP/"
          git checkout gh-pages
          git pull # pull index.yaml commit from chart releaser
          "$RUNNER_TEMP/generate-repo-html"
          if ! git diff --exit-code index.html > /dev/null 2>&1 ; then
            git add index.html
            git commit -s -m "Update index.html"
            git push
          fi
          git checkout -

  release-please:
    name: Release
    # !failure() must apply on main too: a job `if` replaces implicit success().
    # Otherwise Please runs when release-charts is skipped/failed (no tag yet) and
    # opens a duplicate release PR — see #1862.
    if: ${{ !cancelled() && !failure() && (needs.vars.outputs.is_main_branch == 'true' || needs.vars.outputs.is_release_branch == 'true') }}
    # Run after release-charts so that the tag exists in case of release commits.
    # Otherwise release please will create a new PR
    # as it doesn't yet have the release to compare changes with.
    needs:
      - vars
      - release-charts
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yaml
    secrets: inherit

  report-private-ghcr-packages:
    name: Report private GHCR packages
    if: ${{ !cancelled() && !failure() && needs.vars.outputs.is_main_branch == 'true' }}
    needs:
      - vars
      - release-charts
    permissions:
      contents: read
      issues: write
      packages: read
    uses: ./.github/workflows/ghcr-package-visibility.yaml
