name: Backfill GHCR

on:
  workflow_dispatch:
    inputs:
      charts:
        description: Comma-separated chart names. Empty publishes the latest version of every chart in the Pages index.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Push latest charts to GHCR
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          # renovate: github_repository=helm/helm versioning=semver extract_version=^v(?<version>.*)$
          version: 4.3.1

      - name: Login to GHCR
        run: helm registry login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Login to GHCR (oras)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Push latest first-party charts
        env:
          CHARTS: ${{ inputs.charts }}
          REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: ./bin/push-charts-to-ghcr

      - name: Copy external charts
        env:
          CHARTS: ${{ inputs.charts }}
          DEST_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
        run: ./bin/copy-external-charts-to-oci

  report-private-ghcr-packages:
    name: Report private GHCR packages
    if: ${{ !cancelled() && !failure() }}
    needs: push
    permissions:
      contents: read
      issues: write
      packages: read
    uses: ./.github/workflows/ghcr-package-visibility.yaml
