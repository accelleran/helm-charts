name: GHCR package visibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  report:
    name: Report private packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Open issues for private GHCR chart packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/report-private-ghcr-packages
