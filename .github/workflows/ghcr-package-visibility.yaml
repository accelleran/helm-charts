name: GHCR package visibility

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write
  packages: read

jobs:
  report:
    name: Report private packages
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open issues for private GHCR chart packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bin/report-private-ghcr-packages
