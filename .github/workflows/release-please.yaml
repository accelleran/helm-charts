name: Release Please

on:
  workflow_call:
  workflow_dispatch:

jobs:

  release-please:
    name: Please
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Get token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
        id: token
      - name: Release please
        if: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'releases/') }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: "etc/release-please-config.json"
          manifest-file: "etc/.release-please-manifest.json"
